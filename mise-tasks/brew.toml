# Homebrew CLI formula E2E suite (e2e/brew), included from mise.toml [task_config]. ~keep

["brew:e2e:lint"]
description = "Lint generated brew E2E launchers and Bats suites"
dir = "{{config_root}}/e2e/brew"
run = "shellcheck *.sh *.bats"

["brew:e2e:test"]
description = "Run brew E2E tests (crawlberg CLI; auto-builds and prepends to PATH)"
depends = ["rust:cli:build", "e2e:build"]
run = 'PATH="$PWD/target/release:$PATH" bash scripts/task/brew-e2e-test.sh'

