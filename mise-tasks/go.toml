# Go binding (packages/go), included from mise.toml [task_config]. The bindings need the Rust FFI
# library built first. ~keep

["go:build"]
description = "Build Go bindings (requires Rust FFI to be built first)"
dir = "{{config_root}}/packages/go"
env = { CGO_ENABLED = "1" }
run = "go build ./..."

["go:build:dev"]
description = "Build Go bindings in debug mode (requires Rust FFI to be built first)"
dir = "{{config_root}}/packages/go"
env = { CGO_ENABLED = "1" }
run = "go build ./..."

["go:build:ci"]
description = "Build Go bindings in CI mode (requires Rust FFI to be built first)"
dir = "{{config_root}}/packages/go"
env = { CGO_ENABLED = "1" }
run = "go build ./..."

["go:test"]
description = "Run Go tests"
env = { ORT_DYLIB_PATH = "/opt/homebrew/lib/libonnxruntime.dylib" }
run = "bash scripts/go/test.sh"
run_windows = 'pwsh -Command "cd packages/go; go test -timeout 10m -v ./..."'

["go:lint"]
description = "Lint and format Go code with auto-fix (golangci-lint + gofmt)"
run = "bash scripts/task/go-lint.sh fix"
run_windows = "pwsh scripts/task/go-lint.ps1 -Mode fix"

["go:lint:check"]
description = "Lint and format Go code in check-only mode (golangci-lint + gofmt, no fixes)"
run = "bash scripts/task/go-lint.sh check"
run_windows = "pwsh scripts/task/go-lint.ps1 -Mode check"

["go:format"]
description = "Format Go code with modifications (gofmt)"
dir = "{{config_root}}/packages/go"
run = "gofmt -w ."

["go:clean"]
description = "Clean Go build artifacts"
dir = "{{config_root}}/packages/go"
run = ["go clean", """python -c "import shutil; shutil.rmtree('bin', ignore_errors=True)\""""]

["go:update"]
description = "Update Go dependencies and linters"
run = "mise run deps upgrade go"

["go:e2e:lint"]
description = "Lint Go E2E code"
run = "bash scripts/task/go-lint.sh check"
run_windows = "pwsh scripts/task/go-lint.ps1 -Mode check"

["go:e2e:test"]
description = "Run Go E2E tests"
run = "bash scripts/e2e/go/test.sh"
run_windows = 'pwsh -Command "cd e2e/go; go test -timeout 30m -v ./..."'

