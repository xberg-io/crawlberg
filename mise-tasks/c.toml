# C FFI (crates/crawlberg-ffi) and its C tests, included from mise.toml [task_config]. The C
# tests and E2E suite link the debug FFI library in target/debug. ~keep

["c:install"]
description = "Verify C build tools are available (cc, make, clang-format, cppcheck)"
run = [
  'command -v cc >/dev/null && echo "cc found" || echo "WARNING: cc not found"',
  'command -v make >/dev/null && echo "make found" || echo "WARNING: make not found"',
]
run_windows = "echo 'C toolchain check - ensure MSVC or MinGW is available'"

["c:setup"]
description = "Setup C build environment (alias for install)"
run = [{ task = "c:install" }]

["c:build"]
description = "Build crawlberg-ffi C library (debug)"
run = "cargo build -p crawlberg-ffi"

["c:build:dev"]
description = "Build crawlberg-ffi C library in debug mode"
run = "cargo build -p crawlberg-ffi"

["c:headers"]
description = "Regenerate canonical and vendored C headers from the FFI source"
env = { ALEF_EXPORT_GENERATED_HEADERS = "1" }
run = "cargo build --locked -p crawlberg-ffi"

["c:headers:check"]
description = "Check every tracked C header copy against the canonical one"
run = "./scripts/ci/check-vendored-headers.sh"

["c:build:release"]
description = "Build crawlberg-ffi C library in release mode"
run = "cargo build -p crawlberg-ffi --release"

["c:build:ci"]
description = "Build crawlberg-ffi C library in CI mode"
run = "cargo build -p crawlberg-ffi"

["c:build:bindings"]
description = "Build C FFI bindings for benchmarking"
run = "cargo build -p crawlberg-ffi --release"

["c:test"]
description = "Run C FFI unit tests"
run = 'make -C crates/crawlberg-ffi/tests/c LIBDIR="$PWD/target/debug" clean all test'
run_windows = "{{vars.unix_only}}"

["c:test:ci"]
description = "Run C FFI unit tests in CI mode"
env = { CI = "true" }
run = 'make -C crates/crawlberg-ffi/tests/c LIBDIR="$PWD/target/debug" clean all test'
run_windows = "{{vars.unix_only}}"

["c:test:verbose"]
description = "Run C FFI unit tests with verbose output"
run = """\
  make -C crates/crawlberg-ffi/tests/c LIBDIR="$PWD/target/debug" clean all && \
  for t in crates/crawlberg-ffi/tests/c/test_*; do [ -x "$t" ] || continue; \
  echo "=== $(basename "$t") ==="; "$t" && echo "PASS" || echo "FAIL"; done"""
run_windows = "{{vars.unix_only}}"

["c:lint"]
description = "Lint C code with cppcheck and clang-format (auto-fix)"
run = [
  """find crates/crawlberg-ffi/tests/c e2e/c -name "*.c" -o -name "*.h" | \
  xargs clang-format -i 2>/dev/null || echo "clang-format not available\"""",
  """cppcheck --enable=warning,style --error-exitcode=0 \
  crates/crawlberg-ffi/tests/c/*.c e2e/c/*.c 2>/dev/null || echo "cppcheck not available\"""",
]
run_windows = "{{vars.unix_only}}"

["c:lint:check"]
description = "Lint C code in check-only mode (no fixes)"
run = [
  """find crates/crawlberg-ffi/tests/c e2e/c -name "*.c" -o -name "*.h" | \
  xargs clang-format --dry-run --Werror 2>/dev/null || echo "clang-format not available\"""",
  """cppcheck --enable=warning,style --error-exitcode=1 \
  crates/crawlberg-ffi/tests/c/*.c e2e/c/*.c 2>/dev/null || echo "cppcheck not available\"""",
]
run_windows = "{{vars.unix_only}}"

["c:format"]
description = "Format C code with clang-format"
run = 'find crates/crawlberg-ffi/tests/c e2e/c -name "*.c" -o -name "*.h" | xargs clang-format -i'
run_windows = "{{vars.unix_only}}"

["c:format:check"]
description = "Check C code formatting without modifications"
run = 'find crates/crawlberg-ffi/tests/c e2e/c -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror'
run_windows = "{{vars.unix_only}}"

["c:clean"]
description = "Clean C build artifacts"
run = ["make -C crates/crawlberg-ffi/tests/c clean 2>/dev/null || true", "make -C e2e/c clean 2>/dev/null || true"]
run_windows = "{{vars.unix_only}}"

["c:update"]
description = "Update C dependencies (no-op, C deps are managed via Rust FFI crate)"
run = "echo 'C dependencies managed via Rust FFI crate (cargo update -p crawlberg-ffi)'"

["c:e2e:generate"]
description = "Generate C E2E tests from fixtures"
run = "bash scripts/task/e2e-generate.sh c"
run_windows = "{{vars.unix_only}}"

["c:e2e:lint"]
description = "Lint C E2E code"
run = """find e2e/c -name "*.c" -o -name "*.h" | \
  xargs clang-format --dry-run --Werror 2>/dev/null || echo "clang-format not available\""""
run_windows = "{{vars.unix_only}}"

["c:e2e:test"]
description = "Run C E2E tests"
run = 'make -C e2e/c LIBDIR="$PWD/target/debug" clean all test'
run_windows = "{{vars.unix_only}}"

["c:e2e:verify"]
description = "Full C E2E pipeline (generate + lint + test)"
run = [{ task = "c:e2e:generate" }, { task = "c:e2e:lint" }, { task = "c:e2e:test" }]
