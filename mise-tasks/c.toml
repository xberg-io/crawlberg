# C FFI (crates/crawlberg-ffi) E2E suite, included from mise.toml [task_config]. The suite links the
# debug FFI library in target/debug. ~keep

["c:clean"]
description = "Clean C build artifacts"
run = "make -C e2e/c clean 2>/dev/null || true"
run_windows = "{{vars.unix_only}}"

["c:e2e:test"]
description = "Run C E2E tests"
run = 'make -C e2e/c LIBDIR="$PWD/target/debug" clean all test'
run_windows = "{{vars.unix_only}}"

