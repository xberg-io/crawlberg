# WASM binding (crates/crawlberg-wasm), included from mise.toml [task_config]. The wasm32 C
# toolchain comes from the WASI SDK at WASI_SDK_PATH (default ~/wasi-sdk). ~keep

["wasm:pnpm"]
description = "Run one crawlberg-wasm package script with the WASI SDK as the wasm32 C toolchain"
hide = true
usage = '''
arg "<script>" help="package.json script to run"
flag "--production" help="Set NODE_ENV=production"
'''
dir = "{{config_root}}/crates/crawlberg-wasm"
env = { RUSTFLAGS = "", CC_wasm32_unknown_unknown = "{{vars.wasi_sdk}}/bin/clang", AR_wasm32_unknown_unknown = "{{vars.wasi_sdk}}/bin/ar" }
run = 'if [ "${usage_production:-false}" = true ]; then export NODE_ENV=production; fi; pnpm run "$usage_script"'

["wasm:build"]
description = "Build WASM bindings for Node.js target"
run = [{ task = "wasm:pnpm", args = ["build"] }]

["wasm:build:dev"]
description = "Build WASM bindings in debug mode"
run = [{ task = "wasm:pnpm", args = ["build"] }]

["wasm:test"]
description = "Run WASM unit tests with Vitest"
dir = "{{config_root}}/crates/crawlberg-wasm"
run = "pnpm test"

["wasm:lint"]
description = "Lint WASM TypeScript code with auto-fix (oxlint)"
run = "poly lint crates/crawlberg-wasm"

["wasm:lint:check"]
description = "Check WASM TypeScript linting without modifications"
run = "poly lint crates/crawlberg-wasm"

["wasm:format"]
description = "Format WASM TypeScript code with modifications (oxfmt)"
run = "poly fmt --fix crates/crawlberg-wasm"

["wasm:format:check"]
description = "Check WASM TypeScript formatting without modifications"
run = "poly fmt --fix crates/crawlberg-wasm"

["wasm:clean"]
description = "Clean WASM build artifacts"
run = [
  "rm -rf crates/crawlberg-wasm/dist crates/crawlberg-wasm/pkg crates/crawlberg-wasm/node_modules crates/crawlberg-wasm/.wasm-pack",
  "cd crates/crawlberg-wasm && pnpm run clean || true",
]
run_windows = [
  """\
  powershell -Command "Remove-Item -Path @('crates/crawlberg-wasm/dist', 'crates/crawlberg-wasm/pkg', \
  'crates/crawlberg-wasm/node_modules', 'crates/crawlberg-wasm/.wasm-pack') -Recurse -ErrorAction SilentlyContinue; exit 0\"""",
  "cd crates/crawlberg-wasm && pnpm run clean",
]

["wasm:e2e:generate"]
description = "Generate WASM E2E tests from fixtures (alef)"
run = "alef e2e generate"

["wasm:e2e:lint"]
description = "Lint generated WASM E2E TypeScript"
dir = "{{config_root}}/e2e/wasm"
run = "pnpm dlx oxlint ."

["wasm:e2e:test"]
description = "Run WASM E2E tests (Node/vitest, alef-generated)"
dir = "{{config_root}}/e2e/wasm"
# --no-frozen-lockfile: the e2e builds the binding from source and must not require a frozen
# lock that references the current, not-yet-published @xberg-io/crawlberg-<platform> version
# packages (CI defaults install to --frozen-lockfile, which fails pre-publish and on
# regen-bumped devDeps). ~keep
run = ["pnpm install --no-frozen-lockfile", "pnpm exec vitest run"]

