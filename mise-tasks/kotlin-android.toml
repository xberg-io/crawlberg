# Kotlin/Android binding (packages/kotlin-android), included from mise.toml [task_config]. ~keep

["kotlin-android:build"]
description = "Build kotlin-android AAR (BUILD_PROFILE: dev, release or ci; default release)"
run = [{ task = "build:profile", args = ["kotlin-android"] }]

["kotlin-android:build:dev"]
description = "Build kotlin-android AAR in debug mode"
dir = "{{config_root}}/packages/kotlin-android"
run = "gradle assembleDebug --no-daemon"

["kotlin-android:build:release"]
description = "Build kotlin-android AAR in release mode"
dir = "{{config_root}}/packages/kotlin-android"
run = "gradle assembleRelease --no-daemon"

["kotlin-android:build:ci"]
description = "Build kotlin-android AAR in CI mode"
run = [{ task = "kotlin-android:build:release" }]

["kotlin-android:lint"]
description = "Run ktlint with autocorrect"
dir = "{{config_root}}/packages/kotlin-android"
run = "gradle ktlintFormat --no-daemon"

["kotlin-android:format"]
description = "Run ktlint format (alias for lint)"
run = [{ task = "kotlin-android:lint" }]

["kotlin-android:e2e:test"]
description = "Run kotlin-android E2E tests as host JVM unit tests (no emulator) against the AAR's JVM-side wrapper"
# Tests live in e2e/kotlin_android (generated from fixtures) and read MOCK_SERVER_URL from the
# environment, auto-spawning a mock server if unset. ~keep
dir = "{{config_root}}/e2e/kotlin_android"
run = "gradle test --no-daemon"

