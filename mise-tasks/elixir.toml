# Elixir binding (packages/elixir), included from mise.toml [task_config]. ~keep

["elixir:test"]
description = "Run Elixir tests"
dir = "{{config_root}}/packages/elixir"
run = "mix test"

["elixir:lint"]
description = "Lint all Elixir code with auto-fix (format + credo)"
run = "bash scripts/task/elixir-lint.sh fix"
run_windows = "{{vars.unix_only}}"

["elixir:clean"]
description = "Clean Elixir build artifacts"
dir = "{{config_root}}/packages/elixir"
run = ["mix clean", "rm -rf _build", "rm -rf deps"]

["elixir:e2e:test"]
description = "Run generated Elixir E2E tests"
dir = "{{config_root}}/e2e/elixir"
env = { CRAWLBERG_BUILD = "1", CRAWLBERG_ALLOW_PRIVATE_NETWORK = "true" }
run = ["mix deps.get", "mix test"]

