[workspace]
# ~keep Verify a new pin by inspecting the binary, not `alef --version`. The 0.60.0 pin
# ~keep existed because a9a2bcece reflowed the JNI lib_header template, so alef emitted a
# ~keep crawlberg-jni/src/lib.rs that did not parse — while `alef verify --exit-code` still
# ~keep exited 0, because it re-hashes whatever was written. Templates are `include_str!`'d,
# ~keep so the cheap check is `strings $(which alef) | grep 'object\. #!\[allow('` — a hit
# ~keep means a pre-fix build, regardless of what the version string says.
alef_version = "0.60.2"
languages = [
  "python",
  "node",
  "ruby",
  "php",
  "ffi",
  "go",
  "java",
  "csharp",
  "elixir",
  "wasm",
  "dart",
  "kotlin_android",
  "jni",
  "swift",
  "zig",
]

[workspace.tools]
python_package_manager = "uv"
node_package_manager = "pnpm"

[workspace.dto]
python = "dataclass"
python_output = "typed-dict"
node = "interface"
ruby = "struct"
php = "readonly-class"
elixir = "struct"
go = "struct"
java = "record"
csharp = "record"
dart = "dataclass"
kotlin_android = "data-class"

[workspace.docs]
reference_output = "docs-site/src/content/docs/reference"

[workspace.docs.cli]
sources = ["crates/crawlberg-cli/src/main.rs"]

[workspace.docs.mcp]
sources = ["crates/crawlberg/src/mcp/server.rs"]


[workspace.docs.skills]
template_dir = "templates/docs/skills"
outputs = [".codex/skills", ".agents/skills", ".github/skills", ".claude/skills"]

[workspace.docs.snippets]
dirs = ["docs-site/src/snippets"]

[workspace.sync]
extra_paths = ["package.json", "crates/crawlberg-node/package.json", "crates/crawlberg-py/src/pyproject.toml"]

[workspace.citation]
title = "crawlberg"
abstract = "Web crawling and scraping with HTML→Markdown and headless-Chrome fallback."
repository-code = "https://github.com/xberg-io/crawlberg"
url = "https://xberg.io"
license = "MIT"
# ~keep Bump this on each release: sync-versions copies it verbatim into CITATION.cff and
# ~keep only rewrites `version`, so it silently stayed at the 1.1.3 date through 1.1.4,
# ~keep 1.2.0 and 1.2.1, claiming every release shipped in May.
date-released = "2026-08-11"

[[workspace.citation.authors]]
family-names = "Hirschfeld"
given-names = "Na'aman"
email = "naaman@xberg.io"
orcid = "https://orcid.org/0009-0000-2247-5072"

[[workspace.citation.authors]]
name = "Kreuzberg, Inc."

[[workspace.sync.text_replacements]]
path = "crates/crawlberg-cli/Cargo.toml"
search = 'crawlberg = \{ path = "../crawlberg", version = "=[^"]*"'
replace = 'crawlberg = { path = "../crawlberg", version = "={version}"'

[workspace.poly]
exclude = [
  "docs-site/src/snippets/**",
  "**/_generated/**",
  "**/coverage/**",
  "**/pkg/**",
  "**/.next/**",
  "**/*.min.js",
  "**/vendored/**",
  "**/stopwords/**",
  "**/testdata/**",
  "e2e/**",
  "**/*.diff",
  "**/*.patch",
  "**/frb_generated.rs",
  "**/*_bridge_generated/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
  "charts/**",
  # ai-rulez-generated coding-agent plugin outputs: owned by `ai-rulez generate
  # --plugin`, never reformatted by poly (would break BLAKE3 provenance). Sources
  # under plugin/.ai-rulez/ + plugin/scripts/ stay poly-managed. ~keep
  "plugin/.claude-plugin/**",
  "plugin/.codex-plugin/**",
  "plugin/.cursor-plugin/**",
  "plugin/.factory-plugin/**",
  "plugin/.opencode/**",
  "plugin/.hermes/**",
  "plugin/skills/**",
  "plugin/.mcp.json",
  "plugin/gemini-extension.json",
  "plugin/kimi.plugin.json",
  "plugin/package.json",
  "plugin/.ai-rulez-generated.json",
  ".claude-plugin/marketplace.json",
  ".agents/plugins/marketplace.json",
  ".ai-rulez-generated.json",
  # alef-generated files that poly's hash-stamp detector does not recognise, so
  # they land in the fmt gate and poly and alef would fight over their bytes.
  # Two detector gaps, both reported upstream: the docs-site pages carry the
  # `alef:hash:` marker on line 6 behind Starlight YAML frontmatter (recognised
  # only near the top of a file), and the three swift files carry it on line 2
  # yet are still checked. Listed file-by-file ON PURPOSE — a directory glob
  # here would also swallow hand-written neighbours: reference/ holds
  # mcp-tools.md, parsers.md and rest-api.md, and packages/swift/Sources/ is
  # mostly hand-written. Drop these entries once poly detects the marker. ~keep
  "docs-site/src/content/docs/reference/api-*.md",
  "docs-site/src/content/docs/reference/cli.md",
  "docs-site/src/content/docs/reference/configuration.md",
  "docs-site/src/content/docs/reference/errors.md",
  "docs-site/src/content/docs/reference/mcp.md",
  "docs-site/src/content/docs/reference/types.md",
  "packages/swift/Sources/Crawlberg/Crawlberg.swift",
  "packages/swift/Sources/RustBridge/ZSwiftPluginHelpers.swift",
  "test_apps/swift_e2e/Tests/CrawlbergE2ETests/**",
]

# Opt-in comment-removal sweep. Preserve doc comments (rustdoc is required on
# public items), TODO/FIXME (actionable), and SAFETY/license markers. Generated
# binding output is exempted via per-file-ignores below. ~keep
[workspace.poly.uncomment]
enabled = true
remove-todos = false
remove-fixme = false
remove-docs = false
use-default-ignores = true
preserve-patterns = ["SAFETY", "SPDX", "Copyright", "License", "licensed under"]

[workspace.poly.typos.extend-words]
