[workspace]
# ~keep Verify a new pin by inspecting the binary, not `alef --version`. The 0.60.0 pin
# ~keep existed because a9a2bcece reflowed the JNI lib_header template, so alef emitted a
# ~keep crawlberg-jni/src/lib.rs that did not parse — while `alef verify --exit-code` still
# ~keep exited 0, because it re-hashes whatever was written. Templates are `include_str!`'d,
# ~keep so the cheap check is `strings $(which alef) | grep 'object\. #!\[allow('` — a hit
# ~keep means a pre-fix build, regardless of what the version string says.
alef_version = "0.65.0"
languages = [
  "python",
  "node",
  "ruby",
  "php",
  "ffi",
  "go",
  "java",
  "csharp",
  "elixir",
  "wasm",
  "dart",
  "kotlin_android",
  "jni",
  "swift",
  "zig",
]

[workspace.tools]
python_package_manager = "uv"
node_package_manager = "pnpm"

[workspace.dto]
# ~keep `dart = "dataclass"` and `kotlin_android = "data-class"` used to sit here. alef's DtoConfig
# ~keep has never had a field for either, and no DartDtoStyle/KotlinAndroidDtoStyle enum exists, so
# ~keep both keys were silently discarded on every run since they were written — they configured
# ~keep nothing. alef 0.61.0 added deny_unknown_fields to DtoConfig, which turned that silent
# ~keep discard into a hard config-load failure, breaking every alef command before it did any work.
# ~keep Removing them is provably behaviour-neutral (they were already inert) and unblocks the
# ~keep toolchain. Restore them ONLY once alef ships real fields for these two languages, and expect
# ~keep the dart/kotlin_android generated output to shift on that regen — the style would be taking
# ~keep effect for the first time, which will look like a codegen regression and will not be one.
python = "dataclass"
python_output = "typed-dict"
node = "interface"
ruby = "struct"
php = "readonly-class"
elixir = "struct"
go = "struct"
java = "record"
csharp = "record"

[workspace.docs]
reference_output = "docs-site/src/content/docs/reference"

[workspace.docs.cli]
sources = ["crates/crawlberg-cli/src/main.rs"]

[workspace.docs.mcp]
sources = ["crates/crawlberg/src/mcp/server.rs"]


[workspace.docs.skills]
template_dir = "templates/docs/skills"
outputs = [".codex/skills", ".agents/skills", ".github/skills", ".claude/skills"]

[workspace.docs.snippets]
# ~keep Deliberately still the flat, hand-written tree, NOT `docs-site/src/snippets/generated`
# ~keep like tslp/h2m. `[crates.e2e.snippets]` below is wired and proven correct (verified via an
# ~keep isolated probe against `engine/engine_scrape_basic.json` with `preserve_input_urls` +
# ~keep `$mock_url`), but `alef e2e generate` cannot write ANY snippet today: 263 of 264
# ~keep `docs`-tagged fixtures leak `MOCK_SERVER_URL` scaffolding into their would-be snippet body
# ~keep (alef's mock-harness guard, `src/e2e/snippets/mod.rs::reject_mock_harness_scaffolding`),
# ~keep and that guard's rejection aborts the whole batch before anything is written — none of
# ~keep tslp/h2m's fixtures need `preserve_input_urls` because their fixtures aren't URL-driven,
# ~keep but nearly every crawlberg call takes a URL. Repointing `dirs` here before `generated/`
# ~keep has real content would silently drop snippet-check coverage of these 14 files to zero
# ~keep (`alef snippets list --snippets docs-site/src/snippets/generated` reports "0 snippets",
# ~keep exit 0 -- not an error, just silently nothing). Re-add the repoint only once
# ~keep `alef e2e generate` actually produces files under `generated/`.
dirs = ["docs-site/src/snippets"]
validation_level = "compile"
timeout_secs = 300
# ~keep `strict` is deliberately OFF: it fails the run on every DOWNGRADE, and 7 of 14 languages are
# ~keep downgraded until they have a session below. Turn it on with the last session, not before.

# ~keep A snippet annotation can only LOWER the level (runner.rs `requested.min(level)`), so the
# ~keep workspace level must be the highest any language reaches and the laggards are annotated
# ~keep `snippet:syntax-only` in their own file until a session can resolve their package.
[workspace.docs.snippets.sessions.rust]
cwd = "crates/crawlberg"

[workspace.docs.snippets.sessions.rust.rust_dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread"]

# ~keep zig needs no build: crawlberg.h is a checked-in generated header, and alef's
# ~keep zig validator runs `build-exe -fno-emit-bin`, which type-checks the `@cImport`
# ~keep declarations without linking, so the compiled `libcrawlberg_ffi` need not exist.
[workspace.docs.snippets.sessions.zig]
cwd = "packages/zig"
manifest = "packages/zig/build.zig"
include_paths = ["crates/crawlberg-ffi/include"]

# ~keep csharp P/Invoke (`[DllImport]`) resolves the native library at call time, not
# ~keep build time, so `dotnet build` on the ProjectReference compiles from source alone
# ~keep and needs no prebuilt assembly, despite the annotation reason this replaces.
[workspace.docs.snippets.sessions.csharp]
cwd = "packages/csharp"
manifest = "packages/csharp/Crawlberg/Crawlberg.csproj"

# ~keep The dart snippet imports `package:crawlberg`, which `dart analyze` resolves by walking up
# ~keep from the analyzed file -- alef places dart scratch under `manifest`'s directory precisely
# ~keep so that walk finds this package (see alef `snippets::scratch::resolves_package_from_the_scratch_file`).
# ~keep `dart pub get` must run first because `.dart_tool/package_config.json` is not checked in.
[workspace.docs.snippets.sessions.dart]
cwd = "packages/dart"
manifest = "packages/dart/pubspec.yaml"
before = ["dart pub get"]

# ~keep alef clears the child environment and re-adds a Unix allowlist that has no `HOME`
# ~keep (alef `snippets::validators::SANITIZED_ENVIRONMENT_VARIABLES`), so both `dart pub get` and
# ~keep `dart analyze` abort with "Could not find the pub cache. No `HOME` environment variable
# ~keep exists." Naming PUB_CACHE outright is dart's own documented remedy; the path is relative to
# ~keep `cwd`, and `.alef/` is already gitignored.
[workspace.docs.snippets.sessions.dart.env]
PUB_CACHE = ".alef/pub-cache"

[workspace.sync]
extra_paths = ["package.json", "crates/crawlberg-node/package.json"]

[workspace.citation]
title = "crawlberg"
abstract = "Web crawling and scraping with HTML→Markdown and headless-Chrome fallback."
repository-code = "https://github.com/xberg-io/crawlberg"
url = "https://xberg.io"
license = "MIT"
# ~keep Bump this on each release: sync-versions copies it verbatim into CITATION.cff and
# ~keep only rewrites `version`, so it silently stayed at the 1.1.3 date through 1.1.4,
# ~keep 1.2.0 and 1.2.1, claiming every release shipped in May.
date-released = "2026-08-13"

[[workspace.citation.authors]]
family-names = "Hirschfeld"
given-names = "Na'aman"
email = "naaman@xberg.io"
orcid = "https://orcid.org/0009-0000-2247-5072"

[[workspace.citation.authors]]
name = "Kreuzberg, Inc."

[[workspace.sync.text_replacements]]
path = "crates/crawlberg-cli/Cargo.toml"
search = 'crawlberg = \{ path = "../crawlberg", version = "=[^"]*"'
replace = 'crawlberg = { path = "../crawlberg", version = "={version}"'

[workspace.poly]
exclude = [
  "docs-site/src/snippets/**",
  "**/_generated/**",
  "**/coverage/**",
  "**/pkg/**",
  "**/.next/**",
  "**/*.min.js",
  "**/vendored/**",
  "**/stopwords/**",
  "**/testdata/**",
  "e2e/**",
  "**/*.diff",
  "**/*.patch",
  "**/frb_generated.rs",
  "**/*_bridge_generated/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
  "charts/**",
  # ai-rulez-generated coding-agent plugin outputs: owned by `ai-rulez generate
  # --plugin`, never reformatted by poly (would break BLAKE3 provenance). Sources
  # under plugin/.ai-rulez/ + plugin/scripts/ stay poly-managed. ~keep
  "plugin/.claude-plugin/**",
  "plugin/.codex-plugin/**",
  "plugin/.cursor-plugin/**",
  "plugin/.factory-plugin/**",
  "plugin/.opencode/**",
  "plugin/.hermes/**",
  "plugin/skills/**",
  "plugin/.mcp.json",
  "plugin/gemini-extension.json",
  "plugin/kimi.plugin.json",
  "plugin/package.json",
  "plugin/.ai-rulez-generated.json",
  ".claude-plugin/marketplace.json",
  ".agents/plugins/marketplace.json",
  ".ai-rulez-generated.json",
  # ~keep The six docs-site/reference entries that used to sit here are gone, and
  # should NOT be re-added. They existed because Starlight YAML frontmatter pushes
  # the `alef:hash:` marker to line 6 while poly read only the first 5
  # (GENERATED_HEADER_LINES), so the detector never saw it. poly has since widened
  # that window, and the marker is now recognised.
  #
  # The green that justifies this is NOT a scoped `poly fmt --check` — the old note
  # here rightly warned that those files pass on style coincidence, so a green run
  # proves nothing. The discriminating test is whether the detector RECOGNISES them:
  #   poly fmt --check --include-excluded docs-site/src/content/docs/reference/api-*.md
  #     -> "0 file(s) checked, 15 skipped (hash-stamped generated file)"
  # and, as the control that it is not just blanket-skipping the directory, the
  # hand-written neighbours mcp-tools.md, parsers.md and rest-api.md come back
  # "All formatted. (3 file(s) checked)" — checked, not skipped.
  #
  # Re-add an entry only if that first command starts reporting files as *checked*.
]

# Opt-in comment-removal sweep. Preserve doc comments (rustdoc is required on
# public items), TODO/FIXME (actionable), and SAFETY/license markers. Generated
# binding output is exempted via per-file-ignores below. ~keep
[workspace.poly.uncomment]
enabled = true
remove-todos = false
remove-fixme = false
remove-docs = false
use-default-ignores = true
preserve-patterns = ["SAFETY", "SPDX", "Copyright", "License", "licensed under"]

