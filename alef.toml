# ~keep Crate-internal items are hidden from alef by omission from `sources` above, not by
# ~keep `#[cfg_attr(alef, alef(skip))]` — extraction only ever walks the listed source files
# ~keep (verified against alef's extractor, which iterates only `config.sources`).
# ~keep `alef(skip)` matters only inside files that *are* in `sources`. The previous wording
# ~keep here claimed the opposite and caused an audit to misread the skip surface as ~25
# ~keep deliberate exclusions when 27 of the 38 were simply inert.

