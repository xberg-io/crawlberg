[crates.e2e]
fixtures = "fixtures"
output = "e2e"
languages = [
  "rust",
  "python",
  "node",
  "go",
  "java",
  "csharp",
  "php",
  "ruby",
  "elixir",
  "wasm",
  "brew",
  "c",
  "dart",
  "swift",
  "zig",
  "kotlin_android",
]
exclude_categories = ["middleware"]
fields_optional = [
  "markdown",
  "metadata.title",
  "metadata.description",
  "metadata.canonical_url",
  "metadata.keywords",
  "metadata.author",
  "metadata.viewport",
  "metadata.theme_color",
  "metadata.generator",
  "metadata.robots",
  "metadata.html_lang",
  "metadata.html_dir",
  "metadata.og_title",
  "metadata.og_type",
  "metadata.og_image",
  "metadata.og_description",
  "metadata.og_url",
  "metadata.og_site_name",
  "metadata.og_locale",
  "metadata.og_video",
  "metadata.og_audio",
  "metadata.og_locale_alternates",
  "metadata.twitter_card",
  "metadata.twitter_title",
  "metadata.twitter_description",
  "metadata.twitter_image",
  "metadata.twitter_site",
  "metadata.twitter_creator",
  "metadata.dc_title",
  "metadata.dc_creator",
  "metadata.dc_subject",
  "metadata.dc_description",
  "metadata.dc_publisher",
  "metadata.dc_date",
  "metadata.dc_type",
  "metadata.dc_format",
  "metadata.dc_identifier",
  "metadata.dc_language",
  "metadata.dc_rights",
  "metadata.article",
  "metadata.headings",
  "metadata.hreflangs",
  "metadata.favicons",
  "metadata.word_count",
  "response_meta",
  "extracted_data",
  "extraction_meta",
  "screenshot",
  "downloaded_document",
  "detected_charset",
  "crawl_delay",
  "x_robots_tag",
  "markdown.document_structure",
  "markdown.fit_content",
  "json_ld[].name",
  "json_ld.name",
  "links[].rel",
  "links.rel",
  "feeds[].title",
  "feeds.title",
  "images[].alt",
  "images.alt",
  "assets[].mime_type",
  "assets.mime_type",
  "assets[].html_tag",
  "assets.html_tag",
  "action_results[].data",
  "action_results.data",
  "action_results[].error",
  "action_results.error",
  # ~keep Every field of `ArticleMetadata` and `ResponseMeta` is an `Option<String>`. Without
  # ~keep these entries the generator dereferences them directly — `.published_time.to_string()`,
  # ~keep `.etag.is_empty()` — which does not compile, so the whole metadata suite fails to build
  # ~keep rather than degrading to a skip. Declared alongside the `article.*`/`response_headers.*`
  # ~keep aliases in `[crates.e2e.fields]`, which are what route fixtures onto these paths.
  "metadata.article.author",
  "metadata.article.section",
  "metadata.article.published_time",
  "metadata.article.modified_time",
  "response_meta.etag",
  "response_meta.last_modified",
  "response_meta.server",
  "response_meta.content_language",
]
fields_array = [
  "cookies",
  "links",
  "images",
  "feeds",
  "json_ld",
  "assets",
  "action_results",
  "metadata.headings",
  "metadata.hreflangs",
  "metadata.favicons",
  "metadata.og_locale_alternates",
  # ~keep `ArticleMetadata::tags` is a plain `Vec<String>`, not an `Option`, so it belongs here
  # ~keep and NOT in `fields_optional` — declaring it optional makes the generator emit
  # ~keep `.as_ref().unwrap()` against a `Vec`, which does not type-check.
  "metadata.article.tags",
  "pages",
  "urls",
  "results",
  "network_events",
  "markdown.tables",
  "markdown.warnings",
  "browser.network_events",
  "browser.cookies",
]
fields_enum = ["links[].link_type", "assets[].category"]
# ~keep `action_results[].data` is JSON-backed, and it is the only field in `fields_optional`
# above that is. Being merely optional makes the Kotlin emitter render it as
# `.data.orEmpty()`, which does not compile against the `Any?` the binding actually exposes
# (e2e/kotlin_android/.../InteractionTest.kt:81 is the single site). Alef's fix for that is
# opt-in per field via this key rather than applied to every optional field, because
# `.orEmpty()` is correct for a genuine `String?`. So this does NOT self-heal on regen —
# without this line the regenerated Kotlin e2e stays broken.
fields_json_scalar = ["action_results[].data"]
# ~keep This list is the DEFAULT call's (`scrape`) allowlist only — every named call in
# ~keep `[crates.e2e.calls.*]` declares its own `result_fields`, so nothing inherits from here.
# ~keep It had accumulated nine names that are not fields of `ScrapeResult`. Five of them
# ~keep (`main_content_only`, `redirect_chain`, `has_lastmod`, `is_error`, `pages_crawled`) are
# ~keep not fields of ANY crawlberg type — grep `crates/crawlberg/src` returns nothing outside
# ~keep `CrawlEvent::Complete { pages_crawled }`, which is a streaming enum payload, not a
# ~keep result struct. The other four (`cookies`, `urls`, `redirect_count`, `stayed_on_domain`)
# ~keep live on `CrawlResult`/`MapResult` and are already declared by those calls. `result_fields`
# ~keep SELECTS from what the IR says exists; it does not DECLARE existence, and a name the IR
# ~keep has never heard of is accepted verbatim — so a phantom entry here silently authorises an
# ~keep accessor for an attribute that does not exist at runtime. No fixture routed to `scrape`
# ~keep asserts any of the nine, so removing them changes no generated output today.
result_fields = [
  "status_code",
  "content_type",
  "html",
  "body_size",
  "metadata",
  "links",
  "images",
  "feeds",
  "json_ld",
  "is_allowed",
  "crawl_delay",
  "noindex_detected",
  "nofollow_detected",
  "x_robots_tag",
  "is_pdf",
  "was_skipped",
  "detected_charset",
  "auth_header_sent",
  "response_meta",
  "assets",
  "js_render_hint",
  "browser_used",
  "markdown",
  "extracted_data",
  "extraction_meta",
  "screenshot",
  "downloaded_document",
  "browser",
  "final_url",
]

