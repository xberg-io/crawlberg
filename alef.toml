# `article` is a field on `PageMetadata`, not on `ScrapeResult`, and the HTTP
# response header fields live on `response_meta` — the fixtures spell that
# prefix `response_headers`. Both need aliasing, not `result_fields` entries. ~keep
"article.author" = "metadata.article.author"
"article.section" = "metadata.article.section"
"article.published_time" = "metadata.article.published_time"
"article.modified_time" = "metadata.article.modified_time"
