"response_headers.last_modified" = "response_meta.last_modified"
"response_headers.server" = "response_meta.server"
"response_headers.content_language" = "response_meta.content_language"
# ~keep `CrawlResult` has no `pages_crawled` — that name only exists as the
# ~keep `CrawlEvent::Complete` streaming payload. The crawl-result equivalent is the length of
# ~keep `pages`, which 49 other fixtures already assert as `pages.length`. `crawl.min_pages` is
# ~keep the same quantity under a `greater_than_or_equal` assertion; aliasing both to the same
# ~keep path is safe because identical resolved paths are deduplicated into one accessor (see
# ~keep map_search_filter, which asserts `urls.length` twice and emits `urls_length` once).
"crawl.pages_crawled" = "pages.length"
"crawl.min_pages" = "pages.length"
"map.min_urls" = "urls.length"
# ~keep The `filter.*` and `strategy.*` prefixes are fixture vocabulary for BM25/traversal
# ~keep scenarios; the observable result is still the ordinary `CrawlResult`. Content filtering
# ~keep is applied before the pages land in `pages`, so "pages after filter" IS `pages.length`
# ~keep and "remaining pages contain the keyword" IS a `contains` over `pages[].html` (these
# ~keep fixtures configure no markdown conversion, so `pages[].markdown` is None and unusable).
"filter.pages_after_filter" = "pages.length"
"filter.remaining_contain_keyword" = "pages[].html"
"strategy.first_page_url_contains" = "pages[0].url"
# ~keep Visit order is asserted position by position rather than as one ordered list, because
# ~keep the generator has no array-literal form for an `equals` value in any target language.
# ~keep A per-index `contains` is also the only shape that can work here at all: `pages[N].url`
# ~keep is an absolute URL against a mock server bound to a random port, so a fixture can only
# ~keep ever match the path segment, never the whole string. The bfs/dfs fixtures use path
# ~keep segments that are not prefixes of one another (`alpha`, `beta`, `one`, `two`) so each
# ~keep `contains` identifies exactly one page. Index 0 is the seed and needs no assertion.
"strategy.page_1_url" = "pages[1].url"
"strategy.page_2_url" = "pages[2].url"
"strategy.page_3_url" = "pages[3].url"
"strategy.page_4_url" = "pages[4].url"
# ~keep `headings`, `hreflang`, `favicons` and the og locale alternates are fields of
# ~keep `PageMetadata`, not of `ScrapeResult`, and two of them are spelled differently there
# ~keep (`hreflang` -> `hreflangs`, `og.locale_alternate` -> `og_locale_alternates`). The
# ~keep `metadata.headings.length` target is proven — engine_scrape_basic already generates it
# ~keep in 15 of 16 languages (swift alone skips it, a swift-first-class-map limitation).
"headings.length" = "metadata.headings.length"
"headings[0].text" = "metadata.headings[0].text"
"headings[0].level" = "metadata.headings[0].level"
"hreflang.length" = "metadata.hreflangs.length"
"hreflang[].lang" = "metadata.hreflangs[].lang"
"favicons.length" = "metadata.favicons.length"
"favicons[].rel" = "metadata.favicons[].rel"
"og.locale_alternate.length" = "metadata.og_locale_alternates.length"

