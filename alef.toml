[crates.e2e.calls.batch_crawl_stream]
function = "batch_crawl_stream"
module = "crawlberg"
result_var = "result"
async = true
returns_result = true
streaming = true
options_type = "CrawlConfig"
select_when = { category = "stream", id_prefix = "batch_crawl_stream" }
# ~keep Widest skip in the file and the least explained. wasm is justified (no
# ~keep streaming surface); elixir/zig/swift/c mirror the skips above; brew is skipped
# ~keep here but NOT for crawl_stream, which is asymmetric and unexplained.
# ~keep None of it is recorded — treat as unverified. See crawlberg #109.
skip_languages = ["wasm", "elixir", "zig", "swift", "brew", "c"]
result_fields = ["url", "event_type", "page", "error", "final_url", "result", "pages_crawled"]

[[crates.e2e.calls.batch_crawl_stream.args]]
name = "engine"
field = "config"
type = "handle"
optional = false

[[crates.e2e.calls.batch_crawl_stream.args]]
name = "urls"
field = "batch_urls"
type = "mock_url_list"
element_type = "String"
owned = true
optional = false

[crates.e2e.calls.batch_crawl_stream.overrides.python]
function = "batch_crawl_stream"
module = "crawlberg"

[crates.e2e.calls.batch_crawl_stream.overrides.node]
function = "batchCrawlStream"
module = "@xberg-io/crawlberg"

[crates.e2e.calls.batch_crawl_stream.overrides.go]
function = "BatchCrawlStream"
module = "github.com/xberg-io/crawlberg/packages/go"

[crates.e2e.calls.batch_crawl_stream.overrides.java]
class = "io.xberg.crawlberg.Crawlberg"
function = "batchCrawlStream"

[crates.e2e.calls.batch_crawl_stream.overrides.csharp]
function = "BatchCrawlStream"

[crates.e2e.calls.batch_crawl_stream.overrides.dart]
function = "batchCrawlStream"
module = "crawlberg"

[crates.e2e.calls.batch_crawl_stream.overrides.php]
function = "batchCrawlStream"

[crates.e2e.calls.batch_crawl_stream.overrides.c]
function = "batch_crawl_stream"
result_type = "char*"
raw_c_result_type = "char*"
c_engine_factory = "CrawlConfig"

