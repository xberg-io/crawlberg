[workspace.poly.per-file-ignores]
# Alef-generated binding output — never hand-clean comments; regeneration owns them. ~keep
".cargo/config.toml" = ["comment", "doc-comment"]
"Package.swift" = ["comment", "doc-comment"]
"packages/**" = ["comment", "doc-comment"]
"crates/crawlberg-node/**" = ["comment", "doc-comment"]
"crates/crawlberg-php/**" = ["comment", "doc-comment"]
"crates/crawlberg-jni/**" = ["comment", "doc-comment"]
# crawlberg-ffi/py/wasm are MIXED: only src/lib.rs (+ ffi build.rs/cbindgen.toml) is
# alef-generated; the other modules are hand-written and get the uncomment sweep. ~keep
"crates/crawlberg-ffi/src/lib.rs" = ["comment", "doc-comment"]
"crates/crawlberg-ffi/build.rs" = ["comment", "doc-comment"]
"crates/crawlberg-ffi/cbindgen.toml" = ["comment", "doc-comment"]
"crates/crawlberg-ffi/include/crawlberg.h" = ["comment", "doc-comment"]
"crates/crawlberg-py/src/lib.rs" = ["comment", "doc-comment"]
"crates/crawlberg-wasm/src/lib.rs" = ["comment", "doc-comment"]
"crates/crawlberg-node/index.js" = ["no-unused-vars"]
# alef-generated e2e test apps carry a "DO NOT EDIT" header and generator-emitted
# comments; exempt them from the uncomment sweep (they're still ruff-linted via the
# builtin "**/test_apps/**" defaults). Distinct glob to avoid a duplicate key. ~keep
"test_apps/**" = ["comment", "doc-comment"]
"docker/**" = ["DL3006", "DL3059"]
"packages/python/**/api.py" = ["RET504"]
# Test-code relaxations on top of the builtin "**/tests/**" defaults: tests
# access private members (SLF001), use lazy/local imports (PLC0415), and
# inject unused pytest fixtures (PT019). Scoped to *.py (a distinct glob from
# the builtin "**/tests/**" key) since these are ruff-only codes. ~keep
"**/tests/**/*.py" = ["PT019", "PLC0415", "SLF001"]
# Example scripts: legitimately print output, aren't packages, and skip full
# annotations/docstrings. Not a builtin default — declared here in full. ~keep
"**/examples/**" = ["ANN", "D100", "D103", "I001", "INP001", "PLR2004", "S101", "PLC0415", "SLF001", "T201", "typo"]
"scripts/**/*.py" = [
  "B023",
  "C901",
  "D101",
  "D102",
  "D103",
  "D415",
  "E702",
  "ERA001",
  "EXE001",
  "PERF203",
  "PERF401",
  "PLC0415",
  "PLR0912",
  "PLR0915",
  "PLW2901",
  "PT018",
  "PTH108",
  "PTH123",
  "S101",
  "S108",
  "S311",
  "S607",
  "SIM105",
  "SIM115",
  "T201",
]
# crawlberg-specific: CLI proxy shim, extra test relaxations, and the headless
# browser JS bridge. ~keep
"cli-proxy/**/*.py" = ["ANN", "PLR0917", "S310", "T201"]
"tests/**/*.py" = ["PERF203", "PLC0415", "S607"]
"crates/crawlberg-browser/js/**" = ["no-unused-vars", "no-unused-expressions"]

