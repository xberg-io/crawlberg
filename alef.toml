[crates.scaffold]
description = "High-performance web crawling engine"
license = "MIT"
repository = "https://github.com/xberg-io/crawlberg"
authors = ["Xberg Team"]
keywords = ["crawl", "scrape", "web", "spider"]

[crates.scaffold.cargo]

[crates.readme]
template_dir = "readme_templates"
snippets_dir = "docs-site/src/snippets"

[crates.readme.targets.root]
name = "Crawlberg"
template = "root.md"
output_path = "README.md"

[crates.readme.languages.rust]
name = "Rust"
template = "language_package.md"
output_path = "crates/crawlberg/README.md"
package_manager = ["cargo"]
package_name = "crawlberg"
install_command = "cargo add crawlberg"
description = """
Rust crate for **crawlberg** — the core high-performance web crawling engine used by every
language binding. Provides async crawling, structured scrape output, SSRF-safe networking,
browser rendering, and Markdown conversion.
"""

[crates.readme.languages.rust.snippets]
basic_usage = "getting-started/basic_usage.md"

