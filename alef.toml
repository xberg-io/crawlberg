[crates.e2e.env]
CRAWLBERG_ALLOW_PRIVATE_NETWORK = "true"

[crates.e2e.format]
rust = "(cd {dir} && cargo fmt --all)"
python = "ruff check --fix {dir} && ruff format {dir}"
go = "gofmt -w {dir}"
ruby = "(cd {dir} && bundle exec rubocop --config .rubocop.yaml --autocorrect-all .)"
# ~keep vendor/ is gitignored, so a fresh checkout (every CI runner) has no php-cs-fixer until
# ~keep `composer install` runs. alef has no `before` hook for e2e formatters and silently no-ops
# ~keep when the command is missing, so the install is inlined here and the tool is invoked through
# ~keep `composer exec` — that resolves via the repo-root composer.json regardless of the cwd alef
# ~keep chose. friendsofphp/php-cs-fixer is a require-dev entry pinned by composer.lock, which is
# ~keep what makes this reproducible: the runner and the laptop format with the same version.
# ~keep The php e2e job installs `composer` (.github/workflows/ci-e2e.yaml), so this resolves there.
php = "composer install --no-interaction --no-progress --quiet && composer exec -- php-cs-fixer fix --rules='@PSR12,@PHP82Migration' --path-mode=override {dir}"
dart = "cd {dir} && dart format ."
zig = "zig fmt {dir}"

