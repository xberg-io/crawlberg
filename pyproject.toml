[build-system]
build-backend = "maturin"
requires = ["maturin>=1.15.0"]

[dependency-groups]
dev = ["pyrefly>=1.4.0", "pytest-asyncio>=1.4", "validate-pyproject"]

[tool.uv]
workspace.members = ["packages/python"]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/**/*.rs" },
  { file = "crates/**/Cargo.toml" },
]
