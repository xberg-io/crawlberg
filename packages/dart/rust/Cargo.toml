[package]
name = "crawlberg-dart"
version = "1.3.0"
edition = "2024"
license = "MIT"

[package.metadata.cargo-machete]
# Umbrella + sibling crates are pulled in so flutter_rust_bridge can resolve
# every referenced type, but the generated Rust wrapper only `use`s a subset.
ignored = ["crawlberg"]

[lib]
crate-type = ["cdylib", "staticlib"]
[dependencies]
crawlberg = { path = "../../../crates/crawlberg", features = ["interact", "browser-chromiumoxide"] }
flutter_rust_bridge = "=2.12.0"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[lints.rust]
# flutter_rust_bridge uses #[cfg(frb_expand)] internally during macro expansion.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# ~keep Repeats [workspace.lints.clippy] rather than inheriting it. `[lints] workspace = true`
# would be the normal way, but Cargo rejects a manifest that both inherits the workspace lints
# and defines its own `[lints.rust]`, and the `frb_expand` check-cfg above is specific to this
# crate. Without these three the repo's diagnostics rule is inert here, since the deny only
# applies to members that opt in.
[lints.clippy]
all = { level = "warn", priority = -1 }
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
