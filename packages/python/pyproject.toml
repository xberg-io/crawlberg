[build-system]
build-backend = "maturin"
requires = ["maturin>=1,<2"]

[project]
name = "crawlberg"
version = "1.0.5"
description = "High-performance web crawling engine"
keywords = ["crawl", "scrape", "spider", "web"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xberg Team" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
urls.repository = "https://github.com/xberg-io/crawlberg"

[dependency-groups]
dev = ["pyrefly>=1.1.1", "ruff>=0.14.8"]

[tool.maturin]
profile = "release"
module-name = "crawlberg._crawlberg"
manifest-path = "../../crates/crawlberg-py/Cargo.toml"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
python-packages = ["crawlberg"]

[tool.pyrefly]
python-version = "3.10"
preset = "strict"
[[tool.pyrefly.sub-config]]
matches = "**/api.py"
[tool.pyrefly.sub-config.errors]
bad-argument-type = false
bad-argument-count = false
bad-return = false
not-iterable = false
missing-attribute = false
