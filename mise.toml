# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. Rust is pinned by
# rust-toolchain.toml, not here. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64", "windows-x64"]

[task_config]
includes = [
  "mise-tasks/shared.toml",
  "mise-tasks",
  "mise-tasks/rust.toml",
  "mise-tasks/python.toml",
  "mise-tasks/node.toml",
  "mise-tasks/wasm.toml",
  "mise-tasks/ruby.toml",
  "mise-tasks/go.toml",
  "mise-tasks/java.toml",
  "mise-tasks/csharp.toml",
  "mise-tasks/php.toml",
  "mise-tasks/elixir.toml",
  "mise-tasks/c.toml",
  "mise-tasks/brew.toml",
  "mise-tasks/dart.toml",
  "mise-tasks/kotlin-android.toml",
  "mise-tasks/swift.toml",
  "mise-tasks/zig.toml",
  "mise-tasks/ci.toml",
  "mise-tasks/docker.toml",
]

[tools]
python = "3.13.18"
uv = "0.13.6"
node = "26.12.1"
pnpm = "12.15.0"
go = "1.27.3"
java = "temurin-25.0.5+8.0.LTS"
maven = "3.10.0"
ruby = "3.4.12"
dotnet = "10.0.403"
zig = "0.17.0"
"github:Goldziher/poly" = "0.31.2"
"github:Goldziher/adrlint" = "0.4.1"
"github:xberg-io/alef" = "0.115.9"
cargo-deny = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
actionlint = "1.7.12"
bats = "1.14.0"
lychee = "0.24.2"
"github:rustwasm/wasm-pack" = "0.15.0"
"github:rust-cross/cargo-zigbuild" = "0.24.0"

[env]
BATS_LIB_REF = "{{vars.bats_lib_ref}}"
DEPS_LANGS = "rust python node go ruby php elixir dart swift zig"
DEPS_RUST_MANIFESTS = "packages/ruby/ext/crawlberg_rb/native/Cargo.toml"
DEPS_NODE_DIRS = ". crates/crawlberg-node crates/crawlberg-wasm e2e/node"
# The PHP extension's composer.json is at the repository root. ~keep
DEPS_PHP_DIR = "."

[vars]
# run_windows of a Linux/macOS-only task: inline runs use cmd /c on Windows. ~keep
unix_only = "echo %MISE_TASK_NAME% needs Linux or macOS 1>&2 & exit 1"
rust_excludes = "--exclude crawlberg-php --exclude crawlberg-node --exclude crawlberg-wasm"
wasi_sdk = "{{ get_env(name='WASI_SDK_PATH', default=get_env(name='HOME', default='') ~ '/wasi-sdk') }}"
windows766_artifacts = "{{ get_env(name='RUNNER_TEMP', default='') }}/crawlberg-windows766"
bats_lib_ref = "793d3a4d37a17009d91cce29f2825eda570d2abd"

# ---- Entry points ------------------------------------------------------------------------------

[tasks.setup]
description = "Install the mise toolchain, all dependencies and dev tools"
run = ["mise install", { task = "rust:install" }, "alef setup", { task = "governance:hooks:install" }]

[tasks."build:profile"]
description = "Run <lang>:build:<BUILD_PROFILE> (dev, release or ci; default release)"
hide = true
usage = 'arg "<lang>" help="Task namespace, e.g. rust or python"'
run = 'mise run "$usage_lang:build:${BUILD_PROFILE:-release}"'

[tasks.build]
description = "Build core Rust library"
run = [{ task = "rust:build" }]

[tasks.test]
description = "Run Rust tests"
run = [{ task = "rust:test" }]

[tasks.update]
description = "Update all dependencies within current major versions (no breaking changes)"
run = [{ task = "deps:all", args = ["update"] }]

[tasks.upgrade]
description = "Upgrade all dependencies to latest versions including cross-major bumps"
run = [{ task = "deps:all", args = ["upgrade"] }]

[tasks.clean]
description = "Clean all per-language build artifacts"
run = [
  { task = "rust:clean" },
  { task = "python:clean" },
  { task = "ruby:clean" },
  { task = "node:clean" },
  { task = "java:clean" },
  { task = "go:clean" },
  { task = "csharp:clean" },
  { task = "php:clean" },
  { task = "elixir:clean" },
  { task = "wasm:clean" },
  { task = "c:clean" },
]

[tasks.check]
description = "Run check-only validation"
run = [{ task = "format:check" }, { task = "lint" }]

# ---- alef --------------------------------------------------------------------------------------

[tasks."alef:verify"]
description = "Check Alef-generated files are up to date"
run = "./scripts/ci/check-alef-generated.sh"

# ---- E2E ---------------------------------------------------------------------------------------

[tasks."e2e:build"]
description = "Build the standalone e2e mock HTTP server binary"
dir = "{{config_root}}/e2e/rust"
run = "cargo build --release --bin mock-server"

# ---- Governance, plugin and CI gates -----------------------------------------------------------

# scripts/ci/test_fork_publication.py asserts that the publish workflow runs this same command. ~keep
[tasks."ci:release:fork:check"]
description = "Check whether the browser fork version is already published"
run = "python3 scripts/ci/check_browser_fork.py"

# ---- Versions ----------------------------------------------------------------------------------

[tasks."version:sync"]
description = "Sync version from Cargo.toml to all package manifests"
run = [
  { task = "alef:pin:check" },
  "alef sync-versions",
  { task = "alef:regenerate" },
  "python3 scripts/sync_consumer_versions.py",
  "python3 scripts/sync_consumer_versions.py --check",
  # Pin plugin/.ai-rulez/config.plugins.toml [plugin].version to core, then regenerate the
  # per-runtime bundles under plugin/ from it. ~keep
  "python3 scripts/sync_plugin_version.py",
  "npx -y ai-rulez@latest generate --plugin",
  "python3 scripts/sync_public_skills.py",
  # ~keep `alef sync-versions` rewrites crates/crawlberg-node/package.json's
  # optionalDependencies to the new version, but nothing above refreshes the workspace
  # pnpm-lock.yaml beside it. CI Docs installs with --frozen-lockfile, which then fails
  # with ERR_PNPM_OUTDATED_LOCKFILE. The lockfile had been pinned at 1.6.0 since that release
  # -- 1.6.1, 1.6.2 and 1.6.3 each bumped the manifest past it. --lockfile-only resolves
  # without touching node_modules, so this stays cheap and offline-ish.
  "pnpm install --lockfile-only --ignore-scripts",
  # ~keep The uv workspace lock needs the same treatment: `alef sync-versions` rewrites
  # packages/python/pyproject.toml's version and uv.lock records it alongside, but nothing
  # above refreshed it. Every 1.6.x release was tagged with a stale lock, and `uv sync
  # --locked` fails against such a lock with "the lockfile is not up-to-date".
  "uv lock",
  { task = "alef:verify:strict" },
]

[tasks."version:bump:major"]
description = "Bump major version and sync all packages"
run = [{ task = "alef:pin:check" }, "alef sync-versions --bump major", { task = "version:sync" }]

[tasks."version:bump:minor"]
description = "Bump minor version and sync all packages"
run = [{ task = "alef:pin:check" }, "alef sync-versions --bump minor", { task = "version:sync" }]

[tasks."version:bump:patch"]
description = "Bump patch version and sync all packages"
run = [{ task = "alef:pin:check" }, "alef sync-versions --bump patch", { task = "version:sync" }]
