[package]
name = "benchmark-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.cargo-machete]
ignored = ["tikv-jemalloc-ctl"]

[lib]
name = "benchmark_harness"
path = "src/lib.rs"

[[bin]]
name = "benchmark-harness"
path = "src/main.rs"

[features]
default = []
native-browser = ["crawlberg/browser-native"]
profiling = ["pprof"]
memory-profiling = ["tikv-jemallocator", "tikv-jemalloc-ctl"]

[dependencies]
ahash = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
crawlberg = { path = "../../crates/crawlberg", features = ["browser"] }
num_cpus = "1"

pprof = { version = "0.15", features = ["flamegraph", "criterion"], optional = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = "0.38"
tempfile = { workspace = true }
thiserror = { workspace = true }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"], optional = true }
tikv-jemallocator = { version = "0.7", optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# benchmark-harness is a native-only, unpublished dev tool (`publish = false`) that fetches
# datasets over HTTPS via `reqwest::Client`. The workspace-level `reqwest` dependency defaults
# to `default-features = false` (see root Cargo.toml) so that wasm32 consumers of the shared
# `reqwest` package edge never pull mio via tokio/net; restore native TLS/HTTP2 here so dataset
# fetches keep working.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["default-tls", "http2", "charset", "system-proxy"] }

[lints]
workspace = true
