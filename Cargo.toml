[workspace]
members = [
    "crates/*",
    "packages/dart/rust",
    "packages/swift/rust",
    "tools/benchmark-harness",
]
exclude = [
    ".claude",
    "e2e/rust",
    "packages/elixir/native/crawlberg_nif",
    "packages/ruby/ext/crawlberg_rb",
    "packages/ruby/ext/src_rb",
    "packages/ruby/tmp",
    "packages/ruby/vendor",
]
resolver = "2"

[workspace.package]
version = "1.8.0"
edition = "2024"
authors = ["Na'aman Hirschfeld <naaman@xberg.io>"]
license = "MIT"
repository = "https://github.com/xberg-io/crawlberg"
homepage = "https://xberg.io"
documentation = "https://docs.rs/crawlberg"
readme = "README.md"
rust-version = "1.91"
keywords = ["crawl", "scrape", "web", "spider", "rust"]
categories = ["web-programming", "network-programming"]

[workspace.lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(alef)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Diagnostics belong in `tracing` (stderr), not raw stdout/stderr writes. The CLI's
# actual data output opts back in locally via `#[expect(clippy::print_stdout)]`;
# build-script `cargo:` directives are exempt natively. ~keep
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[workspace.dependencies]
ahash = "0.8"
aho-corasick = "1"
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
blake3 = "1"
camino = "1.2"
chromiumoxide = { version = "0.9", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crawlberg-browser = { path = "crates/crawlberg-browser", version = "1.8.0" }
crawlberg-bypass = { path = "crates/crawlberg-bypass", version = "1.8.0" }
criterion = { version = "0.8", features = ["html_reports"] }
# ~keep Held at 0.37, and cannot move while `selectors` is at 0.40: selectors-0.40.0 itself
# depends on cssparser 0.37 and exposes those types in the parser traits that
# crawlberg-browser/src/dom/selector.rs implements. cssparser has exactly one consumer in
# this workspace -- that file -- and every use there is in service of those traits, so
# upgrading to 0.38 would split the dep graph and break the impls for no gain. Revisit only
# when a selectors release picks up cssparser 0.38.
# ~keep `cargo upgrade --exclude cssparser` DOES NOT HONOUR THE EXCLUSION. Verified with
# ~keep cargo-edit-upgrade 0.13.13 on 2026-09-25: the run footer printed `excluded: cssparser`
# ~keep and the requirement was rewritten to "0.38" anyway, in the same invocation. Always
# ~keep `git diff -- Cargo.toml` after a `cargo upgrade` and re-pin this line by hand; the
# ~keep tool's own report of what it skipped is not evidence.
cssparser = "0.37"
dashmap = "6"
deno_core = "0.412"
deno_error = "0.7"
dirs = "7"
encoding_rs = "0.8"

# Binding framework dependencies
ext-php-rs = "0.15.15"
flate2 = "1"
futures = "0.3"
html-to-markdown-rs = { version = "3.14", features = ["full"] }
# ~keep Kept in lockstep with html-to-markdown-rs, which pins html5ever 0.40 from 3.14 on.
# Before that it pinned 0.39 and the graph carried two copies of the html5ever/markup5ever/
# string_cache/web_atoms stack; matching majors is what collapses them to one.
html5ever = "0.40"
ipnet = "2"
itertools = "0.15"
libc = "0.2"
liter-llm = { version = "2.1", features = ["native-http"] }
markup5ever = "0.40"
memchr = "2"
minijinja = "2"
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3"
notify = "8"
# ~keep OpenTelemetry stack. These four and `tracing-opentelemetry` below move as ONE set:
# each `tracing-opentelemetry` release depends on exactly one `opentelemetry` minor
# (0.33 -> ^0.32, 0.34 -> ^0.33), so bumping either side alone puts two `opentelemetry`
# versions in the graph and breaks cross-service propagator injection.
#
# `liter-llm` is the sixth member of that set: its `otel` feature pins one `opentelemetry`
# minor (2.0.x -> ^0.32, 2.1.x -> ^0.33) while `crates/crawlberg` depends on `opentelemetry`
# unconditionally, so a bump here without a matching `liter-llm` floor resolves BOTH minors.
# That state is a duplicate resolution, not a type error: it was reproduced deliberately on
# 2026-09-25 by holding `liter-llm` at 2.0.3 with these four at 0.33, and
# `cargo check --workspace --all-features` exited 0 while the lock carried 0.32 AND 0.33.
# So a green build is NOT evidence here. The gate is
# `cargo tree -p crawlberg --no-default-features --features ai,otel -i opentelemetry@<old>`
# failing to match, paired with the same command at `@<new>` succeeding -- the positive
# control is required, because the negative alone also "passes" for a typo or an absent
# package. `--features otel` without `ai` is vacuous: `otel = ["liter-llm?/otel"]` is a
# weak-dep activation and turns on nothing unless `ai` brings `liter-llm` in.
#
# The `liter-llm = "2.1"` floor below is load-bearing for CONSUMERS, not for this lock:
# `^2.0` also resolves 2.1.0 here, but it lets a downstream lock hold 2.0.3 and reintroduce
# the split in their graph. xberg-enterprise still pins 0.32/0.33 and must follow before
# cloud consumes a crawlberg release carrying this bump.
opentelemetry = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry-semantic-conventions = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
png = "0.18"
precomputed-hash = "0.1"
proptest = "1"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
quick-xml = "0.42"
rayon = "1"
regex = "1"
# default-features = false: reqwest's `default` set (default-tls, http2, system-proxy) pulls
# tokio/net -> mio, which fails to compile on wasm32 even though reqwest's own code cfg-gates
# native transport off wasm. Native-only features are re-added per-crate under
# `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]`.
reqwest = { version = "0.13", default-features = false, features = ["cookies", "gzip", "brotli"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2"
selectors = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servo_arc = "0.4"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tl = { package = "astral-tl", version = "0.8" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1.1"
tower = { version = "0.5", features = ["timeout", "retry", "limit", "util", "make"] }
tower-http = { version = "0.7", features = [
    "cors",
    "compression-full",
    "trace",
    "limit",
    "catch-panic",
    "request-id",
    "sensitive-headers",
] }
tracing = "0.1"
# ~keep Moves as one set with the `opentelemetry*` pins above; 0.34 requires opentelemetry ^0.33.
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "6", features = ["axum_extras"] }
uuid = { version = "1.26", features = ["v4"] }
walkdir = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
