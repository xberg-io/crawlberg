[workspace]
members = [
    "crates/*",
    "packages/dart/rust",
    "packages/swift/rust",
    "tools/benchmark-harness",
]
exclude = [
    ".claude",
    "e2e/rust",
    "packages/elixir/native/crawlberg_nif",
    "packages/ruby/ext/crawlberg_rb",
    "packages/ruby/ext/src_rb",
    "packages/ruby/tmp",
    "packages/ruby/vendor",
    "vendor/crawlberg-chromiumoxide",
]
resolver = "2"

[workspace.package]
version = "1.12.2"
edition = "2024"
authors = ["Na'aman Hirschfeld <naaman@xberg.io>", "Tobias Perlstein <tobias@xberg.io>"]
license = "MIT"
repository = "https://github.com/xberg-io/crawlberg"
homepage = "https://xberg.io"
documentation = "https://docs.rs/crawlberg"
readme = "README.md"
rust-version = "1.95"
keywords = ["crawl", "scrape", "web", "spider", "rust"]
categories = ["web-programming", "network-programming"]

[workspace.lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(alef)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Diagnostics belong in `tracing` (stderr), not raw stdout/stderr writes. The CLI's
# actual data output opts back in locally via `#[expect(clippy::print_stdout)]`;
# build-script `cargo:` directives are exempt natively. ~keep
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[workspace.dependencies]
ahash = "0.8"
aho-corasick = "1"
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
async-tungstenite = { version = "0.35", features = ["tokio-runtime"] }
axum = "0.8"
base64 = "0.23"
blake3 = "1"
camino = "1.2"
chardetng = "1.0.0"
chromiumoxide = { package = "crawlberg-chromiumoxide", path = "vendor/crawlberg-chromiumoxide", version = "0.9.4", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cookie_store = { version = "0.22", default-features = false }
crawlberg-browser = { path = "crates/crawlberg-browser", version = "1.12.2" }
crawlberg-bypass = { path = "crates/crawlberg-bypass", version = "1.12.2" }
crawlberg-robots = { path = "crates/crawlberg-robots", version = "1.12.2" }
criterion = { version = "0.8", features = ["html_reports"] }
# ~keep Keep cssparser in lockstep with selectors: selectors exposes cssparser types in
# ~keep parser traits implemented by crawlberg-browser/src/dom/selector.rs, so mismatched
# ~keep versions split the type graph and make those trait implementations uncompilable.
cssparser = "0.38"
dashmap = "6"
deno_core = "0.413"
deno_error = "0.7"
dirs = "7"
encoding_rs = "0.8"

# Binding framework dependencies
ext-php-rs = "0.16.3"
fancy-regex = "0.20"
flate2 = "1"
futures = "0.3"
html-escape = "0.3.0"
html-to-markdown-rs = { version = "3.18.7", features = ["full"] }
# ~keep Kept in lockstep with html-to-markdown-rs, which pins html5ever 0.40 from 3.14 on.
# Before that it pinned 0.39 and the graph carried two copies of the html5ever/markup5ever/
# string_cache/web_atoms stack; matching majors is what collapses them to one.
html5ever = "0.40"
icu_casemap = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
idna = "1"
ipnet = "2"
itertools = "0.15"
libc = "0.2.191"
liter-llm = { version = "2.4", features = ["native-http"] }
markup5ever = "0.40"
memchr = "2"
minijinja = "3"
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3"
notify = "8"
# ~keep OpenTelemetry 0.33 and tracing-opentelemetry 0.34 must move together because their
# ~keep public types cross the subscriber boundary. The liter-llm 2.2 floor keeps its optional
# ~keep otel integration on the same minor; test ai,otel together because otel uses a weak dependency.
opentelemetry = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry-semantic-conventions = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
percent-encoding = "2"
png = "0.18"
precomputed-hash = "0.1"
proptest = "1"
psl = "2"
pyo3 = { version = "0.30", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
quick-xml = "0.42"
rayon = "1"
regex = "1"
regex-syntax = "0.8"
# default-features = false: reqwest's `default` set (default-tls, http2, system-proxy) pulls
# tokio/net -> mio, which fails to compile on wasm32 even though reqwest's own code cfg-gates
# native transport off wasm. Native-only features are re-added per-crate under
# `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]`.
reqwest = { version = "0.13", default-features = false, features = ["cookies", "gzip", "brotli", "deflate"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rustix = { version = "1", default-features = false }
schemars = "1.2"
selectors = "0.41"
serde = { version = "1", features = ["derive"] }
serde-value = "0.7"
serde_json = "1"
serde_path_to_error = "0.1.20"
servo_arc = "0.5"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false }
tempfile = "3"
thiserror = "2"
tl = { package = "astral-tl", version = "0.8" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1.1"
tower = { version = "0.5", features = ["timeout", "retry", "limit", "util", "make"] }
tower-http = { version = "0.7", features = [
    "cors",
    "compression-full",
    "trace",
    "limit",
    "catch-panic",
    "request-id",
    "sensitive-headers",
] }
tracing = "0.1"
# ~keep Moves as one set with the `opentelemetry*` pins above; 0.34 requires opentelemetry ^0.33.
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "6", features = ["axum_extras"] }
uuid = { version = "1.29", features = ["v4"] }
walkdir = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
