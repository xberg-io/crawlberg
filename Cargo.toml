[workspace]
members = [
    "crates/*",
    "packages/dart/rust",
    "packages/swift/rust",
    "tools/benchmark-harness",
]
exclude = [
    ".claude",
    "e2e/rust",
    "packages/elixir/native/crawlberg_nif",
    "packages/ruby/ext/crawlberg_rb",
    "packages/ruby/ext/src_rb",
    "packages/ruby/tmp",
    "packages/ruby/vendor",
]
resolver = "2"

[workspace.package]
version = "1.3.3"
edition = "2024"
authors = ["Na'aman Hirschfeld <naaman@xberg.io>"]
license = "MIT"
repository = "https://github.com/xberg-io/crawlberg"
homepage = "https://xberg.io"
documentation = "https://docs.rs/crawlberg"
readme = "README.md"
rust-version = "1.91"
keywords = ["crawl", "scrape", "web", "spider", "rust"]
categories = ["web-programming", "network-programming"]

[workspace.lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(alef)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Diagnostics belong in `tracing` (stderr), not raw stdout/stderr writes. The CLI's
# actual data output opts back in locally via `#[expect(clippy::print_stdout)]`;
# build-script `cargo:` directives are exempt natively. ~keep
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[workspace.dependencies]
ahash = "0.8"
aho-corasick = "1"
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
blake3 = "1"
camino = "1.2"
chromiumoxide = { version = "0.9", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crawlberg-browser = { path = "crates/crawlberg-browser", version = "1.3.3" }
crawlberg-bypass = { path = "crates/crawlberg-bypass", version = "1.3.3" }
criterion = { version = "0.8", features = ["html_reports"] }
cssparser = "0.37"
dashmap = "6"
deno_core = "0.410"
deno_error = "0.7"
dirs = "6"
encoding_rs = "0.8"

# Binding framework dependencies
ext-php-rs = "0.15.15"
flate2 = "1"
futures = "0.3"
html-to-markdown-rs = { version = "3.11", features = ["full"] }
html5ever = "0.39"
ipnet = "2"
itertools = "0.15"
libc = "0.2"
liter-llm = { version = "1.18", features = ["native-http"] }
markup5ever = "0.39"
memchr = "2"
minijinja = "2"
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3"
notify = "8"
# OpenTelemetry stack. Pinned to match xberg-enterprise's workspace pins so cloud
# can consume crawlberg spans/metrics without a duplicate global provider.
# Held at 0.32: `tracing-opentelemetry` 0.32.1 still depends on `opentelemetry`
# 0.31 internally, so bumping us further splits the dep graph and breaks
# cross-service propagator injection (see xberg-enterprise Cargo.toml:89-91).
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
png = "0.18"
precomputed-hash = "0.1"
proptest = "1"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
quick-xml = "0.41"
rayon = "1"
regex = "1"
# default-features = false: reqwest's `default` set (default-tls, http2, system-proxy) pulls
# tokio/net -> mio, which fails to compile on wasm32 even though reqwest's own code cfg-gates
# native transport off wasm. Native-only features are re-added per-crate under
# `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]`.
reqwest = { version = "0.13", default-features = false, features = ["cookies", "gzip", "brotli"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2"
selectors = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servo_arc = "0.4"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tl = { package = "astral-tl", version = "0.7" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1.1"
tower = { version = "0.5", features = ["timeout", "retry", "limit", "util", "make"] }
tower-http = { version = "0.7", features = [
    "cors",
    "compression-full",
    "trace",
    "limit",
    "catch-panic",
    "request-id",
    "sensitive-headers",
] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras"] }
uuid = { version = "1.24", features = ["v4"] }
walkdir = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
