    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64, target: x86_64-unknown-linux-musl, rid: linux-musl-x64 }
          - { os: ubuntu-24.04-arm, arch: arm64, target: aarch64-unknown-linux-musl, rid: linux-musl-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-csharp-${{ matrix.rid }}

      - uses: xberg-io/actions/build-csharp-natives@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          crate-name: crawlberg-ffi
          lib-name: crawlberg_ffi
          rid: ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: csharp-natives-${{ matrix.rid }}
          path: dist/csharp-natives
          if-no-files-found: error
          retention-days: 14

  elixir-natives:
    name: Build Elixir NIF (${{ matrix.label }} nif-${{ matrix.nif }})
    needs: [prepare, check-elixir-release, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_elixir == 'true' && (needs.check-elixir-release.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-gnu, nif: "2.16" }
          - { os: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-gnu, nif: "2.17" }
          - { os: ubuntu-24.04-arm, label: linux-aarch64, target: aarch64-unknown-linux-gnu, nif: "2.16" }
          - { os: ubuntu-24.04-arm, label: linux-aarch64, target: aarch64-unknown-linux-gnu, nif: "2.17" }
          - { os: macos-latest, label: macos-arm64, target: aarch64-apple-darwin, nif: "2.16" }
          - { os: macos-latest, label: macos-arm64, target: aarch64-apple-darwin, nif: "2.17" }
          - { os: macos-15-intel, label: macos-x86_64, target: x86_64-apple-darwin, nif: "2.16" }
          - { os: macos-15-intel, label: macos-x86_64, target: x86_64-apple-darwin, nif: "2.17" }
          - { os: windows-latest, label: windows-x86_64, target: x86_64-pc-windows-msvc, nif: "2.16" }
          - { os: windows-latest, label: windows-x86_64, target: x86_64-pc-windows-msvc, nif: "2.17" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Override ImageOS on ARM Linux runners
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      - name: Override ImageOS on Windows runners
        if: runner.os == 'Windows'
        shell: bash
        run: echo "ImageOS=win25" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-elixir-${{ matrix.label }}

      - uses: xberg-io/actions/build-elixir-natives@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          nif-crate-name: crawlberg_nif
          nif-crate-path: packages/elixir/native/crawlberg_nif
          package-dir: packages/elixir
          nif-version: ${{ needs.prepare.outputs.version }}
          nif-api-version: ${{ matrix.nif }}

      - uses: actions/upload-artifact@v7
        with:
          name: elixir-${{ matrix.label }}-nif-${{ matrix.nif }}
          path: dist/elixir-natives/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  elixir-natives-musl:
    name: Build Elixir NIF (linux-musl-${{ matrix.arch }} nif-${{ matrix.nif }})
    needs: [prepare, check-elixir-release, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_elixir == 'true' && (needs.check-elixir-release.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, target: x86_64-unknown-linux-musl, nif: "2.16" }
          - { os: ubuntu-latest, arch: x86_64, target: x86_64-unknown-linux-musl, nif: "2.17" }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-musl, nif: "2.16" }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-musl, nif: "2.17" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Override ImageOS on ARM Linux runners
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-elixir-musl-${{ matrix.arch }}

      - uses: xberg-io/actions/build-elixir-natives@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          nif-crate-name: crawlberg_nif
          nif-crate-path: packages/elixir/native/crawlberg_nif
          package-dir: packages/elixir
          nif-version: ${{ needs.prepare.outputs.version }}
          nif-api-version: ${{ matrix.nif }}

      - uses: actions/upload-artifact@v7
        with:
          name: elixir-musl-${{ matrix.arch }}-nif-${{ matrix.nif }}
          path: dist/elixir-natives/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  swift-artifactbundle:
    name: Build Swift artifact bundle
    needs: prepare
    if: ${{ needs.prepare.outputs.release_swift == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
      - uses: xberg-io/actions/build-swift-artifactbundle@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        id: bundle
        with:
          crate-name: crawlberg-swift
          artifact-name: Crawlberg-rs
          package-manifest-path: Package.swift
          package-version: ${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: swift-artifactbundle
          path: ${{ steps.bundle.outputs.bundle-zip }}
          if-no-files-found: error
          retention-days: 14

  swift-package:
    name: Build Swift package
    needs: prepare
    if: ${{ needs.prepare.outputs.release_swift == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - uses: xberg-io/actions/build-swift-package@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          package-dir: packages/swift
          crate-name: crawlberg-swift

      - uses: actions/upload-artifact@v7
        with:
          name: swift-package
          path: packages/swift
          retention-days: 14

  zig-package:
    name: Build Zig package (smoke check)
    needs: prepare
    if: ${{ needs.prepare.outputs.release_zig == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - uses: xberg-io/actions/build-zig-package@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          ffi-crate: crawlberg-ffi
          package-dir: packages/zig

  upload-go-release:
    name: Upload Go FFI archives to GitHub Release
    needs: [prepare, validate-versions, go-ffi-libraries]
    if: ${{ needs.prepare.outputs.release_go == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && needs.go-ffi-libraries.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: go-ffi-*
          path: dist/go-ffi
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/go-ffi
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: crawlberg-go-*.tar.gz
          token: ${{ steps.app-token.outputs.token }}

  push-go-subdir-tag:
    name: Push Go module subdir tag
    needs: [prepare, validate-versions, upload-go-release]
    if: ${{ needs.prepare.outputs.release_go == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && (needs.upload-go-release.result == 'success' || needs.upload-go-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Push Go subdir tag
        shell: bash
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          TAG_NAME="packages/go/v${{ needs.prepare.outputs.version }}"
          git tag -a "$TAG_NAME" -m "Go module release ${{ needs.prepare.outputs.version }}"
          git push origin "$TAG_NAME"

  upload-c-ffi-release:
    name: Upload C FFI archives to GitHub Release
    needs: [prepare, validate-versions, c-ffi-libraries]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && needs.c-ffi-libraries.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: c-ffi-*
          path: dist/c-ffi
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/c-ffi
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: crawlberg-ffi-*.tar.gz
          token: ${{ steps.app-token.outputs.token }}

  upload-swift-release:
    name: Upload Swift artifact bundle to GitHub Release
    needs: [prepare, validate-versions, swift-artifactbundle]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && needs.swift-artifactbundle.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          name: swift-artifactbundle
          path: dist/swift

      - uses: xberg-io/actions/upload-release-assets@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/swift
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: "*.zip"
          token: ${{ steps.app-token.outputs.token }}

  publish-swift-checksums:
    name: Inject Swift artifactbundle checksum into the release tag
    needs: [prepare, validate-versions, upload-swift-release]
    if: ${{ !cancelled() && needs.upload-swift-release.result == 'success' && needs.validate-versions.result == 'success' && needs.prepare.outputs.release_swift == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Compute artifactbundle checksum and rewrite Package.swift
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "Crawlberg-rs.artifactbundle.zip" -D dist-swift
          CHECKSUM=$(swift package compute-checksum dist-swift/Crawlberg-rs.artifactbundle.zip)
          echo "Computed Swift checksum: $CHECKSUM"
          if ! grep -q "__ALEF_SWIFT_CHECKSUM__" Package.swift; then
            echo "Package.swift has no placeholder — nothing to inject"
            exit 0
          fi
          sed -i '' "s/__ALEF_SWIFT_CHECKSUM__/$CHECKSUM/g" Package.swift

      - name: Commit and move the release tag onto the checksummed Package.swift
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Package.swift; then
            echo "Package.swift unchanged — skipping retag"
            exit 0
          fi
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: inject Swift artifactbundle checksum for ${TAG}"
          # Recreate the annotated release tag on this commit. Pushing the tag also
          # pushes the new commit object, so main is left untouched (Package.swift
          # is regenerated with the placeholder on the next release anyway).
          git tag -f -a "$TAG" -m "$TAG" HEAD
          git push origin "refs/tags/${TAG}" --force
          # Also publish the checksummed commit to a release/swift/<version> branch. The
          # alef-generated Swift e2e/test-app pins `branch: "release/swift/<version>"`
          # (bare version, no leading "v"), so this ref must exist for SwiftPM to resolve
          # the package with the real checksum.
          VERSION="${TAG#v}"
          git push origin "HEAD:refs/heads/release/swift/${VERSION}" --force

  upload-elixir-release:
    name: Upload Elixir NIF archives to GitHub Release
    needs: [prepare, elixir-natives, elixir-natives-musl]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && (needs.elixir-natives.result == 'success' || needs.elixir-natives-musl.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: elixir-*
          path: dist/elixir
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/elixir
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: libcrawlberg_nif-*.tar.gz
          token: ${{ steps.app-token.outputs.token }}

  upload-php-pie-release:
    name: Upload PHP PIE archives to GitHub Release
    needs: [prepare, validate-versions, php-extension]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && needs.php-extension.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: php-package-*
          path: dist/php-package
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/php-package
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: |
            php_*.tgz
            php_*.tgz.sha256
            php_*.zip
            php_*.zip.sha256
          token: ${{ steps.app-token.outputs.token }}

  verify-assets:
    name: Verify release assets
    needs:
      - prepare
      - cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
    if: ${{ always() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - uses: xberg-io/actions/verify-release-assets@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          expected-assets: |
            # CLI
            crawlberg-cli-*.tar.gz
            crawlberg-cli-*.zip
            # Go FFI
            crawlberg-go-*.tar.gz
            # C FFI
            crawlberg-ffi-*.tar.gz
            # Elixir NIF
            libcrawlberg_nif-*.tar.gz

  publish-crates:
    name: Publish crates.io packages
    needs: [prepare, validate-versions, check-cratesio]
    if: ${{ needs.prepare.outputs.release_crates == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-cratesio.outputs.all_exist != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          cache-key-prefix: publish-crates

      # ~keep publish-crates takes `crates` as a required input, but an input that
      # resolves to an empty string is not an error to GitHub — the action would
      # publish nothing and the job would still go green. Assert the resolved list
      # here so a mis-resolved ${{ env.CRATES_TO_PUBLISH }} fails the release
      # instead of quietly shipping zero crates.
      - name: Assert the crate list resolved
        shell: bash
        env:
          RESOLVED_CRATES: ${{ env.CRATES_TO_PUBLISH }}
        run: |
          set -euo pipefail
          COUNT=$(printf '%s' "${RESOLVED_CRATES:-}" | wc -w | tr -d '[:space:]')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::CRATES_TO_PUBLISH resolved to an empty list — refusing to publish nothing"
            exit 1
          fi
          echo "Publishing ${COUNT} crate(s): ${RESOLVED_CRATES}"

      - uses: xberg-io/actions/publish-crates@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          crates: ${{ env.CRATES_TO_PUBLISH }}
          version: ${{ needs.prepare.outputs.version }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  # ~keep `needs.publish-crates.result != 'failure'` is TRUE when publish-crates was SKIPPED,
  # and publish-crates skips for two opposite reasons: the version is already on crates.io
  # (a re-run or a resumed release — downstream must proceed), or an upstream gate such as
  # cargo-packages failed (downstream must NOT proceed). `result` alone cannot tell them
  # apart, so every downstream job that read it was gating on nothing: tree-sitter-language-pack
  # v1.15.5 published a GitHub release to zero registries that way and still reported success.
  # This job always runs, so its outputs always exist, and it resolves the ambiguity once into
  # an explicit outcome the whole workflow tests instead of re-deriving it at each call site.
  crates-gate:
    name: Crates.io publish gate
    needs: [prepare, check-cratesio, publish-crates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.decide.outputs.ok }}
      outcome: ${{ steps.decide.outputs.outcome }}
    steps:
      - id: decide
        name: Decide whether the crates.io prerequisite is satisfied
        shell: bash
        env:
          RESULT_PUBLISH_CRATES: ${{ needs.publish-crates.result }}
          RELEASE_CRATES: ${{ needs.prepare.outputs.release_crates }}
          IS_TAG: ${{ needs.prepare.outputs.is_tag }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force_republish }}
          ALREADY_ON_CRATESIO: ${{ needs.check-cratesio.outputs.all_exist }}
        run: |
          set -uo pipefail

          if [[ "${RESULT_PUBLISH_CRATES}" == "failure" ]]; then
            outcome="blocked"
          elif [[ "${RESULT_PUBLISH_CRATES}" == "success" ]]; then
            outcome="published"
          elif [[ "${RELEASE_CRATES}" != "true" ]]; then
            outcome="not-required"
          elif [[ "${DRY_RUN}" == "true" ]]; then
            outcome="dry-run"
          elif [[ "${IS_TAG}" != "true" ]]; then
            outcome="not-a-tag"
          elif [[ "${ALREADY_ON_CRATESIO}" == "true" && "${FORCE_REPUBLISH}" != "true" ]]; then
            outcome="already-present"
          else
            outcome="blocked"
          fi

          if [[ "${outcome}" == "blocked" ]]; then
            ok="false"
            echo "::error title=crates.io prerequisite not met::publish-crates finished with '${RESULT_PUBLISH_CRATES}' and this version is not on crates.io — every job that builds or publishes against the released crate will be held back."
          else
            ok="true"
          fi

          echo "outcome=${outcome}" >>"$GITHUB_OUTPUT"
          echo "ok=${ok}" >>"$GITHUB_OUTPUT"
          echo "crates-gate: outcome=${outcome} ok=${ok} (publish-crates=${RESULT_PUBLISH_CRATES})"

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, python-wheels, python-sdist, check-pypi]
    if: ${{ needs.prepare.outputs.release_python == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-sdist
          path: dist

      - uses: xberg-io/actions/publish-pypi@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          packages-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-rubygems:
    name: Publish Ruby gems
    needs: [prepare, validate-versions, ruby-gem, check-rubygems]
    if: ${{ needs.prepare.outputs.release_ruby == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && (needs.check-rubygems.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rubygems-*
          path: dist
          merge-multiple: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - uses: xberg-io/actions/publish-rubygems@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          gems-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-node:
    name: Publish Node packages
    needs: [prepare, validate-versions, node-bindings, check-npm]
    if: ${{ needs.prepare.outputs.release_node == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && (needs.check-npm.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: node-bindings-*
          path: node-artifacts
          merge-multiple: true

      - uses: xberg-io/actions/setup-node-workspace@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Stage platform packages and main package
        shell: bash
        run: |
          rm -rf crates/crawlberg-node/npm
          mkdir -p crates/crawlberg-node/npm
          for pkg in node-artifacts/*.tar.gz; do
            tar -xzf "${pkg}" -C crates/crawlberg-node
          done

          # Pack each platform sub-package as a tarball
          cd crates/crawlberg-node/npm
          for dir in */; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm pack && mv ./*.tgz ..)
            fi
          done
          cd ../../..

          # Stamp main package's optionalDependencies with all platform packages
          tmp_pkg_json="$(mktemp)"
          optional_deps_json='{}'
          for platform_pkg_json in crates/crawlberg-node/npm/*/package.json; do
            name="$(jq -r '.name // empty' "$platform_pkg_json")"
            version="$(jq -r '.version // empty' "$platform_pkg_json")"
            [[ -z "$name" || -z "$version" ]] && { echo "Invalid: $platform_pkg_json" >&2; exit 1; }
            optional_deps_json="$(jq -c --arg n "$name" --arg v "$version" '. + {($n): $v}' <<<"$optional_deps_json")"
          done
          jq --argjson deps "$optional_deps_json" '.optionalDependencies = $deps' \
            crates/crawlberg-node/package.json > "$tmp_pkg_json"
          mv "$tmp_pkg_json" crates/crawlberg-node/package.json

      - name: Publish platform sub-packages
        uses: xberg-io/actions/publish-npm@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          packages-dir: crates/crawlberg-node/npm
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Wait for npm indexing (linux-x64-gnu)
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: npm
          package: "@xberg-io/crawlberg-linux-x64-gnu"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

      - name: Wait for npm indexing (linux-arm64-gnu)
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: npm
          package: "@xberg-io/crawlberg-linux-arm64-gnu"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

      - name: Publish main @xberg-io/crawlberg package
        uses: xberg-io/actions/publish-npm@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          package-dir: crates/crawlberg-node
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Wait for main Node package indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: npm
          package: "@xberg-io/crawlberg"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "25"

  publish-wasm:
    name: Publish WASM package
    needs: [prepare, validate-versions, wasm-bindings, check-wasm]
    if: ${{ needs.prepare.outputs.release_wasm == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && (needs.check-wasm.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
