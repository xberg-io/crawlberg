name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g., v0.3.0-rc.20)"
        required: false
        type: string
      ref:
        description: "Git ref (branch, tag, or commit) to build; defaults to the tag"
        required: false
        type: string
      targets:
        description: "Comma-separated list of release targets, or 'all'"
        required: false
        type: string
        default: "all"
      dry_run:
        description: "Prepare artifacts without publishing"
        required: false
        type: boolean
        default: false
      republish:
        description: "Delete and re-create the tag on current HEAD before publishing"
        required: false
        type: boolean
        default: false
      force_republish:
        description: "Force republish targets whose registry version already exists"
        required: false
        type: boolean
        default: false
  release:
    types: [published]
  repository_dispatch:
    types: [publish-release]

permissions:
  contents: read
  id-token: write

env:
  # ~keep Single source of truth for the crates.io release set, in dependency order.
  # check-cratesio and publish-crates both read this; they used to keep two
  # hand-maintained lists that had silently diverged (the check omitted
  # crawlberg-browser, so all_exist could report true while browser was unpublished
  # and publish-crates was skipped outright).
  CRATES_TO_PUBLISH: "crawlberg-browser crawlberg crawlberg-bypass crawlberg-bindings-common crawlberg-cli"

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref || github.event.inputs.tag)) || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare metadata
    # This workflow publishes the release object itself, which re-enters it through
    # `on: release` and queues a full duplicate publish run behind the dispatch run that
    # created it. Keyed on `actor`, not `release.author` and not `triggering_actor`:
    # release.author is always the bot because the bot creates the release as a draft, so it
    # would suppress a human publishing that draft. triggering_actor becomes the human on a
    # re-run, so it would ADMIT a duplicate when someone re-runs the bot's own recursive run.
    # `actor` is pinned to whoever initiated the original run and survives re-runs. ~keep
    if: >-
      github.event_name != 'release' ||
      github.actor != 'xberg-dev-publisher[bot]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      matrix_ref: ${{ steps.meta.outputs.matrix_ref }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      force_republish: ${{ steps.meta.outputs.force_republish }}
      release_targets: ${{ steps.meta.outputs.release_targets }}
      release_any: ${{ steps.meta.outputs.release_any }}
      release_python: ${{ steps.meta.outputs.release_python }}
      release_node: ${{ steps.meta.outputs.release_node }}
      release_ruby: ${{ steps.meta.outputs.release_ruby }}
      release_cli: ${{ steps.meta.outputs.release_cli }}
      release_crates: ${{ steps.meta.outputs.release_crates }}
      release_homebrew: ${{ steps.meta.outputs.release_homebrew }}
      release_scoop: ${{ steps.meta.outputs.release_scoop }}
      release_java: ${{ steps.meta.outputs.release_java }}
      release_csharp: ${{ steps.meta.outputs.release_csharp }}
      release_go: ${{ steps.meta.outputs.release_go }}
      release_wasm: ${{ steps.meta.outputs.release_wasm }}
      release_php: ${{ steps.meta.outputs.release_php }}
      release_elixir: ${{ steps.meta.outputs.release_elixir }}
      release_c_ffi: ${{ steps.meta.outputs.release_c_ffi }}
      release_dart: ${{ steps.meta.outputs.release_dart }}
      release_swift: ${{ steps.meta.outputs.release_swift }}
      release_zig: ${{ steps.meta.outputs.release_zig }}
      release_kotlin_android: ${{ steps.meta.outputs.release_kotlin_android }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.republish == true && (inputs.ref || github.event.repository.default_branch)) || inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Retag for republish
        if: ${{ inputs.republish == true || github.event.client_payload.republish == true }}
        uses: xberg-io/actions/retag-for-republish@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ inputs.tag || github.event.client_payload.tag }}
          token: ${{ steps.app-token.outputs.token }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Resolve release metadata
        id: meta
        uses: xberg-io/actions/prepare-release-metadata@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Ensure GitHub Release exists for tag
        if: ${{ steps.meta.outputs.is_tag == 'true' && steps.meta.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/publish-github-release@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ steps.meta.outputs.tag }}
          target: ${{ steps.meta.outputs.target_sha }}
          notes: "Release ${{ steps.meta.outputs.tag }}"
          draft: "true"
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          token: ${{ steps.app-token.outputs.token }}

  validate-versions:
    name: Validate language manifest versions
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Validate versions
        uses: xberg-io/actions/validate-versions@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          version: ${{ needs.prepare.outputs.version }}

      # The coding-agent plugin under plugin/ carries its own version source
      # (plugin/.ai-rulez/config.toml [plugin].version) that the shared
      # validate-versions action does not know about. Assert it against the tag
      # actually being released, so a drifted plugin fails the release instead of
      # shipping a bundle that lags the version it claims to be. ~keep
      - name: Validate plugin version matches the release
        run: python3 scripts/sync_plugin_version.py --expect "${{ needs.prepare.outputs.version }}"

  check-pypi:
    name: Check PyPI for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_python == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: pypi
          package: crawlberg
          version: ${{ needs.prepare.outputs.version }}

  check-npm:
    name: Check npm for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_node == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: npm
          package: "@xberg-io/crawlberg"
          version: ${{ needs.prepare.outputs.version }}

  check-wasm:
    name: Check npm for existing WASM package
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_wasm == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: npm
          package: "@xberg-io/crawlberg-wasm"
          version: ${{ needs.prepare.outputs.version }}

  check-rubygems:
    name: Check RubyGems for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_ruby == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: rubygems
          package: crawlberg
          version: ${{ needs.prepare.outputs.version }}

  check-maven:
    name: Check Maven Central for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_java == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: maven
          package: "io.xberg.crawlberg:crawlberg"
          version: ${{ needs.prepare.outputs.version }}

  check-nuget:
    name: Check NuGet for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_csharp == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: nuget
          package: Crawlberg
          version: ${{ needs.prepare.outputs.version }}

  check-packagist:
    name: Check Packagist for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_php == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: packagist
          package: xberg-io/crawlberg
          version: ${{ needs.prepare.outputs.version }}

  check-cratesio:
    name: Check crates.io for existing versions
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_crates == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      all_exist: ${{ steps.check.outputs.all_exist }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: xberg-io/actions/install-alef@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      # ~keep Loop $CRATES_TO_PUBLISH rather than restating the set. The previous
      # form passed the extra crates through check-registry's `extra-packages`,
      # but that composite action declares only `exists`, so every extra key
      # interpolated to "" — the v1.2.1 run log shows this step evaluating
      # `"" == "true"` three times.
      - id: check
        name: Check every crate in CRATES_TO_PUBLISH
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CRATES_TO_PUBLISH:-}" ]; then
            echo "::error::CRATES_TO_PUBLISH is empty — nothing would be checked"
            exit 1
          fi
          ALL_EXIST=true
          for CRATE in $CRATES_TO_PUBLISH; do
            EXISTS=""
            for ATTEMPT in 1 2 3 4 5; do
              if EXISTS=$(alef check-registry --registry cratesio --package "$CRATE" \
                  --version "$VERSION" --json | jq -r '.exists'); then
                break
              fi
              echo "attempt ${ATTEMPT} for ${CRATE} failed, retrying..." >&2
              sleep "$((ATTEMPT * 3))"
              EXISTS=""
            done
            case "$EXISTS" in
              true) echo "${CRATE}@${VERSION}: present" ;;
              false) echo "${CRATE}@${VERSION}: absent"; ALL_EXIST=false ;;
              *) echo "::error::could not determine whether ${CRATE}@${VERSION} exists on crates.io"; exit 1 ;;
            esac
          done
          echo "all_exist=${ALL_EXIST}" >>"$GITHUB_OUTPUT"
          echo "all_exist=${ALL_EXIST}"

  check-hex:
    name: Check Hex.pm for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_elixir == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: hex
          package: crawlberg
          version: ${{ needs.prepare.outputs.version }}

  check-zig:
    name: Check Zig package presence
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_zig == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: github-release
          package: crawlberg-zig-v${{ needs.prepare.outputs.version }}.tar.gz
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          assets: crawlberg-zig-v${{ needs.prepare.outputs.version }}.tar.gz

  check-maven-kotlin-android:
    name: Check Maven Central for kotlin-android package
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_kotlin_android == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      # ~keep check-registry is a composite action and only declares `exists`, so
      # keys passed via `extra-packages` never reach the caller — they interpolate
      # to "" (see the v1.2.1 run, where the derive step evaluated `"" == "true"`).
      # The coordinate this job gates on must therefore be the primary `package`.
      kotlin_android_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      # ~keep Derive the coordinate from the Gradle publish config rather than
      # restating it here. The previous hard-coded `io.xberg:crawlberg-android`
      # never matched the published `io.xberg.crawlberg.android:crawlberg-android`,
      # so the gate below always read "not published".
      - id: coords
        name: Derive Maven coordinate from the Gradle publish config
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="packages/kotlin-android/build.gradle.kts"
          if [ ! -f "$GRADLE" ]; then
            echo "::error::$GRADLE is missing — cannot derive the Maven coordinate"
            exit 1
          fi
          COORDS=$(awk '/coordinates\(/{inblock=1} inblock{print} inblock&&/\)/{exit}' "$GRADLE")
          GROUP_ID=$(printf '%s\n' "$COORDS" | sed -n 's/.*groupId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p')
          ARTIFACT_ID=$(printf '%s\n' "$COORDS" | sed -n 's/.*artifactId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ "$(printf '%s\n' "$GROUP_ID" | grep -c .)" != 1 ] || [ "$(printf '%s\n' "$ARTIFACT_ID" | grep -c .)" != 1 ]; then
            echo "::error::expected exactly one groupId and one artifactId in the coordinates(...) block of $GRADLE"
            exit 1
          fi
          echo "coordinate=${GROUP_ID}:${ARTIFACT_ID}" >>"$GITHUB_OUTPUT"
          echo "Gating kotlin-android publish on ${GROUP_ID}:${ARTIFACT_ID}"

      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: maven
          package: ${{ steps.coords.outputs.coordinate }}
          version: ${{ needs.prepare.outputs.version }}

  check-homebrew:
    name: Check Homebrew tap for formula
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_homebrew == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: homebrew
          package: crawlberg
          version: ${{ needs.prepare.outputs.version }}
          tap-repo: xberg-io/homebrew-tap

  check-cli:
    name: Check GitHub Release for CLI assets
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_cli == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: github-release
          package: crawlberg
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: crawlberg-cli-
          assets: |
            crawlberg-cli-aarch64-apple-darwin.tar.gz,crawlberg-cli-aarch64-unknown-linux-gnu.tar.gz,crawlberg-cli-aarch64-unknown-linux-musl.tar.gz,crawlberg-cli-x86_64-unknown-linux-gnu.tar.gz,crawlberg-cli-x86_64-unknown-linux-musl.tar.gz,crawlberg-cli-x86_64-pc-windows-msvc.zip

  check-go:
    name: Check GitHub Release for Go FFI assets
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_go == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: github-release
          package: crawlberg
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: crawlberg-go-

  check-c-ffi:
    name: Check GitHub Release for C FFI assets
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_c_ffi == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: github-release
          package: crawlberg
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: crawlberg-ffi-

  check-elixir-release:
    name: Check GitHub Release for Elixir NIF assets
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_elixir == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          registry: github-release
          package: crawlberg
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: libcrawlberg_nif-

  python-wheels:
    name: Build Python wheels (${{ matrix.os }})
    needs: [prepare, check-pypi]
    if: ${{ needs.prepare.outputs.release_python == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Build wheels
        uses: xberg-io/actions/build-python-wheels@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          python-version: "3.13"
          package-dir: packages/python
          cibw-build: "cp310-*"
          upload-artifact: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  python-sdist:
    name: Build Python sdist
    needs: [prepare, check-pypi, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_python == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: xberg-io/actions/build-python-sdist@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          package-dir: packages/python
          output-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          retention-days: 14

  node-bindings:
    name: Build Node bindings (${{ matrix.target }})
    needs: [prepare, check-npm]
    if: ${{ needs.prepare.outputs.release_node == 'true' && (needs.check-npm.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: macos-latest,
              target: aarch64-apple-darwin,
              rust_target: "",
              use_napi_cross: false,
            }
          - {
              os: macos-15-intel,
              target: x86_64-apple-darwin,
              rust_target: "",
              use_napi_cross: false,
            }
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              rust_target: "",
              use_napi_cross: false,
            }
          - {
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              rust_target: "",
              use_napi_cross: false,
            }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              rust_target: "",
              use_napi_cross: false,
            }
          - {
              os: windows-latest,
              target: aarch64-pc-windows-msvc,
              rust_target: aarch64-pc-windows-msvc,
              use_napi_cross: false,
            }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.rust_target || matrix.target }}
          cache-key-prefix: publish-node-${{ matrix.target }}

      - uses: xberg-io/actions/setup-node-workspace@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          node-version: "22"

      - name: Build native module
        uses: xberg-io/actions/build-node-napi@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          crate-dir: crates/crawlberg-node
          target: ${{ matrix.target }}
          use-napi-cross: ${{ matrix.use_napi_cross }}
          pack-target-tarball: node-bindings-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: node-bindings-${{ matrix.target }}
          path: node-bindings-${{ matrix.target }}.tar.gz
          retention-days: 14

  wasm-bindings:
    name: Build WASM package
    needs: [prepare, check-wasm]
    if: ${{ needs.prepare.outputs.release_wasm == 'true' && (needs.check-wasm.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/install-wasi-sdk@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Configure WASM C compiler
        shell: bash
        run: |
          echo "CC_wasm32_unknown_unknown=${WASI_SDK_PATH}/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=${WASI_SDK_PATH}/bin/ar" >> "$GITHUB_ENV"

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: wasm32-unknown-unknown
          cache-key-prefix: publish-wasm

      - uses: xberg-io/actions/setup-node-workspace@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          node-version: "22"

      - uses: xberg-io/actions/build-wasm-package@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          crate-dir: crates/crawlberg-wasm
          pack-tarball: "true"

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-bundle
          path: |
            crates/crawlberg-wasm/dist/**
            crates/crawlberg-wasm/dist-node/**
            crates/crawlberg-wasm/dist-web/**
            crates/crawlberg-wasm/pkg/**
            crates/crawlberg-wasm/package.json
          retention-days: 14

  ruby-gem:
    name: Build Ruby gem (${{ matrix.label }})
    needs: [prepare, check-rubygems, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_ruby == 'true' && (needs.check-rubygems.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      RB_SYS_CARGO_PROFILE: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: ubuntu-24.04-arm, label: linux-aarch64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Drop cached CLI binaries
        shell: bash
        run: rm -rf packages/ruby/exe/* packages/ruby/pkg

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          cache-key-prefix: publish-ruby-${{ matrix.label }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "4.0.3"
          bundler-cache: false

      - name: Install Ruby dependencies
        shell: bash
        working-directory: packages/ruby
        run: |
          gem install bundler -v 4.0.3
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - uses: xberg-io/actions/build-ruby-gem@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          package-dir: packages/ruby

      - name: Build platform gem
        shell: bash
        run: |
          cd packages/ruby
          bundle exec rake compile
          bundle exec rake build

      - name: Drop source gem on non-canonical builders
        if: ${{ matrix.label != 'linux' }}
        shell: bash
        run: |
          shopt -s nullglob
          for f in packages/ruby/pkg/*.gem; do
            base="$(basename "$f")"
            case "$base" in
              *-x86_64-linux.gem|*-aarch64-linux.gem|*-arm64-darwin.gem|*-x86_64-darwin.gem) ;;
              *) echo "Removing non-canonical source gem $base"; rm -f "$f" ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        with:
          name: rubygems-${{ matrix.label }}
          path: packages/ruby/pkg/*.gem
          retention-days: 14

  php-extension:
    name: Build PHP extension (php${{ matrix.php }} ${{ matrix.platform.label }})
    needs: [prepare, check-packagist, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_php == 'true' && (needs.check-packagist.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        platform:
          - { os: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, label: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, label: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, label: macos-x86_64, target: x86_64-apple-darwin }
          - { os: windows-latest, label: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/setup-php@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          php-version: ${{ matrix.php }}

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.platform.target }}
          cache-key-prefix: publish-php-${{ matrix.platform.label }}-php${{ matrix.php }}

      - uses: xberg-io/actions/build-php-extension@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          crate-name: crawlberg-php
          lib-name: crawlberg_php
          php-version: ${{ matrix.php }}
          php-ts: nts
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Determine Windows compiler
        if: runner.os == 'Windows'
        id: wincompiler
        shell: pwsh
        run: |
          $compiler = switch ('${{ matrix.php }}') {
            '8.2' { 'vs16' }
            '8.3' { 'vs16' }
            default { 'vs17' }
          }
          "compiler=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: xberg-io/actions/package-php-pie@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          php-version: ${{ matrix.php }}
          php-ts: nts
          target: ${{ matrix.platform.target }}
          windows-compiler: ${{ steps.wincompiler.outputs.compiler }}
          version: ${{ needs.prepare.outputs.version }}
          output-dir: dist/php-package

      - uses: actions/upload-artifact@v7
        with:
          name: php-package-${{ matrix.platform.label }}-php${{ matrix.php }}
          path: |
            dist/php-package/php_*.tgz
            dist/php-package/php_*.tgz.sha256
            dist/php-package/php_*.zip
            dist/php-package/php_*.zip.sha256
          retention-days: 14

  cli-release:
    name: Build & release CLI binaries
    needs: [prepare, validate-versions, check-cli, cli-musl-binaries]
    if: ${{ needs.prepare.outputs.release_cli == 'true' && (needs.validate-versions.result == 'success' || needs.validate-versions.result == 'skipped') && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    permissions:
      contents: write
    uses: xberg-io/actions/.github/workflows/reusable-cli-release.yml@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
    with:
      package-name: crawlberg-cli
      binary-name: crawlberg
      tag: ${{ needs.prepare.outputs.tag }}
      asset-prefix: crawlberg-cli-
      checkout-ref: ${{ needs.prepare.outputs.checkout_ref }}
      dry-run: ${{ needs.prepare.outputs.dry_run }}
      build-musl: false
      checksums: true
      extra-cargo-args: --features all
      extra-targets: '[{"os": "macos-15-intel", "target": "x86_64-apple-darwin"}]'

  verify-binstall:
    name: Verify cargo-binstall install
    needs: [prepare, cli-release]
    if: ${{ needs.prepare.outputs.release_cli == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.cli-release.result == 'success' }}
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
    with:
      package-name: crawlberg-cli
      binary-name: crawlberg
      manifest-path: crates/crawlberg-cli
      checkout-ref: ${{ needs.prepare.outputs.checkout_ref }}
      smoke-command: |
        crawlberg --version

  cli-musl-binaries:
    name: Build CLI musl binary (${{ matrix.arch }})
    needs: [prepare, check-cli]
    if: ${{ needs.prepare.outputs.release_cli == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Build musl CLI via Docker
        shell: bash
        run: |
          docker build -f docker/Dockerfile.musl-build --output type=local,dest=./dist .
          file dist/crawlberg

      - name: Package musl CLI archive
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          STAGE="crawlberg-cli-${TARGET}"
          mkdir -p "$STAGE/lib"
          cp dist/crawlberg "$STAGE/"
          cp dist/lib/* "$STAGE/lib/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true
          cp README.md "$STAGE/" 2>/dev/null || true
          tar -czf "crawlberg-cli-${TARGET}.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: crawlberg-cli-${{ matrix.target }}
          path: crawlberg-cli-${{ matrix.target }}.tar.gz
          retention-days: 14

  go-ffi-libraries:
    name: Build Go FFI library (${{ matrix.platform }})
    needs: [prepare, check-go]
    if: ${{ needs.prepare.outputs.release_go == 'true' && (needs.check-go.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, platform: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos-x86_64, target: x86_64-apple-darwin }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-go-${{ matrix.platform }}

      - uses: xberg-io/actions/build-go-ffi@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          crate-name: crawlberg-ffi
          lib-name: crawlberg_ffi
          header-path: crates/crawlberg-ffi/include/crawlberg.h
          archive-name: crawlberg-go-${{ matrix.platform }}.tar.gz
          output-dir: dist/go-ffi

      - uses: actions/upload-artifact@v7
        with:
          name: go-ffi-${{ matrix.platform }}
          path: dist/go-ffi/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  c-ffi-libraries:
    name: Build C FFI distribution (${{ matrix.platform }})
    needs: [prepare, check-c-ffi]
    if: ${{ needs.prepare.outputs.release_c_ffi == 'true' && (needs.check-c-ffi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, platform: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos-x86_64, target: x86_64-apple-darwin }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-c-ffi-${{ matrix.platform }}

      - uses: xberg-io/actions/build-rust-ffi@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          crate-name: crawlberg-ffi
          target: ${{ matrix.target }}

      - name: Stage C FFI distribution
        # Inline: bundle library + header + LICENSE into a single tarball
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          # Stage name must match alef-generated test_apps download_ffi.sh:
          # ASSET_STEM="${FFI_PKG_NAME}-v${VERSION}-${TRIPLE}"
          # where TRIPLE is the Rust target triple (e.g. aarch64-apple-darwin),
          # NOT the publish-yaml "platform" label (e.g. macos-arm64).
          STAGE="crawlberg-ffi-v${VERSION}-${TARGET}"
          mkdir -p "$STAGE/lib" "$STAGE/include"
          find "target/${TARGET}/release" -maxdepth 1 -type f \
            \( -name 'libcrawlberg_ffi.*' -o -name 'crawlberg_ffi.dll' \) \
            -exec cp {} "$STAGE/lib/" \;
          cp crates/crawlberg-ffi/include/crawlberg.h "$STAGE/include/"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          mkdir -p dist/c-ffi
          tar -czf "dist/c-ffi/${STAGE}.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: c-ffi-${{ matrix.platform }}
          path: dist/c-ffi/*.tar.gz
          if-no-files-found: error
          retention-days: 14

