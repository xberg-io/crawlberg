  publish-packagist:
    name: Trigger Packagist update
    needs: [prepare, upload-php-pie-release, check-packagist]
    if: ${{ needs.prepare.outputs.release_php == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-packagist.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: xberg-io/actions/publish-packagist@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          packagist-username: xberg-io
          package-name: xberg-io/crawlberg
          version: ${{ needs.prepare.outputs.version }}
          repository-url: https://github.com/xberg-io/crawlberg
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}

  publish-maven:
    name: Publish Maven (Java) package
    needs: [prepare, validate-versions, java-natives, java-natives-musl, check-maven]
    if: ${{ needs.prepare.outputs.release_java == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && (needs.check-maven.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: java-natives-*
          path: java-natives
          merge-multiple: true

      - name: Stage natives into resources
        shell: bash
        run: |
          mkdir -p packages/java/src/main/resources/natives
          for dir in java-natives/native/*/; do
            classifier="$(basename "$dir")"
            mkdir -p "packages/java/src/main/resources/natives/${classifier}"
            cp -v "${dir}"/* "packages/java/src/main/resources/natives/${classifier}/"
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - uses: xberg-io/actions/setup-maven@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - uses: xberg-io/actions/configure-maven-gpg@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          pom-file: packages/java/pom.xml

      - uses: xberg-io/actions/publish-maven@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          pom-file: packages/java/pom.xml
          maven-profile: publish
          extra-args: -DskipTests
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-nuget:
    name: Publish NuGet package
    needs: [prepare, validate-versions, csharp-natives, csharp-natives-musl, check-nuget]
    if: ${{ needs.prepare.outputs.release_csharp == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && (needs.check-nuget.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: csharp-natives-*
          path: csharp-natives
          merge-multiple: true

      - name: Stage runtimes/<rid>/native into NuGet project
        shell: bash
        run: |
          mkdir -p packages/csharp/runtimes
          for dir in csharp-natives/runtimes/*/; do
            rid="$(basename "$dir")"
            mkdir -p "packages/csharp/runtimes/${rid}/native"
            cp -v "${dir}native/"* "packages/csharp/runtimes/${rid}/native/"
          done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Render runtime.json from template
        uses: xberg-io/actions/render-runtime-json@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          template-path: packages/csharp/Crawlberg/runtime.json.template
          version: ${{ needs.prepare.outputs.version }}

      - name: Pack NuGet package
        shell: bash
        run: |
          dotnet pack packages/csharp/Crawlberg.slnx \
            -c Release \
            -p:Version=${{ needs.prepare.outputs.version }} \
            -o dist/nuget

      - uses: xberg-io/actions/publish-nuget@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          packages-dir: dist/nuget
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  publish-hex:
    name: Publish Elixir Hex package
    needs: [prepare, upload-elixir-release, check-hex, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.upload-elixir-release.result == 'success' && needs.prepare.outputs.release_elixir == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-hex.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    environment: hex
    permissions:
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Generate checksums from GitHub release
        if: needs.prepare.outputs.dry_run != 'true'
        uses: xberg-io/actions/generate-elixir-checksums@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          github-repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          lib-name: crawlberg_nif
          nif-versions: "2.16,2.17"
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc
          output-path: packages/elixir/checksum-Elixir.Crawlberg.Native.exs
          token: ${{ steps.app-token.outputs.token }}

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Install Mix dependencies
        run: mix local.hex --force && mix local.rebar --force && mix deps.get
        working-directory: packages/elixir
        shell: bash

      # ~keep `mix format` must run AFTER `mix deps.get`: packages/elixir/.formatter.exs
      # declares `import_deps: [:rustler]`, and import_deps resolves against FETCHED deps,
      # not declared ones. With the install step later, format failed every release with
      # "Unknown dependency :rustler given to :import_deps".
      # ~keep generate-elixir-checksums writes this file directly from the GitHub release
      # asset list, not through `mix format`, so its `=>` lines routinely exceed the
      # 140-char line_length in packages/elixir/.formatter.exs and land unformatted on
      # main. `poly fmt --check .` (CI Lint's Format check step) then fails on every
      # release that touches this file. Format it before committing so it never drifts.
      - name: Format generated checksum file
        if: needs.prepare.outputs.dry_run != 'true'
        run: mix format checksum-Elixir.Crawlberg.Native.exs
        working-directory: packages/elixir
        shell: bash

      - name: Commit updated checksum file to main
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          git add packages/elixir/checksum-Elixir.Crawlberg.Native.exs
          if git diff --cached --quiet; then
            echo "No checksum changes to commit — skipping"
            exit 0
          fi
          CHECKSUM_SNAPSHOT="$(mktemp)"
          cp packages/elixir/checksum-Elixir.Crawlberg.Native.exs "$CHECKSUM_SNAPSHOT"
          git commit -m "chore: update Elixir NIF checksums for v${{ needs.prepare.outputs.version }}"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed; retrying after rebase"
            if [ "$i" -eq 5 ]; then
              echo "ERROR: push failed after 5 attempts" >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            cp "$CHECKSUM_SNAPSHOT" packages/elixir/checksum-Elixir.Crawlberg.Native.exs
            git add packages/elixir/checksum-Elixir.Crawlberg.Native.exs
            if git diff --cached --quiet; then
              echo "Remote already has these checksums — done"
              exit 0
            fi
            git commit -m "chore: update Elixir NIF checksums for v${{ needs.prepare.outputs.version }}"
            sleep $((i * 2))
          done
        shell: bash

      - uses: xberg-io/actions/publish-hex@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          package-dir: packages/elixir
          skip-docs: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  kotlin-android-natives:
    name: Build kotlin-android natives (${{ matrix.abi }})
    needs: prepare
    if: ${{ needs.prepare.outputs.release_kotlin_android == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86
            target: i686-linux-android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: kotlin-android-${{ matrix.abi }}

      - uses: xberg-io/actions/setup-android-ndk@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - uses: xberg-io/actions/build-android-natives@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          crate-name: crawlberg-jni
          lib-name: cberg_jni
          abis: ${{ matrix.abi }}

      - uses: actions/upload-artifact@v7
        with:
          name: kotlin-android-${{ matrix.abi }}
          path: dist/android-natives/${{ matrix.abi }}/
          if-no-files-found: error

  publish-kotlin-android:
    name: Publish kotlin-android (Maven Central via Gradle)
    needs: [prepare, validate-versions, kotlin-android-natives, check-maven-kotlin-android]
    if: ${{ needs.prepare.outputs.release_kotlin_android == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && (needs.check-maven-kotlin-android.outputs.kotlin_android_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: kotlin-android-*
          path: kotlin-android-natives
          merge-multiple: false

      - name: Stage natives into AAR jniLibs
        run: |
          for abi in arm64-v8a x86_64 armeabi-v7a x86; do
            src="kotlin-android-natives/kotlin-android-${abi}"
            [ -d "$src" ] || continue
            mkdir -p "packages/kotlin-android/src/main/jniLibs/${abi}"
            cp -v "${src}/libcberg_jni.so" \
                  "packages/kotlin-android/src/main/jniLibs/${abi}/"
          done
        shell: bash

      - uses: xberg-io/actions/publish-maven-gradle@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          working-directory: packages/kotlin-android
          gradle-task: publishAndReleaseToMavenCentral
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-zig:
    name: Publish Zig package metadata
    needs: [prepare, validate-versions, zig-package, check-zig, c-ffi-libraries]
    if: ${{ needs.prepare.outputs.release_zig == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && (needs.check-zig.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: c-ffi-*
          path: dist/c-ffi-downloaded
          merge-multiple: false

      - name: Lay out FFI artifacts for multi-platform Zig bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # RID convention is per the publish-zig action contract:
          # linux-x64, linux-arm64, osx-arm64, osx-x64, win-x64.
          declare -A RID_FOR=(
            ["x86_64-unknown-linux-gnu"]="linux-x64"
            ["aarch64-unknown-linux-gnu"]="linux-arm64"
            ["aarch64-apple-darwin"]="osx-arm64"
            ["x86_64-apple-darwin"]="osx-x64"
            ["x86_64-pc-windows-msvc"]="win-x64"
          )
          out="ffi-artifacts"
          mkdir -p "$out/include"
          for art in dist/c-ffi-downloaded/*/crawlberg-ffi-v"${VERSION}"-*.tar.gz; do
            [ -f "$art" ] || continue
            target=$(basename "$art" .tar.gz)
            target="${target#crawlberg-ffi-v"${VERSION}"-}"
            rid="${RID_FOR[$target]:-}"
            if [ -z "$rid" ]; then
              echo "::warning::Unknown target $target — skipping"
              continue
            fi
            tmp=$(mktemp -d)
            tar -xzf "$art" -C "$tmp"
            stage_root=$(find "$tmp" -maxdepth 1 -mindepth 1 -type d | head -1)
            mkdir -p "$out/$rid"
            cp "$stage_root"/lib/* "$out/$rid/"
            cp "$stage_root"/include/*.h "$out/include/" 2>/dev/null || true
            rm -rf "$tmp"
          done
          ls -la "$out"
          for d in "$out"/*/; do echo "--- $d ---"; ls -la "$d"; done

      - uses: xberg-io/actions/publish-zig@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          working-directory: packages/zig
          tag: ${{ needs.prepare.outputs.tag }}
          # ~keep build.zig.zon placeholder hash.
          package-name: crawlberg-zig
          multi-platform-ffi-dir: ffi-artifacts
          module-name: crawlberg
          ffi-lib-name: crawlberg_ffi
          update-release-notes: "true"
          update-existing: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  publish-homebrew-formula:
    name: Update Homebrew formula source
    needs: [prepare, validate-versions, check-homebrew, cli-release, publish-swift-checksums]
    if: |
      always() &&
      needs.prepare.outputs.release_homebrew == 'true' &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.cli-release.result == 'success' &&
      (needs.check-homebrew.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - name: Checkout source repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - name: Update formula source url + sha256
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAP_DIR: ${{ github.workspace }}/homebrew-tap
        run: scripts/publish/update-homebrew-formula.sh

      - name: Commit and push to tap
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No formula changes; skipping commit."
            exit 0
          fi
          git add Formula/crawlberg.rb
          git commit -m "crawlberg ${{ needs.prepare.outputs.version }}"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  # The Windows counterpart of publish-homebrew-formula. There is deliberately no
  # `check-scoop` idempotency gate: the render step rewrites the manifest in place and
  # the commit below is guarded by `git diff --quiet bucket/`, so re-running a release
  # is already a no-op. ~keep
  publish-scoop-manifest:
    name: Update Scoop manifest
    needs: [prepare, cli-release]
    if: ${{ needs.prepare.outputs.release_scoop == 'true' && needs.cli-release.result == 'success' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: bucket-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: scoop-bucket

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: xberg-io/scoop-bucket
          token: ${{ steps.bucket-token.outputs.token }}
          path: scoop-bucket
          persist-credentials: true

      - uses: xberg-io/actions/publish-scoop-manifests@v1
        with:
          bucket-dir: ${{ github.workspace }}/scoop-bucket
          config-file: scripts/publish/scoop.json
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          github-repo: ${{ github.repository }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.source-token.outputs.token }}

      - name: Commit and push to bucket
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: scoop-bucket
        env:
          GH_TOKEN: ${{ steps.bucket-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet bucket/; then
            echo "No manifest changes; skipping commit."
            exit 0
          fi
          git add bucket/crawlberg.json
          git commit -m "crawlberg ${{ needs.prepare.outputs.version }}"
          # Six release pipelines push to this one bucket, so a concurrent release can land
          # between our checkout and our push and reject it as non-fast-forward. Each repo
          # touches only its own manifest, so rebasing onto the new tip and retrying is safe --
          # there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current bucket tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::bucket rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the bucket after 5 attempts"
          exit 1

  homebrew-bottles:
    name: Build Homebrew bottle (${{ matrix.bottle_tag }})
    needs: [prepare, publish-homebrew-formula]
    if: |
      always() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.publish-homebrew-formula.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bottle_tag: arm64_sequoia, install_brew: false }
          - { os: macos-15-intel, bottle_tag: sequoia, install_brew: false }
          - { os: ubuntu-latest, bottle_tag: x86_64_linux, install_brew: true }
          - { os: ubuntu-24.04-arm, bottle_tag: arm64_linux, install_brew: true }
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Install Homebrew (Linux)
        if: ${{ matrix.install_brew }}
        uses: xberg-io/actions/install-homebrew-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Build bottles
        uses: xberg-io/actions/homebrew-build-bottles@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap: xberg-io/homebrew-tap
          formulas: |
            crawlberg
          out-dir: ${{ github.workspace }}/bottle-json
          github-repo: ${{ github.repository }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Upload bottle JSON manifests
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-bottle-json-${{ matrix.bottle_tag }}
          path: ${{ github.workspace }}/bottle-json/*.json
          if-no-files-found: error
          retention-days: 14

  publish-homebrew-bottles:
    name: Merge Homebrew bottle DSL
    needs: [prepare, publish-homebrew-formula, homebrew-bottles]
    # Run whenever the bottle matrix actually ran (success OR partial failure), not
    # only on a clean sweep. A single-platform failure must not discard the bottles
    # that did build: the merge step below rewrites the DSL from whatever manifests
    # are present, so surviving platforms still get bottles while the failed one
    # falls back to a source build.
    if: |
      always() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.publish-homebrew-formula.result == 'success' &&
      needs.homebrew-bottles.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - name: Checkout source repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - name: Download all bottle JSON manifests
        uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/bottle-json
          pattern: homebrew-bottle-json-*
          merge-multiple: true

      - name: Count bottle manifests
        id: bottle-manifests
        run: |
          count=$(find "${{ github.workspace }}/bottle-json" -name 'crawlberg--*.bottle.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Found ${count} bottle manifest(s)"

      # When zero bottles built, the formula bump already stripped the bottle block
      # (update-homebrew-formula.sh), so the published formula installs from source —
      # skip the merge rather than fail on "no JSON manifests".
      - name: Merge bottle DSL into formula
        if: ${{ steps.bottle-manifests.outputs.count != '0' }}
        uses: xberg-io/actions/homebrew-merge-bottles@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap-dir: ${{ github.workspace }}/homebrew-tap
          json-dir: ${{ github.workspace }}/bottle-json
          formulas: |
            crawlberg
          github-repo: ${{ github.repository }}

      - name: Commit and push bottle DSL
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No bottle DSL changes; skipping commit."
            exit 0
          fi
          git add Formula/crawlberg.rb
          git commit -m "crawlberg ${{ needs.prepare.outputs.version }} bottles"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  release-finalize:
    name: Finalize GitHub Release
    needs:
      - prepare
      - verify-assets
      - crates-gate
      - publish-crates
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      # ~keep publish-wasm/publish-kotlin-android resolve to `skipped` (not `failure`)
      # when their build dependency fails, since a failed `needs:` entry makes GHA skip
      # the dependent job outright without evaluating its own `if:`. That skip is
      # invisible to `!contains(needs.*.result, 'failure')` below: if every other publish
      # path had succeeded, a wasm/kotlin-android build failure alone would have let this
      # job finalize/announce the release as complete while those two registries got
      # nothing. Listing the build jobs directly surfaces their real failure/success
      # here; a legitimate skip (release_wasm/release_kotlin_android == false) stays a
      # harmless `skipped`.
      - wasm-bindings
      - publish-packagist
      - publish-maven
      - publish-kotlin-android
      - kotlin-android-natives
      - publish-nuget
      - publish-hex
      - publish-zig
      - publish-homebrew-formula
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - cli-release
      - verify-binstall
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-swift-release
      - publish-swift-checksums
    if: |
      always() &&
      !cancelled() &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.crates-gate.outputs.ok == 'true' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - uses: xberg-io/actions/finalize-release@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          is-prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' && 'true' || 'false' }}
          go-module-path: packages/go
          token: ${{ steps.app-token.outputs.token }}

  announce-discord:
    name: Announce release on Discord
    needs:
      - prepare
      - crates-gate
      - publish-crates
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      # ~keep see the matching comment on release-finalize's needs: list.
      - wasm-bindings
      - publish-packagist
      - publish-maven
      - publish-kotlin-android
      - kotlin-android-natives
      - publish-nuget
      - publish-hex
      - publish-zig
      - publish-homebrew-formula
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-swift-release
      - release-finalize
    if: |
      always() &&
      !cancelled() &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.is_prerelease != 'true' &&
      needs.crates-gate.outputs.ok == 'true' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - uses: xberg-io/actions/announce-release-discord@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          project-name: crawlberg
          token: ${{ steps.app-token.outputs.token }}

  cli-proxy:
    name: Publish CLI proxy package (npm)
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'cli-proxy-v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/publish-npm@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          package-dir: cli-proxy/npm
          access: public
          provenance: "true"

  # --- Coding-agent plugin (lives in plugin/, generated by ai-rulez; see plugin/README.md) ---
  # Additive best-effort like the language jobs above: intentionally NOT part of
  # finalize-release / announce `needs`, so a plugin hiccup never blocks the core
  # release. Both publish the same content every tagged release (version tracks core), so
  # each guards against an already-published version. `needs: [prepare]` only — the plugin
  # has no build- or runtime-dependency on the core packages (mcp-launch.sh resolves the CLI
  # at runtime), so it publishes in parallel with the core jobs. ~keep

  publish-plugin-opencode:
    name: Publish OpenCode plugin to npm
    needs: [prepare]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.release_any == 'true'
      && needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-node-workspace@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      # Plain ESM adapter — no build step. Skip if this version is already on npm so a
      # release re-run is idempotent (publish-npm has no built-in skip-existing). ~keep
      - name: Skip if already on npm
        id: guard
        run: |
          name="$(node -p "require('./plugin/package.json').name")"
          ver="$(node -p "require('./plugin/package.json').version")"
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::${name}@${ver} already on npm; skipping"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: publish via OIDC trusted publishing (like every other
      # npm job here). The classic NPM_TOKEN lacked write access to this package
      # and returned E404; trusted publishing uses the job's id-token instead. ~keep
      - uses: xberg-io/actions/publish-npm@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        if: steps.guard.outputs.skip != 'true'
        with:
          package-dir: plugin
          access: public
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-plugin-hermes:
    name: Publish Hermes plugin to PyPI
    needs: [prepare]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.release_any == 'true'
      && needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      # publish-pypi is idempotent (skips a version already on PyPI). ~keep
      - uses: xberg-io/actions/publish-pypi@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          packages-dir: dist-hermes
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  # ~keep A publish job that was SKIPPED is invisible to `!contains(needs.*.result, 'failure')`
  # — and `skipped` is exactly what a publish job becomes when an upstream gate fails, because a
  # failed `needs:` edge makes GitHub skip the dependent job without evaluating its `if:` at all.
  # tree-sitter-language-pack v1.15.5 shipped a GitHub release to zero registries that way and
  # still reported success. This job judges every target on its own result and treats `skipped`
  # as a failure unless one of the two legitimate reasons applies: the target is not enabled for
  # this release, or its registry probe already found this exact version published.
  release-report:
    name: Report release outcome
    needs:
      - prepare
      - validate-versions
      - crates-gate
      - release-finalize
      - check-pypi
      - check-npm
      - check-wasm
      - check-rubygems
      - check-maven
      - check-nuget
      - check-packagist
      - check-cratesio
      - check-hex
      - check-zig
      - check-maven-kotlin-android
      - check-homebrew
      - check-cli
      - check-go
      - check-c-ffi
      - check-elixir-release
      - publish-crates
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      - publish-packagist
      - publish-maven
      - publish-nuget
      - publish-hex
      - publish-kotlin-android
      - publish-zig
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - publish-swift-checksums
      - cli-release
      - verify-binstall
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-swift-release
    if: ${{ always() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every enabled publish target succeeded
        if: always()
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force_republish }}
          RESULT_PREPARE: ${{ needs.prepare.result }}
          RESULT_VALIDATE: ${{ needs.validate-versions.result }}
          RESULT_FINALIZE: ${{ needs.release-finalize.result }}
          CRATES_GATE_OK: ${{ needs.crates-gate.outputs.ok }}
          CRATES_GATE_OUTCOME: ${{ needs.crates-gate.outputs.outcome }}
          RESULT_PUBLISH_CRATES: ${{ needs.publish-crates.result }}
          RESULT_PUBLISH_PYPI: ${{ needs.publish-pypi.result }}
          RESULT_PUBLISH_RUBYGEMS: ${{ needs.publish-rubygems.result }}
          RESULT_PUBLISH_NODE: ${{ needs.publish-node.result }}
          RESULT_PUBLISH_WASM: ${{ needs.publish-wasm.result }}
          RESULT_PUBLISH_PACKAGIST: ${{ needs.publish-packagist.result }}
          RESULT_PUBLISH_MAVEN: ${{ needs.publish-maven.result }}
          RESULT_PUBLISH_NUGET: ${{ needs.publish-nuget.result }}
          RESULT_PUBLISH_HEX: ${{ needs.publish-hex.result }}
          RESULT_PUBLISH_KOTLIN: ${{ needs.publish-kotlin-android.result }}
          RESULT_PUBLISH_ZIG: ${{ needs.publish-zig.result }}
          RESULT_PUBLISH_HOMEBREW: ${{ needs.publish-homebrew-bottles.result }}
          RESULT_PUBLISH_SCOOP: ${{ needs.publish-scoop-manifest.result }}
          RESULT_CLI_RELEASE: ${{ needs.cli-release.result }}
          RESULT_VERIFY_BINSTALL: ${{ needs.verify-binstall.result }}
          RESULT_UPLOAD_GO: ${{ needs.upload-go-release.result }}
          RESULT_UPLOAD_C_FFI: ${{ needs.upload-c-ffi-release.result }}
          RESULT_UPLOAD_ELIXIR: ${{ needs.upload-elixir-release.result }}
          RESULT_UPLOAD_PHP_PIE: ${{ needs.upload-php-pie-release.result }}
          RESULT_UPLOAD_SWIFT: ${{ needs.upload-swift-release.result }}
          RESULT_SWIFT_CHECKSUMS: ${{ needs.publish-swift-checksums.result }}
          RELEASE_CRATES: ${{ needs.prepare.outputs.release_crates }}
          RELEASE_PYTHON: ${{ needs.prepare.outputs.release_python }}
          RELEASE_RUBY: ${{ needs.prepare.outputs.release_ruby }}
          RELEASE_NODE: ${{ needs.prepare.outputs.release_node }}
          RELEASE_WASM: ${{ needs.prepare.outputs.release_wasm }}
          RELEASE_PHP: ${{ needs.prepare.outputs.release_php }}
          RELEASE_JAVA: ${{ needs.prepare.outputs.release_java }}
          RELEASE_CSHARP: ${{ needs.prepare.outputs.release_csharp }}
          RELEASE_ELIXIR: ${{ needs.prepare.outputs.release_elixir }}
          RELEASE_KOTLIN_ANDROID: ${{ needs.prepare.outputs.release_kotlin_android }}
          RELEASE_ZIG: ${{ needs.prepare.outputs.release_zig }}
          RELEASE_HOMEBREW: ${{ needs.prepare.outputs.release_homebrew }}
          RELEASE_SCOOP: ${{ needs.prepare.outputs.release_scoop }}
          RELEASE_CLI: ${{ needs.prepare.outputs.release_cli }}
          RELEASE_GO: ${{ needs.prepare.outputs.release_go }}
          RELEASE_C_FFI: ${{ needs.prepare.outputs.release_c_ffi }}
          RELEASE_SWIFT: ${{ needs.prepare.outputs.release_swift }}
          EXISTS_CRATES: ${{ needs.check-cratesio.outputs.all_exist }}
          EXISTS_PYPI: ${{ needs.check-pypi.outputs.exists }}
          EXISTS_RUBYGEMS: ${{ needs.check-rubygems.outputs.exists }}
          EXISTS_NPM: ${{ needs.check-npm.outputs.exists }}
          EXISTS_WASM: ${{ needs.check-wasm.outputs.exists }}
          EXISTS_PACKAGIST: ${{ needs.check-packagist.outputs.exists }}
          EXISTS_MAVEN: ${{ needs.check-maven.outputs.exists }}
          EXISTS_NUGET: ${{ needs.check-nuget.outputs.exists }}
          EXISTS_HEX: ${{ needs.check-hex.outputs.exists }}
          EXISTS_KOTLIN_ANDROID: ${{ needs.check-maven-kotlin-android.outputs.kotlin_android_exists }}
          EXISTS_ZIG: ${{ needs.check-zig.outputs.exists }}
          EXISTS_HOMEBREW: ${{ needs.check-homebrew.outputs.exists }}
          EXISTS_CLI: ${{ needs.check-cli.outputs.exists }}
          EXISTS_GO: ${{ needs.check-go.outputs.exists }}
          EXISTS_C_FFI: ${{ needs.check-c-ffi.outputs.exists }}
          EXISTS_ELIXIR: ${{ needs.check-elixir-release.outputs.exists }}
        run: |
          set -uo pipefail
          failed=0

          require_success() {
            local name="$1" result="$2"
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Incomplete release::Required release job '${name}' finished with '${result}' — ${TAG} did not ship."
              failed=1
              return
            fi
            echo "  - ${name}: ok"
          }

          require_publish() {
            local name="$1" result="$2" enabled="$3" already="${4:-}"

            if [[ "${enabled}" != "true" ]]; then
              echo "  - ${name}: not enabled for this release"
              return
            fi
            if [[ "${already}" == "true" && "${FORCE_REPUBLISH}" != "true" ]]; then
              echo "  - ${name}: already published at this version (correctly skipped)"
              return
            fi
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Incomplete release::Publish target '${name}' is enabled and not yet published, but its job finished with '${result}' — refusing to report ${TAG} as a successful release."
              failed=1
              return
            fi
            echo "  - ${name}: published"
          }

          require_success "prepare" "${RESULT_PREPARE}"
          require_success "validate-versions" "${RESULT_VALIDATE}"
          require_success "release-finalize" "${RESULT_FINALIZE}"

          if [[ "${CRATES_GATE_OK}" != "true" ]]; then
            echo "::error title=Incomplete release::crates-gate reported '${CRATES_GATE_OUTCOME}' — the crates.io prerequisite for ${TAG} was never satisfied."
            failed=1
          fi

          require_publish "crates.io" "${RESULT_PUBLISH_CRATES}" "${RELEASE_CRATES}" "${EXISTS_CRATES}"
          require_publish "pypi" "${RESULT_PUBLISH_PYPI}" "${RELEASE_PYTHON}" "${EXISTS_PYPI}"
          require_publish "rubygems" "${RESULT_PUBLISH_RUBYGEMS}" "${RELEASE_RUBY}" "${EXISTS_RUBYGEMS}"
          require_publish "npm" "${RESULT_PUBLISH_NODE}" "${RELEASE_NODE}" "${EXISTS_NPM}"
          require_publish "npm-wasm" "${RESULT_PUBLISH_WASM}" "${RELEASE_WASM}" "${EXISTS_WASM}"
          require_publish "packagist" "${RESULT_PUBLISH_PACKAGIST}" "${RELEASE_PHP}" "${EXISTS_PACKAGIST}"
          require_publish "maven" "${RESULT_PUBLISH_MAVEN}" "${RELEASE_JAVA}" "${EXISTS_MAVEN}"
          require_publish "nuget" "${RESULT_PUBLISH_NUGET}" "${RELEASE_CSHARP}" "${EXISTS_NUGET}"
          require_publish "hex" "${RESULT_PUBLISH_HEX}" "${RELEASE_ELIXIR}" "${EXISTS_HEX}"
          require_publish "maven-kotlin-android" "${RESULT_PUBLISH_KOTLIN}" "${RELEASE_KOTLIN_ANDROID}" "${EXISTS_KOTLIN_ANDROID}"
          require_publish "zig" "${RESULT_PUBLISH_ZIG}" "${RELEASE_ZIG}" "${EXISTS_ZIG}"
          require_publish "homebrew" "${RESULT_PUBLISH_HOMEBREW}" "${RELEASE_HOMEBREW}" "${EXISTS_HOMEBREW}"
          require_publish "scoop" "${RESULT_PUBLISH_SCOOP}" "${RELEASE_SCOOP}"

          # Release assets consumers resolve at install time.
          require_publish "cli-binaries" "${RESULT_CLI_RELEASE}" "${RELEASE_CLI}" "${EXISTS_CLI}"
          require_publish "binstall-verify" "${RESULT_VERIFY_BINSTALL}" "${RELEASE_CLI}" "${EXISTS_CLI}"
          require_publish "go-ffi-assets" "${RESULT_UPLOAD_GO}" "${RELEASE_GO}" "${EXISTS_GO}"
          require_publish "c-ffi-assets" "${RESULT_UPLOAD_C_FFI}" "${RELEASE_C_FFI}" "${EXISTS_C_FFI}"
          require_publish "elixir-nif-assets" "${RESULT_UPLOAD_ELIXIR}" "${RELEASE_ELIXIR}" "${EXISTS_ELIXIR}"
          require_publish "php-pie-assets" "${RESULT_UPLOAD_PHP_PIE}" "${RELEASE_PHP}" "${EXISTS_PACKAGIST}"
          require_publish "swift-assets" "${RESULT_UPLOAD_SWIFT}" "${RELEASE_SWIFT}"
          require_publish "swift-checksums" "${RESULT_SWIFT_CHECKSUMS}" "${RELEASE_SWIFT}"

          if [[ "${failed}" -eq 1 ]]; then
            echo "::error title=Incomplete release::Release ${TAG} did not reach every enabled target. See the errors above."
            exit 1
          fi
          echo "Every enabled publish target for ${TAG} succeeded."
