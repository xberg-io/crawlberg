name: ci-fuzz

on:
  # ~keep TEMPORARY: pull_request CI is disabled repo-wide while the org's Actions runners are
  # ~keep saturated by the open PR backlog; CI runs on pushes to main only. Restore this block
  # ~keep before merging any PR that needs its own CI.
  # pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [toml_loader, waf_classify]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Set nightly as default toolchain
        run: rustup default nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz target ${{ matrix.target }} for 30s
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=30
