name: CI Scripts

on:
  push:
    branches: [main]
    paths: &script-paths
      - "scripts/**"
      - "Taskfile.yml"
      - ".github/workflows/ci-scripts.yaml"
  # ~keep TEMPORARY: pull_request CI is disabled repo-wide while the org's Actions runners are
  # ~keep saturated by the open PR backlog; CI runs on pushes to main only. Restore this block
  # ~keep before merging any PR that needs its own CI.
  # pull_request:
  #   types: [opened, synchronize, reopened, ready_for_review]
  #   branches: [main]
  #   paths: *script-paths
  workflow_dispatch:
    inputs:
      takeover:
        description: Run the isolated document-read proof and banking job
        type: boolean
        default: false
      takeover_phase:
        description: The fixed proof phase to run
        type: choice
        options: [candidate, controls, bank]
        default: candidate
      patch_commit:
        description: Immutable commit containing the reviewed patch manifest
        type: string
        default: ""
      patch_payload:
        description: Base64 compressed reviewed manifest and patch data
        type: string
        default: ""
      patch_digest:
        description: SHA-256 of the reviewed manifest or decoded payload
        type: string
        default: ""

concurrency:
  group: ci-scripts-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The same version task test:scripts:bats expects locally. install-bats defaults to a pin now,
  # but the input is passed explicitly: a default only helps the caller who omits it, and omitting
  # it is how a workflow ends up reading as pinned while installing whatever the release API
  # served that morning.
  BATS_VERSION: "1.14.0"
  # ~keep The `format` job below shells out to a bare `shfmt`, which no runner image ships and
  # nothing here used to install: the job died with exit 127 ("executable file not found in
  # $PATH") on every run from 2026-09-15 onward and was red, unnoticed, for nine days. Pinned
  # rather than "latest" for the same reason BATS_VERSION is: shfmt's default indentation is
  # tabs and the tree is a fixed point of THIS version, so a silent upgrade reformats every
  # file under scripts/tests and turns the check red on bytes nobody touched.
  SHFMT_VERSION: "3.14.1"

jobs:
  bats:
    name: Bats on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, because the helpers under test branch on RUNNER_OS: the macOS arm sets DYLD_* where
        # the Linux arm sets LD_LIBRARY_PATH, so a Linux-only job never executes half the code.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Bats
        uses: xberg-io/actions/install-bats@v1
        with:
          version: ${{ env.BATS_VERSION }}

      - name: Run the shell contract tests
        uses: xberg-io/actions/run-bats@v1
        env:
          # `bats_load_library` searches BATS_LIB_PATH and nothing else. run-bats grew a lib-path
          # input for this, but it is not in the released v1 yet, so the variable is set directly;
          # switch to `lib-path: scripts/tests/lib` once actions ships it. ~keep
          BATS_LIB_PATH: ${{ github.workspace }}/scripts/tests/lib
        with:
          path: scripts/tests/bats
          args: |-
            --recursive
            --print-output-on-failure

  format:
    name: Shell formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      # ~keep No org action wraps shfmt and it is not on the runner image, so the binary is
      # fetched directly from its own release. `poly fmt --check` does NOT cover these files --
      # measured, not assumed: tab-indenting scripts/tests/bats/lib_common.bats to spaces makes
      # `shfmt -d` emit a 59-line diff while poly still reports "All formatted", because poly
      # does not classify `.bats` as shell. This step is load-bearing, not a duplicate of CI Lint.
      - name: Install shfmt
        run: |
          set -euo pipefail
          url="https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          curl -fsSL "$url" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          # ~keep Assert the binary runs and is the pinned build. Without this a 404 saved as a
          # 0-byte file would surface later as a confusing parse error rather than a clear one.
          # The leading "v" is stripped before comparing: shfmt's own release binaries print
          # "v3.14.1" while a distro/homebrew build prints "3.14.1", and pinning the assertion
          # to either spelling makes this step fail for a reason that has nothing to do with
          # formatting.
          installed="$(shfmt --version | tr -d 'v')"
          [ "$installed" = "${SHFMT_VERSION}" ] || {
            echo "expected shfmt ${SHFMT_VERSION}, got '${installed}'" >&2
            exit 1
          }

      - name: Check shell formatting
        run: task lint:shell

  takeover-proof:
    name: Document-read ${{ inputs.takeover_phase }} (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.takeover && github.repository == 'xberg-io/crawlberg' && github.actor == 'tobocop2' && startsWith(github.ref, 'refs/heads/ci/pr568-actions-proof')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      RUST_BACKTRACE: full
      RUST_MIN_STACK: 16777216
      BUILD_PROFILE: ci
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@4585566683ea8da59f427faeb69406947da59f8f
        with:
          show-initial: "false"
          show-final: "true"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@4585566683ea8da59f427faeb69406947da59f8f
        with:
          toolchain: "1.95"
          cache-key-prefix: pr568-proof-${{ matrix.os }}
          use-sccache: "true"

      - name: Install Task
        uses: xberg-io/actions/install-task@4585566683ea8da59f427faeb69406947da59f8f

      - name: Setup Chrome
        uses: xberg-io/actions/setup-chrome@4585566683ea8da59f427faeb69406947da59f8f

      - name: Setup PHP
        uses: xberg-io/actions/setup-php@4585566683ea8da59f427faeb69406947da59f8f
        with:
          php-version: "8.4"
          tools: composer
          extensions: "dom, json, libxml, mbstring, tokenizer, xml, xmlwriter, ctype"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: packages/go/go.sum

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: packages/ruby

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.3"

      - name: Setup Elixir
        uses: xberg-io/actions/setup-elixir@4585566683ea8da59f427faeb69406947da59f8f
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Setup formatting tools
        uses: xberg-io/actions/setup-c-cpp-tools@4585566683ea8da59f427faeb69406947da59f8f

      - name: Install poly
        uses: Goldziher/poly@029a0490abe5e68d264d70714f296b3a3f1c2f85
        with:
          version: "0.28.1"

      - name: Install mutation and normal Cargo hook tools
        run: |
          set -euo pipefail
          cargo install cargo-mutants --version 27.1.0 --locked
          cargo install cargo-sort --locked
          cargo install cargo-machete --locked
          cargo install cargo-deny --locked

      - name: Install the Go hook tool
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/golangci/golangci-lint/c0d3ddc9cf3faa61a4e378e879ece580256d76e5/install.sh -o "$RUNNER_TEMP/pr568-golangci-install.sh"
          sh "$RUNNER_TEMP/pr568-golangci-install.sh" -b "$(go env GOPATH)/bin" v2.13.1

      - name: Resolve normal hook dependencies
        run: |
          set -euo pipefail
          uv sync --no-install-workspace
          uv pip install pyrefly
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          (cd packages/dart && dart pub get)
          (cd packages/elixir && mix deps.get)

      - name: Configure the approved ordinary Git identity
        if: inputs.takeover_phase == 'bank' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          git config --global user.name "Tobias Perelstein"
          git config --global user.email "5562156+tobocop2@users.noreply.github.com"

      - name: Run the fixed proof phase
        if: inputs.takeover_phase != 'bank' || runner.os == 'Linux'
        env:
          PATCH_COMMIT: ${{ inputs.patch_commit }}
          PATCH_PAYLOAD: ${{ inputs.patch_payload }}
          PATCH_DIGEST: ${{ inputs.patch_digest }}
          TAKEOVER_PHASE: ${{ inputs.takeover_phase }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/pr568_proof.py

      - name: Retain proof and hook evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr568-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.takeover_phase }}-${{ matrix.os }}
          path: takeover-evidence/
          retention-days: 7
          if-no-files-found: error
