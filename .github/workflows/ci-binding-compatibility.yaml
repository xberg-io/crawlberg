name: CI Binding Compatibility

on:
  pull_request:
    paths:
      - "crates/**"
      - "packages/python/**"
      - "packages/swift/**"
      - "alef.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "mise-tasks/**"
      - "scripts/ci/**"
      - ".github/workflows/ci-binding-compatibility.yaml"
      - "mise.toml"
      - "mise.lock"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/python/**"
      - "packages/swift/**"
      - "alef.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "mise-tasks/**"
      - "scripts/ci/**"
      - ".github/workflows/ci-binding-compatibility.yaml"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # ~keep Each main push keeps its run; changed PR heads cancel only their previous compatibility run.
  group: binding-compatibility-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || '' }}
  cancel-in-progress: true

env:
  BUILD_PROFILE: "ci"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  declarations:
    name: Binding declarations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Python and uv
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv
      - name: Resolve the mise Python version
        id: mise-python
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: binding-compatibility-declarations-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-${{ hashFiles('uv.lock') }}
          restore-keys: binding-compatibility-declarations-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-
      - name: Check released declarations
        run: mise run binding-compatibility:declarations

  python:
    name: Binding calls (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Python and uv
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv
      - uses: xberg-io/actions/setup-rust@v1
        with:
          use-sccache: "false"
          cache-key-prefix: binding-compatibility-python
      - name: Resolve the mise Python version
        id: mise-python
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: binding-compatibility-python-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-${{ hashFiles('uv.lock') }}
          restore-keys: binding-compatibility-python-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-
      - name: Install Python dependencies
        run: uv sync --all-extras --all-packages --group dev --no-install-project --no-install-workspace
      - name: Add the virtualenv to PATH
        shell: bash
        run: if [ -d .venv/bin ]; then echo "$PWD/.venv/bin" >> "$GITHUB_PATH"; fi
      - name: Build current Python extension
        run: mise run binding-compatibility:python-build
      - name: Check released Python calls
        run: mise run binding-compatibility:python

  swift:
    name: Binding calls (Swift)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
      - uses: xberg-io/actions/setup-rust@v1
        with:
          use-sccache: "false"
          cache-key-prefix: binding-compatibility-swift
      - uses: xberg-io/actions/setup-swift@v1
        with:
          swift-version: "6.0"
      - name: Build current Swift native archives
        run: mise run binding-compatibility:swift-build
      - name: Check committed released Swift calls
        run: mise run binding-compatibility:swift
