name: Diagnose Windows page acquisition

on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful Publish Release run to require before diagnostics
        type: string
        required: true
        default: "39731484525"
      release_tag:
        description: Published release tag belonging to the successful run
        type: string
        required: true
        default: "v1.12.0"

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-windows766-main
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'xberg-io/crawlberg' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      RUST_BACKTRACE: short
      RUST_MIN_STACK: "16777216"
      WINDOWS766_RELEASE_RUN: ${{ inputs.release_run }}
      WINDOWS766_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - uses: xberg-io/actions/install-task@23602a93e64f32d552325d5304540927f27d8794
      - name: Verify evidence guardrails
        run: task ci:windows766:harness-test
      - uses: xberg-io/actions/setup-rust@23602a93e64f32d552325d5304540927f27d8794
        with:
          cache-key-prefix: windows766-diagnostic
          use-sccache: "false"
      - name: Setup Chrome without launching it
        id: chrome
        uses: xberg-io/actions/setup-chrome@23602a93e64f32d552325d5304540927f27d8794
      - name: Record provenance and apply diagnostic instrumentation
        run: task ci:windows766:prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CRAWLBERG_TEST_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Build lifecycle executable once
        run: task ci:windows766:build
      - name: Run control then exact real browser test
        run: task ci:windows766:run
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CRAWLBERG_TEST_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Verify complete evidence and classify outcome
        if: always()
        run: task ci:windows766:verify
      - name: Preserve complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows766-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crawlberg-windows766
          if-no-files-found: error
          retention-days: 14
