name: Prepare Swift release

# ~keep Step one of the two-step release: run on the version-bump commit of main before the tag
# ~keep exists. It pins the bundle checksum into Package.swift, tags that commit and attaches the
# ~keep exact ZIP to the draft release; Publish Release then verifies and reuses those bytes (#816).
on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: false

concurrency:
  group: prepare-swift-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  swift:
    uses: xberg-io/actions/.github/workflows/reusable-swift-release-prepare.yml@v1
    secrets:
      app-id: ${{ secrets.BOT_APP_ID }}
      app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
    with:
      dry-run: ${{ inputs.dry-run }}
      crate-name: crawlberg-swift
      artifact-name: Crawlberg-rs
      binary-target-name: RustBridgeBinary
      use-sccache: "false"
      macos-dynamic-lookup: "false"
      # ~keep cargo-zigbuild's unreleased fix drops rustc's ignored -Wl,-O1 flag for Zig 0.17.
      cargo-zigbuild-revision: 371bac84444fe6f998955889f2106802b817094b
      macos-deployment-target: "15.0"
      # ~keep Rust otherwise links the iOS archive for 10.0 while current aws-lc objects use
      # ~keep ___chkstk_darwin, which the iOS 10 runtime does not provide.
      ios-deployment-target: "13.0"
