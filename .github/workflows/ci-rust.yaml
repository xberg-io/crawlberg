name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-rust.yaml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-rust.yaml"
  workflow_dispatch:

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  RUST_MIN_STACK: 16777216
  BUILD_PROFILE: "ci"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
          - os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          show-initial: "false"
          show-final: "true"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          cache-key-prefix: rust-${{ matrix.os }}
          use-sccache: "true"

      - name: Install Task
        uses: xberg-io/actions/install-task@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      # ~keep ext-php-rs's build.rs shells out to a `php` binary and fails the whole
      # workspace clippy run without it. Same action/version/extensions ci-e2e.yaml
      # already trusts for the php e2e job, so this is not a newly-introduced toolchain.
      - name: Setup PHP
        uses: xberg-io/actions/setup-php@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          php-version: "8.4"
          tools: composer
          extensions: "dom, json, libxml, mbstring, tokenizer, xml, xmlwriter, ctype"

      # ~keep --all-features must match the test step: both build the `crawlberg` bin
      # into the same target dir and CARGO_BIN_EXE_crawlberg resolves to the fixed
      # target/debug/crawlberg path, so a featureless build here uplifts a binary with
      # no `mcp` subcommand and the stdio MCP test then spawns that one. It also closes
      # a lint gap, since feature-gated code was otherwise never linted.
      #
      # ~keep crawlberg-node and crawlberg-wasm are not excluded: napi-build's setup()
      # only reads cargo-set env vars (no `node` binary needed) and crawlberg-wasm has no
      # build.rs at all, so both lint cleanly on every runner without extra setup.
      - name: Run clippy
        run: cargo clippy --workspace --exclude crawlberg-ffi --exclude crawlberg-py --all-features -- -D warnings
        shell: bash

      # ~keep macOS runners ship Chrome preinstalled (see actions/runner-images macos
      # readme), so installing here would only double CI time for no coverage gain.
      # Linux-only closes the gap where browser-gated tests in crates/crawlberg/tests
      # (test_browser_pool_lifecycle, test_browser_profile, test_browser_screenshot,
      # test_interact) previously had no Chrome binary at all and silently skipped via
      # common::is_missing_chrome_message on every CI run.
      - name: Setup Chrome
        if: runner.os == 'Linux'
        uses: xberg-io/actions/setup-chrome@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Run tests
        run: task rust:test:ci
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH || '' }}
          DYLD_LIBRARY_PATH: ${{ env.DYLD_LIBRARY_PATH || '' }}
          DYLD_FALLBACK_LIBRARY_PATH: ${{ env.DYLD_FALLBACK_LIBRARY_PATH || '' }}

      - name: Check no-default-features
        run: cargo check -p crawlberg --no-default-features
        shell: bash

      # ~keep The clippy step above always runs --all-features, which forces browser
      # features on and so never compiles the default-feature configuration — the exact
      # configuration where dead_code went undetected and reached the v1.2.0 publish run.
      - name: Check default features (catches dead_code the --all-features lint hides)
        run: cargo check -p crawlberg-jni -p crawlberg --locked
        shell: bash

      # ~keep wasm32 is never covered by --all-features (browser/native-runtime deps
      # aren't wasm32-compatible) and CI otherwise never compiles it, which is how an
      # unused PathBuf import on wasm32 reached the v1.2.0 publish run. Linux-only: the
      # target and toolchain behave identically across matrix legs, so building it twice
      # only doubles cost for no extra coverage.
      - name: Add wasm32 target
        if: runner.os == 'Linux'
        run: rustup target add wasm32-unknown-unknown
        shell: bash

      - name: Check wasm32 target
        if: runner.os == 'Linux'
        run: cargo check -p crawlberg --target wasm32-unknown-unknown --locked
        shell: bash

  validate-rust:
    name: Validate Rust
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          show-initial: "false"
          show-final: "true"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2
        with:
          cache-key-prefix: validate-rust
          use-sccache: "true"

      - name: Install Task
        uses: xberg-io/actions/install-task@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      # ~keep `task rust:lint:check` runs `deps:check` first, which hard-fails when
      # cargo-machete is absent rather than skipping — deliberately, so the 14 curated
      # [package.metadata.cargo-machete] lists cannot go unread. Nothing installed it here,
      # so the job died on its very first command. Same pattern as ci-fuzz's cargo-fuzz.
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Run Rust lint checks
        run: task rust:lint:check

      - name: Run C lint checks
        run: task c:lint:check

      - name: Install alef
        uses: xberg-io/actions/install-alef@fc21dc868b7ec7f2b29a75c16312a818f7feb6f6 # v1.10.2

      - name: Verify binding API parity
        run: alef verify --exit-code

      - name: Validate vendored C headers match canonical
        shell: bash
        run: |
          CANONICAL="crates/crawlberg-ffi/include/crawlberg.h"
          # ~keep A missing vendored header must fail, not pass: the previous
          # `[ -f "$VENDORED" ] &&` guard silently skipped every stale path and
          # made this step unconditionally green.
          VENDORED_HEADERS="packages/go/include/crawlberg.h"
          FAIL=0
          if [ ! -f "$CANONICAL" ]; then
            echo "::error::canonical header $CANONICAL is missing"
            exit 1
          fi
          for VENDORED in $VENDORED_HEADERS; do
            if [ ! -f "$VENDORED" ]; then
              echo "::error::vendored header $VENDORED is missing — restore it or update VENDORED_HEADERS in this workflow"
              FAIL=1
            elif ! diff -q "$CANONICAL" "$VENDORED" > /dev/null 2>&1; then
              echo "::error::$VENDORED is out of sync with $CANONICAL — run 'alef sync-versions'"
              diff "$CANONICAL" "$VENDORED" | head -20
              FAIL=1
            else
              echo "ok: $VENDORED matches $CANONICAL"
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1
