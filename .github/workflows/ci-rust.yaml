name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      # ~keep alef.toml is the generator's entire configuration and this workflow runs the only
      # ~keep `alef verify` in CI, so omitting it here meant a commit that touched just alef.toml
      # ~keep skipped the drift gate altogether. ci-docs, ci-e2e and ci-lint already watch it.
      - "alef.toml"
      - ".github/workflows/ci-rust.yaml"
      # ~keep This workflow runs the vendored-C-header gate, whose inputs are the tracked header
      # ~keep copies and the script itself. Without these two patterns a commit that edited only
      # ~keep a vendored header, or only the check, skipped the very gate it changed.
      - "packages/**/crawlberg.h"
      - "scripts/ci/check-vendored-headers.sh"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      # ~keep alef.toml is the generator's entire configuration and this workflow runs the only
      # ~keep `alef verify` in CI, so omitting it here meant a commit that touched just alef.toml
      # ~keep skipped the drift gate altogether. ci-docs, ci-e2e and ci-lint already watch it.
      - "alef.toml"
      - ".github/workflows/ci-rust.yaml"
      # ~keep This workflow runs the vendored-C-header gate, whose inputs are the tracked header
      # ~keep copies and the script itself. Without these two patterns a commit that edited only
      # ~keep a vendored header, or only the check, skipped the very gate it changed.
      - "packages/**/crawlberg.h"
      - "scripts/ci/check-vendored-headers.sh"
  workflow_dispatch:

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  RUST_MIN_STACK: 16777216
  BUILD_PROFILE: "ci"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
          - os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1
        with:
          show-initial: "false"
          show-final: "true"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: rust-${{ matrix.os }}
          use-sccache: "true"

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      # ~keep ext-php-rs's build.rs shells out to a `php` binary and fails the whole
      # workspace clippy run without it. Same action/version/extensions ci-e2e.yaml
      # already trusts for the php e2e job, so this is not a newly-introduced toolchain.
      - name: Setup PHP
        uses: xberg-io/actions/setup-php@v1
        with:
          php-version: "8.4"
          tools: composer
          extensions: "dom, json, libxml, mbstring, tokenizer, xml, xmlwriter, ctype"

      # ~keep --all-features must match the test step: both build the `crawlberg` bin
      # into the same target dir and CARGO_BIN_EXE_crawlberg resolves to the fixed
      # target/debug/crawlberg path, so a featureless build here uplifts a binary with
      # no `mcp` subcommand and the stdio MCP test then spawns that one. It also closes
      # a lint gap, since feature-gated code was otherwise never linted.
      #
      # ~keep crawlberg-node and crawlberg-wasm are not excluded: napi-build's setup()
      # only reads cargo-set env vars (no `node` binary needed) and crawlberg-wasm has no
      # build.rs at all, so both lint cleanly on every runner without extra setup.
      - name: Run clippy
        run: cargo clippy --workspace --exclude crawlberg-ffi --exclude crawlberg-py --all-features -- -D warnings
        shell: bash

      # ~keep Runs on EVERY runner, not only Linux. It was `if: runner.os == 'Linux'`, on the
      # reasoning that macOS runners ship Chrome preinstalled (actions/runner-images macos
      # readme) so installing again bought no coverage. PR #112 falsified that on 2026-09-26:
      # `a_redirect_after_a_script_navigation_is_not_counted` failed on `macos-latest` across
      # two runs and passed on `ubuntu-24.04-arm`, and the only browser difference between the
      # legs was that macOS used whatever build its image happened to carry. An unpinned browser
      # is not the same coverage more cheaply -- it is a verdict nobody can reproduce or bisect.
      #
      # ~keep This does NOT make the two legs run the same browser, and it is not meant to. The
      # action installs the chromium snap on `ubuntu-*-arm` (Chrome for Testing publishes no
      # linux-arm64 build) and delegates to browser-actions/setup-chrome elsewhere, so macOS gets
      # Chrome stable. What it buys is that each leg's browser is declared and pinnable.
      #
      # ~keep Linux-only originally closed the gap where browser-gated tests in
      # crates/crawlberg/tests (test_browser_pool_lifecycle, test_browser_profile,
      # test_browser_screenshot, test_interact) had no Chrome binary at all and silently skipped
      # via common::is_missing_chrome_message on every CI run.
      - name: Setup Chrome
        uses: xberg-io/actions/setup-chrome@v1

      - name: Run tests
        run: task rust:test:ci
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH || '' }}
          DYLD_LIBRARY_PATH: ${{ env.DYLD_LIBRARY_PATH || '' }}
          DYLD_FALLBACK_LIBRARY_PATH: ${{ env.DYLD_FALLBACK_LIBRARY_PATH || '' }}

      - name: Check no-default-features
        run: cargo check -p crawlberg --no-default-features
        shell: bash

      # ~keep The clippy step above always runs --all-features, which forces browser
      # features on and so never compiles the default-feature configuration — the exact
      # configuration where dead_code went undetected and reached the v1.2.0 publish run.
      - name: Check default features (catches dead_code the --all-features lint hides)
        run: cargo check -p crawlberg-jni -p crawlberg --locked
        shell: bash

      # ~keep wasm32 is never covered by --all-features (browser/native-runtime deps
      # aren't wasm32-compatible) and CI otherwise never compiles it, which is how an
      # unused PathBuf import on wasm32 reached the v1.2.0 publish run. Linux-only: the
      # target and toolchain behave identically across matrix legs, so building it twice
      # only doubles cost for no extra coverage.
      - name: Add wasm32 target
        if: runner.os == 'Linux'
        run: rustup target add wasm32-unknown-unknown
        shell: bash

      - name: Check wasm32 target
        if: runner.os == 'Linux'
        run: cargo check -p crawlberg --target wasm32-unknown-unknown --locked
        shell: bash

  # ~keep Every feature-configuration bug this workflow has accumulated a step for was the
  # ~keep same bug: a configuration nothing compiled. --all-features forces `browser` on,
  # ~keep --no-default-features turns everything off, so the single-feature sets in between were
  # ~keep never built -- which is how `browser-chromiumoxide` alone came to reference a `stealth`
  # ~keep module gated on the wider `browser` (xberg-io/crawlberg#70) and stayed broken with a
  # ~keep green CI. This generalises those one-off steps instead of adding another.
  feature-combinations:
    name: Feature combinations
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1
        with:
          show-initial: "false"
          show-final: "true"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: feature-combinations
          use-sccache: "true"

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked

      # ~keep Scoped to -p crawlberg: it owns every feature flag, and a workspace-wide run would
      # ~keep drag in ext-php-rs's `php` binary and the FFI/py build scripts for no extra
      # ~keep coverage. --no-dev-deps keeps each configuration to a library build; the test
      # ~keep targets are already covered by the --all-features clippy run in the `rust` job.
      # ~keep No --locked: cargo-hack reruns cargo against crates/crawlberg/Cargo.toml directly
      # ~keep and that rejects --locked with "cannot update the lock file", even though the lock
      # ~keep comes back byte-identical. The diff check below is the stronger guarantee anyway --
      # ~keep it fails on real drift rather than on cargo wanting write access.
      - name: Clippy each feature
        run: cargo hack clippy -p crawlberg --each-feature --no-dev-deps -- -D warnings
        shell: bash

      - name: Assert the lockfile did not drift
        run: git diff --exit-code -- Cargo.lock
        shell: bash

  validate-rust:
    name: Validate Rust
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1
        with:
          show-initial: "false"
          show-final: "true"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: validate-rust
          use-sccache: "true"

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      # ~keep `task rust:lint:check` runs `deps:check` first, which hard-fails when
      # cargo-machete is absent rather than skipping — deliberately, so the 14 curated
      # [package.metadata.cargo-machete] lists cannot go unread. Nothing installed it here,
      # so the job died on its very first command. Same pattern as ci-fuzz's cargo-fuzz.
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Run Rust lint checks
        run: task rust:lint:check

      - name: Run C lint checks
        run: task c:lint:check

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      - name: Verify binding API parity
        run: alef verify --exit-code

      # ~keep The list this step used to carry named one path, packages/go/include/crawlberg.h,
      # ~keep which crates/crawlberg-ffi/build.rs writes in the same call as the canonical header
      # ~keep — so the only copy it compared was the one that cannot differ, and the four other
      # ~keep tracked copies went unchecked for months (#162, folded into #182). The list now
      # ~keep lives in the script, which discovers every tracked crawlberg.h from git and fails on
      # ~keep any it does not classify, so a new vendored copy cannot be added silently.
      - name: Validate vendored C headers match canonical
        shell: bash
        run: ./scripts/ci/check-vendored-headers.sh
