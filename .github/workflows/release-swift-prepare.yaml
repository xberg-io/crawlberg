name: Swift Release Preparation

# ~keep SwiftPM resolves `from:`/`exact:` requirements to the core vX.Y.Z tag, so that tag's root
# ~keep Package.swift must already pin the checksum of the bundle it downloads. This workflow runs
# ~keep on the version-bump commit BEFORE the tag exists: it builds the bundle once, pins its
# ~keep checksum with alef's version sync, commits that to main, creates the tag on that commit and
# ~keep attaches the exact ZIP and receipt to the draft release. publish.yaml then verifies and
# ~keep reuses those bytes; nothing rebuilds the ZIP, whose bytes are not reproducible (#816).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (vX.Y.Z, matching Cargo.toml on main)"
        required: true
        type: string
      dry_run:
        description: "Build and verify the pin without pushing, tagging or uploading"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  swift-artifactbundle:
    name: Build and pin the Swift artifact bundle
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Python
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python github:Goldziher/poly

      - name: Require an unreleased tag that matches Cargo.toml
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match the Cargo.toml version ${version} on ${GITHUB_SHA}." >&2
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists. A release tag is never moved; bump to a new version." >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - uses: xberg-io/actions/setup-rust@v1
        with:
          use-sccache: "false"
          macos-dynamic-lookup: "false"
      # ~keep cargo-zigbuild's unreleased fix drops rustc's ignored -Wl,-O1 flag for Zig 0.17.
      - name: Install compatible Swift cross-linker
        run: >-
          cargo install --locked --force
          --git https://github.com/rust-cross/cargo-zigbuild
          --rev 371bac84444fe6f998955889f2106802b817094b cargo-zigbuild
      - uses: xberg-io/actions/build-swift-artifactbundle@v1
        id: bundle
        # ~keep Rust otherwise links the iOS archive for 10.0 while current aws-lc objects use
        # ~keep ___chkstk_darwin, which the iOS 10 runtime does not provide.
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        with:
          crate-name: crawlberg-swift
          artifact-name: Crawlberg-rs
          receipt-version: ${{ steps.version.outputs.version }}

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      # ~keep alef finds the ZIP and its receipt in dist/swift-artifactbundle/ on the clean tree
      # ~keep and pins that exact digest. Without --regen alef skips the prepared bundle entirely
      # ~keep and still exits 0. With it, alef 0.119.0 also re-renders test_apps/ and poly.toml
      # ~keep without the formatting `alef verify` holds main to (the full `alef:regenerate` restores
      # ~keep them byte for byte), so those re-renders are put back from HEAD and only Package.swift
      # ~keep is kept; the verify step then proves it differs from HEAD by the checksum value alone.
      - name: Pin the bundle checksum into Package.swift
        run: |
          set -euo pipefail
          alef sync-versions --regen
          rerendered="${RUNNER_TEMP}/swift-sync-rerendered"
          git diff --name-only -- . ':(exclude)Package.swift' >"$rerendered"
          if [ -s "$rerendered" ]; then
            echo "::warning::alef sync-versions re-rendered files besides Package.swift; restoring them from HEAD: $(tr '\n' ' ' <"$rerendered")"
            git restore --source=HEAD --pathspec-from-file="$rerendered"
          fi

      - name: Verify the pin changes only the checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          python3 scripts/ci/swift_release.py verify
          --zip dist/swift-artifactbundle/Crawlberg-rs.artifactbundle.zip
          --receipt dist/swift-artifactbundle/Crawlberg-rs.artifactbundle.release.json
          --version "$VERSION" --repository "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v7
        with:
          name: swift-release-prepared
          path: |
            Package.swift
            dist/swift-artifactbundle/Crawlberg-rs.artifactbundle.zip
            dist/swift-artifactbundle/Crawlberg-rs.artifactbundle.release.json
          if-no-files-found: error
          retention-days: 90

  # ~keep A separate job so "Re-run failed jobs" reuses the uploaded bytes: every partial state
  # ~keep (pin pushed but no tag, tag but no asset) is completed from the same ZIP, never a rebuild.
  tag-release:
    name: Commit the pin, tag it and attach the bundle
    needs: swift-artifactbundle
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Install Python
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python

      - uses: actions/download-artifact@v8
        with:
          name: swift-release-prepared
          path: .

      - name: Verify the pin changes only the checksum
        env:
          VERSION: ${{ needs.swift-artifactbundle.outputs.version }}
        run: >-
          python3 scripts/ci/swift_release.py verify
          --zip dist/swift-artifactbundle/Crawlberg-rs.artifactbundle.zip
          --receipt dist/swift-artifactbundle/Crawlberg-rs.artifactbundle.release.json
          --version "$VERSION" --repository "$GITHUB_REPOSITORY"

      - name: Commit the pin to main and create the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          python3 scripts/ci/swift_release.py finalize --tag "$TAG" --branch main

      - name: Ensure the draft release exists
        uses: xberg-io/actions/publish-github-release@v1
        with:
          tag: ${{ inputs.tag }}
          notes: "Release ${{ inputs.tag }}"
          draft: "true"
          prerelease: ${{ contains(inputs.tag, '-') }}
          token: ${{ steps.app-token.outputs.token }}

      # ~keep Uploads the ZIP only when the release lacks it and fails when an attached ZIP differs;
      # ~keep publish.yaml creates release/swift/<version>, so the branch is skipped here.
      - uses: xberg-io/actions/publish-swift-release@v1
        with:
          tag: ${{ inputs.tag }}
          bundle-zip: dist/swift-artifactbundle/Crawlberg-rs.artifactbundle.zip
          receipt: dist/swift-artifactbundle/Crawlberg-rs.artifactbundle.release.json
          legacy-branch: ""
          token: ${{ steps.app-token.outputs.token }}

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ inputs.tag }}
          working-directory: dist/swift-artifactbundle
          assets: Crawlberg-rs.artifactbundle.release.json
          token: ${{ steps.app-token.outputs.token }}
