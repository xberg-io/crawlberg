name: CI Docker

on:
  workflow_dispatch:

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  docker:
    name: Docker (${{ matrix.variant }})
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [full, cli]
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@75a483180eb94ee41af61d27790b1e6593080406 # v1.8.129

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile${{ matrix.variant == 'cli' && '.cli' || '' }}
          push: false
          load: true
          tags: crawlberg:${{ matrix.variant }}
          cache-from: type=gha,scope=ci-docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=ci-docker-${{ matrix.variant }}

      - name: Save Docker image
        shell: bash
        run: |
          mkdir -p /tmp
          docker save crawlberg:${{ matrix.variant }} | gzip > /tmp/crawlberg-${{ matrix.variant }}.tar.gz
          ls -lh /tmp/crawlberg-${{ matrix.variant }}.tar.gz

      - name: Check image size
        uses: xberg-io/actions/check-docker-image-size@75a483180eb94ee41af61d27790b1e6593080406 # v1.8.129
        with:
          image: crawlberg:${{ matrix.variant }}
          warn-mb: ${{ matrix.variant == 'cli' && '200' || '' }}
          label: "${{ matrix.variant }} image"

      - name: Run feature tests
        if: matrix.variant != 'cli'
        run: scripts/ci/docker/run-feature-tests.sh "${{ matrix.variant }}"

      - name: Run configuration tests
        if: matrix.variant != 'cli'
        run: scripts/ci/docker/run-config-tests.sh "${{ matrix.variant }}"

      - name: Run CLI tests
        if: matrix.variant == 'cli'
        run: scripts/ci/docker/run-cli-tests.sh
