name: CI Lint

# ~keep This workflow was `workflow_dispatch`-only, so lint never ran on a push or a
# PR — its one and only run was in May 2026 and it failed unnoticed. Triggers match
# the sibling repos'; no path filter, because poly lints every file type here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@b95610bd6a981b7788b9e25ec9a29332f46e7297 # v1.11.5
    with:
      setup-rust: true
      setup-python: true
      python-version: "3.13"
      # poly's checkstyle whole-project check runs `mvn checkstyle:check` on
      # packages/java; checkstyle 13+ needs JDK 21+. ~keep
      setup-java: true
      # The remaining whole-project checks poly runs (golangci-lint, rubocop, steep,
      # dart-analyze, credo) each need their own toolchain. Without them this job
      # skipped poly's workspace phase entirely, so those five linters ran only in
      # the git hooks and CI never saw them. ~keep
      setup-go: true
      # ~keep The reusable workflow defaults to golangci-lint v2.12.2, which vendors
      # honnef.co/go/tools v0.7.0. That IR builder panics building the Go 1.27 stdlib
      # (`buildir: package "poll": unexpected expr: *ast.KeyValueExpr`), so `poly lint .`
      # died on golangci-lint before reaching a single crawlberg finding. `go-version` is
      # `stable`, which is now 1.27, so the toolchain cannot be walked back without also
      # losing the go.mod-declared floor. v2.13.1 handles 1.27 — verified locally against
      # packages/go with go1.27.0: 0 issues, no panic.
      golangci-lint-version: v2.13.1
      setup-ruby: true
      setup-dart: true
      setup-elixir: true

  # ~keep alef-snippets used to run as a poly `workspace = true` whole-project hook,
  # but the reusable `validate` job above never installs alef (it's a `uses:` call into
  # a shared org workflow with no alef input, and no step can be injected into it from
  # here), so `poly lint .` failed every run with `alef: not found`. Split out as its
  # own job with a direct alef install instead of changing shared org infra mid-release.
  alef-snippets:
    name: Alef snippets
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install alef
        uses: xberg-io/actions/install-alef@b95610bd6a981b7788b9e25ec9a29332f46e7297 # v1.11.5

      # ~keep dart, elixir and zig are the only three toolchains `alef snippets check`
      # needs that ubuntu-latest does not preinstall. Without them those snippets report
      # Unavailable instead of being checked at all, so the three languages go silently
      # unvalidated rather than failing loudly. Install them so the check is real.
      - name: Setup Elixir
        uses: xberg-io/actions/setup-elixir@b95610bd6a981b7788b9e25ec9a29332f46e7297 # v1.11.5
        with:
          elixir-version: "1.17"
          otp-version: "27"

      # ~keep Dart 3.11.6 hits a dart-lang/sdk analysis-server bug where `dart analyze`
      # crashes on shutdown with "No state location, so plugin could not be copied"
      # (https://github.com/dart-lang/sdk/issues/62420), failing every snippet check
      # even though the snippet itself is valid. Fixed upstream in commit 3ece23ddc,
      # first in a stable release with 3.12.0. Pin to 3.12.2 to pick up the fix.
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2"

      - name: Setup Zig
        uses: xberg-io/actions/setup-zig@b95610bd6a981b7788b9e25ec9a29332f46e7297 # v1.11.5
        with:
          version: "0.16.0"

      # ~keep No `--strict`. `--strict` fails the run on every Skip, Unavailable AND Downgraded
      # (alef `cli::commands::snippets::has_incomplete_coverage`), and six languages are still
      # annotated `snippet:syntax-only` pending a session — exactly the state `alef.toml`'s
      # `[workspace.docs.snippets]` comment says to keep `strict` off for. Passing it on the
      # command line force-enabled what the config deliberately disables, so the job could never
      # go green. Turn it on when the last session lands, per that comment — not before.
      - name: Check snippets
        run: alef snippets check --cache off
