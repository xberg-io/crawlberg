name: CI Lint

# ~keep This workflow was `workflow_dispatch`-only, so lint never ran on a push or a
# PR — its one and only run was in May 2026 and it failed unnoticed. Triggers match
# the sibling repos'; no path filter, because poly lints every file type here.
on:
  push:
    branches: [main]
  # ~keep TEMPORARY: pull_request CI is disabled repo-wide while the org's Actions runners are
  # ~keep saturated by the open PR backlog; CI runs on pushes to main only. Restore this block
  # ~keep before merging any PR that needs its own CI.
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-lint-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ~keep docs-site/src/content/docs/changelog.md mirrors CHANGELOG.md by hand and nothing synced
  # them (#127), so they drifted on main: the mirror was missing two whole [Unreleased] entries.
  # This job lives in ci-lint because ci-lint is the only workflow with no path filter, so it
  # fires whichever of the two files a commit touches.
  changelog-mirror:
    name: Changelog mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the docs-site changelog mirror
        run: ./scripts/ci/check-changelog-mirror.sh

  # ~keep A field added in the middle of a bound struct changes every positional constructor of
  # the bindings, and nothing compared them with the last release (#717). The check reads the
  # generated Python stub and the Swift sources of the newest release tag, so the checkout needs
  # the tags. The Swift reader is the tree-sitter grammar: the pinned wheels must install, or the
  # check fails at its import.
  released-constructors:
    name: Released constructors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Python
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python
      - name: Install the Swift reader
        run: python3 -m pip install -r scripts/ci/requirements-released-constructors.txt
      - name: Test the check
        run: python3 scripts/ci/test_released_constructors.py
      - name: Check the constructors of the last release
        run: ./scripts/ci/check_released_constructors.py

  release-contracts:
    name: Release package contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Task and Python
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: task python
      - name: Install workflow parser
        run: python3 -m pip install 'PyYAML>=6.0.3'
      # ~keep The discovery below also runs the tests of the released-constructor check.
      - name: Install the Swift reader
        run: python3 -m pip install -r scripts/ci/requirements-released-constructors.txt
      - name: Test native package publication
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check consumer release pins
        run: python3 scripts/sync_consumer_versions.py --check

  validate:
    name: Validate
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true
      rust-use-sccache: false
      setup-python: true
      python-version: "3.13"
      # poly's checkstyle whole-project check runs `mvn checkstyle:check` on
      # packages/java; checkstyle 13+ needs JDK 21+. ~keep
      setup-java: true
      # The remaining whole-project checks poly runs (golangci-lint, rubocop, steep,
      # dart-analyze, credo) each need their own toolchain. Without them this job
      # skipped poly's workspace phase entirely, so those five linters ran only in
      # the git hooks and CI never saw them. ~keep
      setup-go: true
      # ~keep The reusable workflow defaults to golangci-lint v2.12.2, which vendors
      # honnef.co/go/tools v0.7.0. That IR builder panics building the Go 1.27 stdlib
      # (`buildir: package "poll": unexpected expr: *ast.KeyValueExpr`), so `poly lint .`
      # died on golangci-lint before reaching a single crawlberg finding. `go-version` is
      # `stable`, which is now 1.27, so the toolchain cannot be walked back without also
      # losing the go.mod-declared floor. v2.13.1 handles 1.27 — verified locally against
      # packages/go with go1.27.0: 0 issues, no panic.
      golangci-lint-version: v2.13.1
      setup-ruby: true
      setup-dart: true
      setup-elixir: true

  # ~keep alef-snippets used to run as a poly `workspace = true` whole-project hook,
  # but the reusable `validate` job above never installs alef (it's a `uses:` call into
  # a shared org workflow with no alef input, and no step can be injected into it from
  # here), so `poly lint .` failed every run with `alef: not found`. Split out as its
  # own job with a direct alef install instead of changing shared org infra mid-release.
  alef-snippets:
    name: Alef snippets
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      # ~keep dart, elixir and zig are the three toolchains `alef snippets check` needs
      # that ubuntu-latest does not preinstall at all. Without them those snippets report
      # Unavailable instead of being checked at all, so the three languages go silently
      # unvalidated rather than failing loudly. Install them so the check is real. Java is
      # preinstalled but at the wrong version — see the mise install step below.
      - name: Setup Elixir
        uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      # ~keep Dart 3.11.6 hits a dart-lang/sdk analysis-server bug where `dart analyze`
      # crashes on shutdown with "No state location, so plugin could not be copied"
      # (https://github.com/dart-lang/sdk/issues/62420), failing every snippet check
      # even though the snippet itself is valid. Fixed upstream in commit 3ece23ddc,
      # first in a stable release with 3.12.0. 3.12.2 then became too old for the dart
      # session's own `before = ["dart pub get"]`: packages/dart/pubspec.yaml takes
      # `freezed: ^4.0.1`, and freezed 4.x now requires SDK >=3.13.0, so resolution died
      # with "Because crawlberg depends on freezed >=4.0.0 which requires SDK version
      # >=3.13.0 <4.0.0, version solving failed" — 264 of the job's 528 session-prep
      # Errors. 3.13.7 keeps the analysis-server fix and clears freezed's floor. ~keep
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.7"

      # ~keep ubuntu-latest preinstalls JDK 17, which is too old twice over for the java
      # session `alef.toml` runs (`mvn -q -DskipTests compile dependency:copy-dependencies`
      # in packages/java). maven-checkstyle-plugin is bound to the `validate` phase, which
      # Maven runs before `compile`, and checkstyle 14.1.0 is compiled for JDK 21 — it
      # aborted with "UnsupportedClassVersionError: ... class file version 65.0 ... only
      # recognizes class file versions up to 61.0" before compile was ever reached, the
      # other 264 of the job's 528 session-prep Errors. packages/java/pom.xml then compiles
      # with `<release>25</release>`, which javac only accepts on JDK 25+, so clearing
      # checkstyle at 21 would only move the failure one phase later. Pin 25 to satisfy
      # both. The sibling `validate` job above passes `setup-java: true` for the checkstyle
      # half; this job installs no JDK of its own, which is how the gap survived the split.
      # ~keep mise.toml pins Java 25 and Zig; Node and pnpm serve the TypeScript step below.
      - name: Install Java, Zig, Node and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: java zig node pnpm

      # ~keep alef's TypeScript validator shells out to `tsc` found on PATH
      # (`which::which("tsc")`) and reports every node snippet Unavailable when it is absent,
      # which is half of why 1287 of 3908 snippets were never really validated. These steps
      # pnpm-install the workspace -- giving both typescript and the
      # `node_modules/@xberg-io/crawlberg` workspace link the snippets import -- and append
      # `pnpm bin` to $GITHUB_PATH, which is what puts tsc where alef looks for it.
      # ~keep frozen-lockfile must be false: crates/crawlberg-node/package.json pins its napi
      # platform packages in optionalDependencies at the unpublished release version, which
      # can never be recorded in pnpm-lock.yaml, so a frozen install fails outright with
      # ERR_PNPM_OUTDATED_LOCKFILE. build-node-napi passes --no-frozen-lockfile for exactly
      # this reason.
      - name: Install pnpm workspace dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"

      # ~keep No `--strict`. `--strict` fails the run on every Skip, Unavailable AND Downgraded
      # (alef `cli::commands::snippets::has_incomplete_coverage`), and six languages are still
      # annotated `snippet:syntax-only` pending a session — exactly the state `alef.toml`'s
      # `[workspace.docs.snippets]` comment says to keep `strict` off for. Passing it on the
      # command line force-enabled what the config deliberately disables, so the job could never
      # go green. Turn it on when the last session lands, per that comment — not before.
      - name: Check snippets
        run: alef snippets check --cache off
