name: CI E2E

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/**"
      - "e2e/**"
      - "fixtures/**"
      - "alef.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise-tasks/**"
      - "scripts/e2e/**"
      - "scripts/ci/**"
      - "scripts/ci/prepare-chrome-runtime.sh"
      - "scripts/ci/test_chrome_runtime.py"
      - ".github/workflows/ci-e2e.yaml"
      - "mise.toml"
      - "mise.lock"
  # ~keep TEMPORARY: pull_request CI is disabled repo-wide while the org's Actions runners are
  # ~keep saturated by the open PR backlog; CI runs on pushes to main only. Restore this block
  # ~keep before merging any PR that needs its own CI.
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "crates/**"
  #     - "packages/**"
  #     - "e2e/**"
  #     - "fixtures/**"
  #     - "alef.toml"
  #     - "Cargo.toml"
  #     - "Cargo.lock"
  #     - "mise.toml"
  #     - "mise-tasks/**"
  #     - "scripts/ci/**"
  #     - "scripts/ci/prepare-chrome-runtime.sh"
  #     - "scripts/ci/test_chrome_runtime.py"
  #     - ".github/workflows/ci-e2e.yaml"
  workflow_dispatch:

concurrency:
  # ~keep A push to main must never cancel a run already in flight: keying the group only on
  # github.ref meant every new push to main cancelled the previous run's E2E job before it could
  # finish, and 13 consecutive commits landed on main with zero completed E2E runs as a result.
  # Folding the run id into the group on main gives every main push its own group (nothing to
  # cancel), while PR branches keep sharing a group so a stale run there still gets cancelled.
  group: ci-e2e-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  RUST_MIN_STACK: 16777216
  BUILD_PROFILE: "ci"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build-ffi:
    name: Build FFI (${{ matrix.target }})
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          use-sccache: "false"
          cache-key-prefix: build-ffi-${{ matrix.target }}
          target: ${{ matrix.target }}

      - name: Build FFI library
        uses: xberg-io/actions/build-rust-ffi@v1
        with:
          crate-name: crawlberg-ffi

      - name: Build CLI
        uses: xberg-io/actions/build-rust-cli@v1
        with:
          package-name: crawlberg-cli
          binary-name: crawlberg
          extra-cargo-args: --features "api,mcp,warc,ai"

      - name: Build mock-server (linux-arm64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        working-directory: e2e/rust
        run: cargo build --release --bin mock-server

      - name: Upload FFI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffi-${{ matrix.target }}
          path: |
            target/release/libcrawlberg_ffi.*
            target/release/crawlberg_ffi.*
            crates/crawlberg-ffi/include/crawlberg.h
            crates/crawlberg-ffi/crawlberg-ffi.pc
            crates/crawlberg-ffi/cmake/
            target/release/crawlberg
            target/release/crawlberg.exe
            e2e/rust/target/release/mock-server
          retention-days: 7
          if-no-files-found: error

  e2e-tests:
    name: E2E (${{ matrix.lang }})
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    needs: [build-ffi]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            mise-tools: python uv
            test-cmd: "mise run python:e2e:test"
          - lang: node
            mise-tools: node pnpm
            test-cmd: "mise run node:e2e:test"
          - lang: go
            mise-tools: go
            test-cmd: "mise run go:e2e:test"
          - lang: ruby
            mise-tools: ruby
            test-cmd: "mise run ruby:e2e:test"
          - lang: java
            mise-tools: java
            test-cmd: "mise run java:e2e:test"
          - lang: csharp
            dotnet-version: "10.0.x"
            test-cmd: "mise run csharp:e2e:test"
          - lang: php
            php-version: "8.4"
            php-extensions: "dom, json, libxml, mbstring, tokenizer, xml, xmlwriter, ctype"
            test-cmd: "mise run php:e2e:test"
          - lang: elixir
            elixir-version: "1.17"
            otp-version: "27"
            test-cmd: "mise run elixir:e2e:test"
          - lang: wasm
            mise-tools: node pnpm
            test-cmd: "mise run wasm:e2e:test"
          - lang: rust
            test-cmd: "mise run rust:e2e:test"
          - lang: c
            test-cmd: "mise run c:e2e:test"
          - lang: dart
            # ~keep Alef invokes `dart format` during e2e generation, so this exact SDK
            # ~keep pins the formatter used by the generated-output freshness check too.
            # ~keep Regenerate and commit e2e/dart with this SDK whenever the pin changes.
            dart-version: "3.13.7"
            test-cmd: "mise run dart:e2e:test"
          - lang: swift
            swift-version: "6.0"
            test-cmd: "mise run swift:e2e:test"
          - lang: zig
            mise-tools: zig
            test-cmd: "mise run zig:e2e:test"
          - lang: kotlin_android
            gradle: true
            test-cmd: "mise run kotlin-android:e2e:test"
          - lang: brew
            mise-tools: bats
            test-cmd: "mise run brew:e2e:test"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: e2e-${{ matrix.lang }}
          use-sccache: "false"

      - name: Download FFI artifacts
        uses: actions/download-artifact@v8
        with:
          name: ffi-aarch64-unknown-linux-gnu
          path: ffi-artifacts

      - name: Stage FFI artifacts
        shell: bash
        run: |
          mkdir -p target/release e2e/rust/target/release
          mkdir -p e2e/c/ffi/include e2e/c/ffi/lib
          mkdir -p crates/crawlberg-ffi/include packages/go/include
          # actions/upload-artifact@v7 preserves directory structure for multi-path
          # uploads, so files land under ffi-artifacts/target/release/ etc.
          # Fall back to flat layout for safety.
          for src in ffi-artifacts/target/release/libcrawlberg_ffi.* ffi-artifacts/libcrawlberg_ffi.*; do
            [ -e "$src" ] && cp "$src" target/release/ || true
            [ -e "$src" ] && cp "$src" e2e/c/ffi/lib/ || true
          done
          for src in ffi-artifacts/target/release/crawlberg_ffi.* ffi-artifacts/crawlberg_ffi.*; do
            [ -e "$src" ] && cp "$src" target/release/ || true
            [ -e "$src" ] && cp "$src" e2e/c/ffi/lib/ || true
          done
          for src in ffi-artifacts/crates/crawlberg-ffi/include/crawlberg.h ffi-artifacts/crawlberg.h; do
            [ -e "$src" ] && cp "$src" crates/crawlberg-ffi/include/ || true
            [ -e "$src" ] && cp "$src" e2e/c/ffi/include/ || true
            # Every cgo file in packages/go now resolves the header through
            # `-I${SRCDIR}/include`, so one staged copy serves all of them.
            # This used to stage a second copy to packages/go/internal/ffi/
            # because ffi.go included it from there; that vendored header had
            # frozen at v1.0.9 while this one tracked regens, and cgo unions
            # CFLAGS across a package, so the ambiguous basename could resolve
            # to the stale copy. ffi.go now points at include/ and the vendored
            # copy is gone.
            [ -e "$src" ] && cp "$src" packages/go/include/ || true
          done
          # The Makefile's `$(FFI_DIR)/include/crawlberg.h: download_ffi.sh` rule
          # re-downloads if the header is older than the script. Touch the staged
          # header so make treats it as up-to-date and skips the (404-prone) download.
          [ -e e2e/c/ffi/include/crawlberg.h ] && touch e2e/c/ffi/include/crawlberg.h || true
          # e2e/c/Makefile's `all: download_ffi` rule is .PHONY, so
          # `bash download_ffi.sh` runs unconditionally even after the header is
          # staged. The script itself has an internal skip: when
          # `e2e/c/ffi/.alef-ffi-version` contains the expected
          # `${FFI_PKG_NAME}-v${VERSION}-${TRIPLE}` string, it exits 0 immediately
          # without touching the network. Write that marker now so the script
          # short-circuits before hitting the v0.3.0-rc.<n> release URL — the
          # publish workflow is dispatched manually after tag push, so the
          # release asset is 404 until publish finishes.
          if [ -e e2e/c/ffi/include/crawlberg.h ]; then
            VERSION=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
            echo "crawlberg-ffi-v${VERSION}-aarch64-unknown-linux-gnu" > e2e/c/ffi/.alef-ffi-version
          fi
          for src in ffi-artifacts/target/release/crawlberg ffi-artifacts/crawlberg; do
            [ -e "$src" ] && cp "$src" target/release/ || true
          done
          for src in ffi-artifacts/e2e/rust/target/release/mock-server ffi-artifacts/mock-server; do
            [ -e "$src" ] && cp "$src" e2e/rust/target/release/ || true
          done
          chmod +x target/release/libcrawlberg_ffi.so 2>/dev/null || true
          chmod +x target/release/crawlberg 2>/dev/null || true
          chmod +x e2e/rust/target/release/mock-server 2>/dev/null || true

      # Each leg installs its language toolchain (matrix.mise-tools) from mise.lock; legs without
      # one set up mise alone. ~keep
      - name: Install the leg's toolchain
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: ${{ matrix.mise-tools && 'true' || 'false' }}
          install-args: ${{ matrix.mise-tools }}

      - name: Resolve the mise Python version
        if: matrix.lang == 'python'
        id: mise-python
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Cache uv downloads
        if: matrix.lang == 'python'
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: e2e-uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-${{ hashFiles('uv.lock') }}
          restore-keys: e2e-uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-
      - name: Install Python dependencies
        if: matrix.lang == 'python'
        run: uv sync --all-extras --all-packages --group dev --no-install-project --no-install-workspace
      - name: Add the virtualenv to PATH
        if: matrix.lang == 'python'
        shell: bash
        run: if [ -d .venv/bin ]; then echo "$PWD/.venv/bin" >> "$GITHUB_PATH"; fi

      - name: Install pnpm workspace dependencies
        if: matrix.lang == 'node' || matrix.lang == 'wasm'
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        if: matrix.lang == 'node' || matrix.lang == 'wasm'
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"

      - name: Cache Go modules and build cache
        if: matrix.lang == 'go'
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: e2e-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work.sum') }}
          restore-keys: e2e-go-${{ runner.os }}-${{ runner.arch }}-

      - name: Bundle install
        if: matrix.lang == 'ruby'
        working-directory: e2e/ruby
        run: |
          bundle config set frozen true
          bundle install --jobs 4

      - name: Setup .NET
        if: matrix.dotnet-version
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Setup PHP
        if: matrix.php-version
        uses: xberg-io/actions/setup-php@v1
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          extensions: ${{ matrix.php-extensions || '' }}

      - name: Setup Elixir
        if: matrix.elixir-version
        uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}

      - name: Setup Dart
        if: matrix.dart-version
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart-version }}

      - name: Setup Swift
        if: matrix.swift-version
        uses: xberg-io/actions/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}

      # The Swift package links the crawlberg FFI staticlib, which pulls in liblzma
      # (-llzma, via the compression stack) and libbz2 (-lbz2, via zip → bzip2 →
      # libbz2-rs-sys). The ubuntu-24.04-arm runner ships the runtime libs but not
      # the -dev packages that provide the `liblzma.so`/`libbz2.so` link symlinks,
      # so the SwiftPM link step fails with `cannot find -llzma`/`cannot find -lbz2`.
      # Runtime-linked FFI langs (go/java/csharp/…) don't need them; the Swift link
      # step does.
      - name: Install liblzma-dev and libbz2-dev for Swift FFI linking
        if: matrix.lang == 'swift'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev libbz2-dev

      - name: Setup wasm-pack
        if: matrix.lang == 'wasm'
        uses: xberg-io/actions/setup-wasm-pack@v1

      - name: Setup Gradle
        if: matrix.gradle
        uses: xberg-io/actions/setup-gradle@v1
        with:
          gradle-version: "9.8.2"

      # gradle: true is exclusive to kotlin_android. No org action wraps
      # SDK-only setup (setup-android-emulator bundles a full AVD, which
      # testDebugUnitTest doesn't need), so use the upstream action directly.
      #
      # This runner (ubuntu-24.04-arm) is linux-aarch64, and Google ships no
      # linux-aarch64 build-tools (aapt2 is an x86_64 ELF there). We only
      # request the compileSdk platform jar (arch-independent) and
      # deliberately omit build-tools: `gradle testDebugUnitTest --dry-run`
      # against e2e/kotlin_android (a library module with no src/main/res or
      # AndroidManifest.xml) resolves to generateDebugRFile /
      # parseDebugLocalResources, not compileDebugLibraryResources /
      # processDebugResources — so aapt2 is never invoked for this target.
      - name: Setup Android SDK
        if: matrix.gradle
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35"

      - name: Lint generated Brew fixtures
        if: matrix.lang == 'brew'
        run: mise run brew:e2e:lint

      - name: Test Chromium runtime preparation
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: mise run ci:chrome:runtime:test

      - name: Prepare Chromium snap runtime
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: mise run ci:chrome:runtime

      - name: Setup Chrome
        uses: xberg-io/actions/setup-chrome@v1

      - name: Setup library paths for FFI bindings
        if: |
          matrix.lang == 'go' || matrix.lang == 'java' ||
          matrix.lang == 'csharp' || matrix.lang == 'elixir' ||
          matrix.lang == 'c' || matrix.lang == 'swift' ||
          matrix.lang == 'zig' || matrix.lang == 'dart'
        shell: bash
        run: |
          export PKG_CONFIG_PATH="${PWD}/crates/crawlberg-ffi:${PKG_CONFIG_PATH}"
          # Both target/release (release-built FFI/swift/zig/etc.) and
          # target/debug (dart:build:dev / debug-built bindings) need to be
          # on the load path; the runner doesn't know which mode each lang built.
          export LD_LIBRARY_PATH="${PWD}/target/release:${PWD}/target/debug:${LD_LIBRARY_PATH}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # ~keep This drift check is only sound when the formatting alef applies here is
      # byte-identical to the formatting already in the committed tree. `alef e2e generate`
      # formats in-process as part of generation and it CANNOT be turned off (the --format flag
      # was removed upstream), so formatter skew between this runner and the machine that
      # committed the tree surfaces as drift that has nothing to do with fixture staleness.
      #
      # This check used to exclude python, php, ruby and c — a quarter of the 16-leg matrix
      # silently ungated. Each exclusion was measured against alef 0.96.4 rather than assumed,
      # by shimming each formatter binary and counting its invocations, and all four are now
      # gone:
      #
      #   python — `ruff` IS invoked (`ruff check --fix` then `ruff format`, 2 logged calls) and
      #   IS version-sensitive, and it was genuinely absent here: with ruff unavailable,
      #   generation drifts 30 files (+629/-838) and alef only WARNs. Fixed by pinning the ruff
      #   binary below; ruff 0.16.7 is a verified fixed point of the committed tree (drift 0).
      #
      #   php — already reproducible and never needed excluding. alef.toml's php formatter is
      #   `composer install && composer exec -- php-cs-fixer`, version-pinned by composer.lock
      #   and self-bootstrapping, and `Setup PHP` above installs composer before this step.
      #   Verified: drift 0 from a clean checkout with no vendor/ directory.
      #
      #   ruby — the "bundle exec rubocop" premise was stale. alef.toml's ruby formatter is
      #   `poly fmt`, and poly's own discovery config excludes `e2e/**`, so it reports "0 files
      #   checked" and changes nothing. Verified drift 0 both with poly 0.28.0 present and with
      #   poly failing as not-installed.
      #
      #   c — alef 0.96.4 does not invoke clang-format for c e2e output at all: 0 shim
      #   invocations even on a run that wrote a file, and the committed files are not a
      #   clang-format fixed point under this repo's .clang-format. There is no skew to exclude.
      #
      # dart hits a real "formatter present but not equivalent" skew and is handled by pinning
      # its SDK version in the matrix above, the same pattern as the ruff pin. See the ~keep
      # note on the dart matrix entry.
      #
      # ~keep Pinned, not "latest": the point is that this runner formats exactly as the tree
      # was formatted. The version assertion is deliberate — alef downgrades a missing formatter
      # to a WARN and generates UNFORMATTED output, and because it skips writing a file whose
      # pre-format content already matches disk, one unformatted generation then persists through
      # every later formatted run. A silent PATH miss here would reintroduce exactly the failure
      # this pin removes.
      - name: Install pinned ruff (python formatter parity)
        if: matrix.lang == 'python'
        shell: bash
        env:
          RUFF_VERSION: 0.16.7
        run: |
          set -euo pipefail
          target="aarch64-unknown-linux-gnu"
          base="https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL "${base}/ruff-${target}.tar.gz" -o "${tmp}/ruff.tar.gz"
          curl -fsSL "${base}/ruff-${target}.tar.gz.sha256" -o "${tmp}/ruff.tar.gz.sha256"
          expected="$(awk '{print $1}' "${tmp}/ruff.tar.gz.sha256")"
          actual="$(sha256sum "${tmp}/ruff.tar.gz" | awk '{print $1}')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::ruff ${RUFF_VERSION} checksum mismatch: expected ${expected}, got ${actual}"
            exit 1
          fi
          tar -xzf "${tmp}/ruff.tar.gz" -C "${tmp}"
          binary="$(find "${tmp}" -type f -name ruff -perm -u+x | head -1)"
          if [ -z "$binary" ]; then
            echo "::error::ruff binary not found in the ${RUFF_VERSION} archive"
            exit 1
          fi
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "$binary" "${HOME}/.local/bin/ruff"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          rm -rf "${tmp}"

      - name: Assert ruff on PATH is the pinned version
        if: matrix.lang == 'python'
        shell: bash
        env:
          RUFF_VERSION: 0.16.7
        run: |
          set -euo pipefail
          found="$(ruff --version)"
          echo "expected: ruff ${RUFF_VERSION}"
          echo "found:    ${found}"
          if [ "$found" != "ruff ${RUFF_VERSION}" ]; then
            echo "::error::ruff on PATH is '${found}', not the pinned 'ruff ${RUFF_VERSION}' — generated python would drift"
            exit 1
          fi

      - name: Install alef (pinned)
        uses: xberg-io/actions/install-alef@v1

      # ~keep Dart format reads the pubspec language version from package_config.json;
      # the SDK default on a fresh checkout produces different generated bytes.
      - name: Resolve Dart E2E package language version
        if: matrix.dart-version
        run: mise run dart:e2e:install

      - name: Check e2e/${{ matrix.lang }} freshness against fixtures/
        shell: bash
        run: |
          set -euo pipefail
          # alef's e2e output dir does not always equal the lang name: swift
          # is disambiguated to e2e/swift_e2e because packages/swift already
          # exists. Every other lang's dir matches matrix.lang exactly.
          case "${{ matrix.lang }}" in
            swift) e2e_dir="e2e/swift_e2e" ;;
            *) e2e_dir="e2e/${{ matrix.lang }}" ;;
          esac
          # ~keep A drift check over an empty or mistyped directory reports clean and is
          # indistinguishable from a real pass, so state the population first and fail on zero.
          tracked_before="$(git ls-files -- "$e2e_dir" | wc -l | tr -d ' ')"
          echo "tracked files under ${e2e_dir}: ${tracked_before}"
          if [ "$tracked_before" -eq 0 ]; then
            echo "::error::${e2e_dir} contains no tracked files — this check would examine nothing" >&2
            exit 1
          fi
          alef e2e generate --lang "${{ matrix.lang }}"
          # git diff alone only reports tracked files, so a fixture that adds a
          # brand-new test file would regenerate as an UNTRACKED file and slip
          # through. --porcelain -uall reports added, modified and deleted alike.
          drift="$(git status --porcelain -uall -- "$e2e_dir")"
          if [ -n "$drift" ]; then
            echo "$drift" >&2
            git diff -- "$e2e_dir" >&2 || true
            echo "::error::${e2e_dir} is out of date with fixtures/. Run 'alef e2e generate --lang ${{ matrix.lang }}' locally (or 'mise run e2e:generate' to regenerate every language) and commit the result." >&2
            exit 1
          fi

      - name: Compile Ruby native extension
        if: matrix.lang == 'ruby'
        working-directory: packages/ruby
        run: bundle install && bundle exec rake compile

      - name: Build language binding
        if: |
          matrix.lang == 'node' || matrix.lang == 'java' ||
          matrix.lang == 'wasm' || matrix.lang == 'php' ||
          matrix.lang == 'csharp' || matrix.lang == 'dart' ||
          matrix.lang == 'swift'
        shell: bash
        run: mise run ${{ matrix.lang }}:build:dev

      - name: Run Java package tests
        if: matrix.lang == 'java'
        run: mise run java:test:ci

      - name: Check released Node runtime exports
        if: matrix.lang == 'node'
        run: mise run node:test:released-exports

      - name: Stage FFI for zig (target/debug shim)
        if: matrix.lang == 'zig'
        shell: bash
        run: |
          mkdir -p target/debug
          for f in target/release/libcrawlberg_ffi.*; do
            [ -e "$f" ] && ln -sf "$(pwd)/$f" "target/debug/$(basename "$f")"
          done

      - name: Check released constructor calls
        # ~keep These hand-written release calls import the actual binding, outside the generated E2E surface.
