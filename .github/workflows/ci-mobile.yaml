name: CI Mobile

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/dart/**"
      - "packages/swift/**"
      - "packages/kotlin-android/**"
      - ".github/workflows/ci-mobile.yaml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/dart/**"
      - "packages/swift/**"
      - "packages/kotlin-android/**"
      - ".github/workflows/ci-mobile.yaml"
  workflow_dispatch:

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  android-check:
    name: Android cargo check (${{ matrix.abi }})
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-rust@8dd8c168edb57e4606b4840b1143855149390261 # v1.8.141
        with:
          cache-key-prefix: ci-mobile-android-${{ matrix.abi }}
      - uses: xberg-io/actions/setup-android-ndk@8dd8c168edb57e4606b4840b1143855149390261 # v1.8.141
      - name: cargo ndk check crawlberg-dart
        run: cargo ndk --target ${{ matrix.abi }} --platform 21 -- check -p crawlberg-dart
      - name: cargo ndk check crawlberg-ffi
        run: cargo ndk --target ${{ matrix.abi }} --platform 21 -- check -p crawlberg-ffi

  kotlin-android-check:
    name: kotlin-android AAR check (${{ matrix.abi }})
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-rust@8dd8c168edb57e4606b4840b1143855149390261 # v1.8.141
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: ci-mobile-kotlin-android-${{ matrix.abi }}
      - uses: xberg-io/actions/setup-android-ndk@8dd8c168edb57e4606b4840b1143855149390261 # v1.8.141
      - uses: xberg-io/actions/build-android-natives@8dd8c168edb57e4606b4840b1143855149390261 # v1.8.141
        with:
          crate-name: crawlberg-ffi
          lib-name: crawlberg_ffi
          abi: ${{ matrix.abi }}
          target: ${{ matrix.target }}
      - name: Stage native into AAR jniLibs
        run: |
          mkdir -p "packages/kotlin-android/src/main/jniLibs/${{ matrix.abi }}"
          cp -v "dist/android-natives/${{ matrix.abi }}/libcrawlberg_ffi.so" \
                "packages/kotlin-android/src/main/jniLibs/${{ matrix.abi }}/"
        shell: bash
      - uses: xberg-io/actions/setup-gradle@8dd8c168edb57e4606b4840b1143855149390261 # v1.8.141
      - name: Assemble AAR
        working-directory: packages/kotlin-android
        run: gradle assembleDebug --no-daemon
      # JVM unit tests build their own host-platform JNI library on the fly
      # (buildHostJni/copyHostJni Gradle tasks) via `cargo build --manifest-path
      # ../../crates/crawlberg-jni/Cargo.toml`, so no extra staging is needed here.
      - name: Run JVM unit tests
        working-directory: packages/kotlin-android
        run: gradle test --no-daemon

  ios-check:
    name: iOS cargo check (${{ matrix.target }})
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-rust@8dd8c168edb57e4606b4840b1143855149390261 # v1.8.141
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: ci-mobile-ios-${{ matrix.target }}
      - name: cargo check crawlberg-dart
        run: cargo check -p crawlberg-dart --target ${{ matrix.target }}
      - name: cargo check crawlberg-swift
        run: cargo check -p crawlberg-swift --target ${{ matrix.target }}
