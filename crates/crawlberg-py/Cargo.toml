[package]
name = "crawlberg-py"
version = "1.3.2"
edition = "2024"
license = "MIT"
description = "High-performance web crawling engine"
readme = false
keywords = ["crawl", "scrape", "spider", "web"]
categories = []

# `pyo3-async-runtimes` and `serde_json` are emitted unconditionally above so
# the manifest is stable across regens, but for umbrella crates with no
# async fns or no JSON-marshalled return types they are genuinely unused.
# The conditional `async-trait` / `tokio` / `futures` deps are similarly
# flagged when the umbrella has trait-bridge / streaming adapters configured
# but no actual async-trait / async callsite in the generated PyO3 shim.
[package.metadata.cargo-machete]
ignored = ["pyo3-async-runtimes", "serde_json", "tokio", "futures"]

[lib]
name = "_crawlberg"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module", "pyo3/abi3-py310"]

[dependencies]
crawlberg = { version = "1.3.2", path = "../crawlberg", features = ["interact", "browser-chromiumoxide"] }
futures = "0.3"
pyo3 = { version = "0.29" }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[lints.clippy]
# src/lib.rs is alef-generated. The pyo3 `__new__` template emits
# `match s { "x" => return Ok(..), _ => {} }` per enum variant, which collapses into a
# single_match when the enum has exactly ONE variant (DocumentContentEncoding). alef's dart
# and swift templates already ship these in their generated `#![allow(..)]` headers; the
# pyo3 template does not. Fixed in 0.60.1, but we are pinned to 0.60.0 because 0.60.1
# emits a crawlberg-jni/src/lib.rs that does not parse (see alef.toml). NOTE: alef rewrites
# this file as a scaffold, so every regen drops this block — re-add it until the pin moves
# forward to a release that carries the pyo3 fix. ~keep
collapsible_match = "allow"
single_match = "allow"
