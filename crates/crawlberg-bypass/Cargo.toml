[package]
name = "crawlberg-bypass"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Configurable HTTP-based BypassProvider implementations for crawlberg, driven by per-vendor YAML configs."

[dependencies]
async-trait = { workspace = true }
crawlberg = { path = "../crawlberg", version = "1.3.1" }
reqwest = { workspace = true }
saphyr = "0.0.11"
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
urlencoding = "2"

# crawlberg-bypass is native-only (its BypassProvider implementations build a real
# `reqwest::Client`; its `crawlberg` dependency also pulls native-runtime), but the
# workspace-level `reqwest` dependency defaults to `default-features = false` (see root
# Cargo.toml) so that wasm32 consumers of the shared `reqwest` package edge never pull mio via
# tokio/net. Restore the native TLS/HTTP2/proxy features here so this crate keeps building
# standalone (e.g. `cargo publish -p crawlberg-bypass`), not only when feature-unified with
# crates/crawlberg.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["default-tls", "http2", "charset", "system-proxy"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
