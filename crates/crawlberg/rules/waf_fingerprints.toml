# ~keep A fingerprint fires only when all signals match; any match returns that fingerprint's vendor.
# ~keep `response_header` checks lowercase header names; `body_substring` patterns use Aho-Corasick.


[[fingerprint]]
id = "cloudflare_challenge_v1"
vendor = "cloudflare"
weight = 1.0
[[fingerprint.signals]]
kind = "response_header"
name = "server"
value_contains = "cloudflare"
[[fingerprint.signals]]
kind = "body_substring"
pattern = "/cdn-cgi/challenge-platform/"

[[fingerprint]]
id = "cloudflare_cf_chl"
vendor = "cloudflare"
weight = 1.0
[[fingerprint.signals]]
kind = "body_substring"
pattern = "cf-chl-"

[[fingerprint]]
id = "cloudflare_dunder_chl"
vendor = "cloudflare"
weight = 1.0
[[fingerprint.signals]]
kind = "body_substring"
pattern = "__cf_chl_"

[[fingerprint]]
id = "cloudflare_chl_opt"
vendor = "cloudflare"
weight = 1.0
[[fingerprint.signals]]
kind = "body_substring"
pattern = "_cf_chl_opt"

