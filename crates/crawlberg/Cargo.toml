[package]
name = "crawlberg"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "High-performance web crawling engine"

[package.metadata.cargo-machete]
ignored = ["getrandom", "getrandom03", "memchr"]

[features]
default = ["native-runtime"]
# ~keep `native-runtime` must not activate Tokio OS features because Cargo features are not target-conditional.
# ~keep Those Tokio features live under the non-wasm target dependencies so wasm32 builds never request `mio`.
native-runtime = []
browser = ["browser-chromiumoxide"]
browser-chromiumoxide = ["dep:chromiumoxide", "dep:dirs", "native-runtime"]
browser-native = ["dep:crawlberg-browser", "native-runtime"]
ai = ["dep:liter-llm", "dep:minijinja"]
# ~keep Emit-only: the library never installs a subscriber/exporter (that is the
# ~keep CLI's / service's job). `otel` only forwards `liter-llm/otel` so the `ai`
# ~keep integration's GenAI metrics compile in; crawlberg's own OTel spans, semconv
# ~keep attributes, and metric instruments are always-on and reach whatever exporter
# ~keep the consumer installs.
otel = ["liter-llm?/otel"]
interact = ["browser"]
mcp = ["dep:rmcp", "dep:schemars"]
api = [
    "dep:axum",
    "dep:tower-http",
    "dep:utoipa",
    "dep:uuid",
    "native-runtime",
]
mcp-http = ["mcp", "api"]
warc = ["dep:uuid"]
full = [
    "browser",
    "browser-native",
    "ai",
    "otel",
    "interact",
    "mcp",
    "api",
    "mcp-http",
    "warc",
]

[dependencies]
ahash = { workspace = true }
aho-corasick = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chromiumoxide = { workspace = true, optional = true }
chrono = { workspace = true }
crawlberg-browser = { workspace = true, optional = true }
dashmap = { workspace = true }
dirs = { workspace = true, optional = true }
encoding_rs = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
html-to-markdown-rs = { workspace = true }
ipnet = { workspace = true }
liter-llm = { workspace = true, optional = true }
memchr = { workspace = true }
minijinja = { workspace = true, optional = true }
notify = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
quick-xml = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tl = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-stream = { workspace = true }
toml = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# ~keep Tokio OS features stay target-scoped here because Cargo feature activations are global.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# ~keep reqwest's native TLS/HTTP2/proxy features (its `default` set) pull tokio/net -> mio,
# which fails to compile on wasm32; restore them for native builds only.
reqwest = { workspace = true, features = ["default-tls", "http2", "charset", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "signal", "process", "io-util"] }

# ~keep wasm32 needs JS getrandom backends for both the direct v0.4 API and transitive v0.3 API.
# ~keep The `getrandom03` alias forces `wasm_js` into the v0.3 line pulled transitively by `ahash`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# ~keep std::time::Instant::now() traps at runtime on wasm32-unknown-unknown (no clock
# ~keep source in its `unsupported` backend); web-time backs Instant with performance.now().
web-time = "1"

[dev-dependencies]
async-trait = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
serial_test = "3"
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
wiremock = "0.6"

[[bench]]
name = "citations"
harness = false

[[bench]]
name = "waf"
harness = false

[[test]]
name = "test_pool_reuse"
path = "tests/test_pool_reuse.rs"
required-features = ["browser"]

[lints]
workspace = true
