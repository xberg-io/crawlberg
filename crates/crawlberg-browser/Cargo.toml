[package]
name = "crawlberg-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal headless-browser fallback used by the crawlberg crawler. Not intended for direct use."

[features]
default = []
stealth = ["wreq", "wreq-util"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
cssparser = { workspace = true }
deno_core = { workspace = true }
deno_error = { workspace = true }
futures = { workspace = true }
html5ever = { workspace = true }
ipnet = { workspace = true }
png = { workspace = true }
precomputed-hash = { workspace = true }
reqwest = { workspace = true }
selectors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
wreq-util = { version = "3.0.0-rc.14", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wreq = { version = "6.0.0-rc.31", optional = true, features = ["prefix-symbols"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
wreq = { version = "6.0.0-rc.31", optional = true }

# crawlberg-browser is native-only (deno_core is not wasm32-compatible), but the workspace-level
# `reqwest` dependency defaults to `default-features = false` (see root Cargo.toml) so that
# wasm32 consumers of the shared `reqwest` package edge never pull mio via tokio/net. Restore the
# native TLS/HTTP2/proxy features here so this crate keeps building standalone (e.g. `cargo
# publish -p crawlberg-browser`), not only when feature-unified with crates/crawlberg.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["default-tls", "http2", "charset", "system-proxy"] }

[build-dependencies]
deno_core = { workspace = true }

[lints]
workspace = true
