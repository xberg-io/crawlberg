[package]
name = "crawlberg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line web crawler and scraper"

# ~keep cargo-binstall support: release assets use a `crawlberg-cli-` prefix that
# ~keep doesn't match binstall's default naming, so pin the URL and bin-dir explicitly.
# ~keep See https://github.com/cargo-bins/cargo-binstall/blob/main/SUPPORT.md
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/crawlberg-cli-{ target }{ archive-suffix }"
bin-dir = "crawlberg-cli-{ target }/{ bin }{ binary-ext }"

[[bin]]
name = "crawlberg"
path = "src/main.rs"

[features]
default = []
all = ["api", "mcp", "mcp-http", "warc", "ai", "otel"]
api = ["crawlberg/api"]
mcp = ["crawlberg/mcp"]
mcp-http = ["mcp", "api", "crawlberg/mcp-http"]
warc = ["crawlberg/warc"]
ai = ["crawlberg/ai"]
# ~keep The CLI owns subscriber install (libraries emit only). `otel` adds the OTLP
# ~keep export path (activated at runtime by `OTEL_EXPORTER_OTLP_ENDPOINT`) and
# ~keep forwards `crawlberg/otel` so the `ai` integration's liter-llm metrics turn on.
otel = [
    "crawlberg/otel",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:thiserror",
]

[dependencies]
clap = { workspace = true }
crawlberg = { path = "../crawlberg", version = "1.5.0", features = ["native-runtime", "browser"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
