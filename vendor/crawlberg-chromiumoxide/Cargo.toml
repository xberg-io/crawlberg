[package]
edition = "2024"
rust-version = "1.85"
name = "crawlberg-chromiumoxide"
version = "0.9.2"
authors = ["Matthias Seitz <matthias.seitz@outlook.de>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Crawlberg's security-hardened Chromium CDP client, forked from chromiumoxide"
homepage = "https://github.com/xberg-io/crawlberg"
readme = "README.md"
keywords = ["chrome", "chromedriver", "puppeteer", "automation"]
categories = ["web-programming", "api-bindings", "development-tools::testing"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/xberg-io/crawlberg"

[lib]
name = "chromiumoxide"
path = "src/lib.rs"

[features]
bytes = ["dep:bytes"]
default = ["bytes"]
fetcher = ["chromiumoxide_fetcher"]
native-tls = ["chromiumoxide_fetcher/native-tls"]
rustls = ["chromiumoxide_fetcher/rustls"]
zip0 = ["chromiumoxide_fetcher/zip0"]
zip8 = ["chromiumoxide_fetcher/zip8"]

[target."cfg(windows)".dependencies.windows-registry]
version = "0.6"

[dependencies.async-tungstenite]
version = "0.32"
features = ["tokio-runtime"]

[dependencies.base64]
version = "0.22"

[dependencies.bytes]
version = "1"
features = ["serde"]
optional = true

[dependencies.chromiumoxide_cdp]
version = "0.9"

[dependencies.chromiumoxide_fetcher]
version = "0.9"
optional = true
default-features = false

[dependencies.chromiumoxide_types]
version = "0.9"

[dependencies.dunce]
version = "1"

[dependencies.fnv]
version = "1"

[dependencies.futures]
version = "0.3"

[dependencies.futures-timer]
version = "3"

[dependencies.pin-project-lite]
version = "0.2"

[dependencies.reqwest]
version = "0.13"
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = ["rt", "rt-multi-thread", "time", "fs", "macros", "process"]

[dependencies.tracing]
version = "0.1"

[dependencies.url]
version = "2"

[dependencies.which]
version = "8"

[dev-dependencies.chrono]
version = "0.4.1"

[dev-dependencies.proc-macro2]
version = "1"

[dev-dependencies.quote]
version = "1"

[dev-dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "time", "macros"]

[dev-dependencies.tracing-subscriber]
version = "0.3"
