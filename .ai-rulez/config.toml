
version = "5.0"
default_layers = ["plugins"]
name = 'Crawlberg'
description = 'Web crawling and scraping library with active Python, TypeScript/Node, Ruby, PHP, Go, Java/JNI, C#, Elixir, WebAssembly, Dart, Kotlin Android, Swift, Zig, and C FFI bindings'
gitignore = true
# ~keep The manifest is committed so CI can detect stale generated files.
gitignore_exclude = [".ai-rulez/.generated-manifest.json"]
presets = ["claude", "codex", "opencode"]
builtins = [
  "!agent-delegation",
  "!ai-governance/agent-workflow",
  "!git-workflow",
  "!testing/test-alongside-code",
  "!testing/tdd-workflow",
  "!token-efficiency/output-awareness",
  "!ai-governance/explain-reasoning",
  "!security/least-privilege",
  "!security/input-validation",
  "!polyglot-bindings/rust-polyglot-conventions",
  "default-commands",
  "polyglot-bindings",
]

compact = true
[header]
style = 'minimal'

[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-bindings'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/bindings'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-docs-sites'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/docs-sites'
merge_strategy = 'local-override'

[[installed_skills]]
name = 'alef'
source = 'https://github.com/xberg-io/alef.git'
ref = "fc96f3c0ca138d0667144a0ae7e37b5ef04b420c"

[[mcp_servers]]
name = 'playwright'
description = 'Playwright browser automation for E2E testing and docs verification'
command = 'npx'
args = ['-y', '@playwright/mcp@0.0.83']

[defaults]
effort = 'medium'

[mcp]
self_server_command = ["ai-rulez", "mcp"]
# ~keep Skill discovery only: the full server lists 67 tools (~38k tokens of schema) at every session start.
serve_skills = true
read_only = true
discover_skills = "repo"
tools = ["find_skill", "load_skill"]

[lock]
include_outputs = false

[lint]
# Crawlberg supplies its own MCP reference for this harness name. ~keep
allow_overrides = ["python-conventions", "claude:mcp"]

[lint.load_budgets]
# ~keep AR964 also counts the plugin bundle and public skill mirrors, which Codex does not list; measured plus about 5%.
codex-skill-listing = 25650

[[lint.ignore_rules]]
rules = ["AR701"]
paths = [
  ".claude/skills/*/SKILL.md",
  ".codex/skills/*/SKILL.md",
  ".github/skills/*/SKILL.md",
  "plugin/.cursor-plugin/skills/*/SKILL.md",
  "plugin/.hermes/package/src/crawlberg_hermes_plugin/skills/*/SKILL.md",
  "plugin/.hermes/plugins/crawlberg/skills/*/SKILL.md",
  "plugin/.opencode/skills/*/SKILL.md",
  "plugin/.pi/skills/*/SKILL.md",
  "plugin/skills/*/SKILL.md",
  "skills/*/SKILL.md",
]
reason = "Generated harness and public mirrors share authored descriptions; generation and provenance checks verify their bytes."

[rules]
# ~keep Glob-scoped rules stay out of AGENTS.md: rule files for Claude, path-gated skills for Codex.
scoped_fallback = "skill"
# ~keep One fallback skill per directory keeps the Codex skill listing short (AR964).
scoped_fallback_group = "directory"
