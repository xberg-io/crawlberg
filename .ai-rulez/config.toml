
version = "5.0"
default_layers = ["plugins"]
name = 'Crawlberg'
description = 'Web crawling and scraping library with active Python, TypeScript/Node, Ruby, PHP, Go, Java/JNI, C#, Elixir, WebAssembly, Dart, Kotlin Android, Swift, Zig, and C FFI bindings'
gitignore = true
# ~keep The manifest is committed so CI can detect stale generated files.
gitignore_exclude = [".ai-rulez/.generated-manifest.json"]
presets = ["claude", "codex", "opencode"]
builtins = [
  "!agent-delegation",
  "!ai-governance/agent-workflow",
  "!git-workflow",
  "!testing/test-alongside-code",
  "default-commands",
  "polyglot-bindings",
]

compact = true
[header]
style = 'minimal'

[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "6e7f6a6793ea7380b916367e10a8acd13c3afbc3"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "6e7f6a6793ea7380b916367e10a8acd13c3afbc3"
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "6e7f6a6793ea7380b916367e10a8acd13c3afbc3"
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-bindings'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "6e7f6a6793ea7380b916367e10a8acd13c3afbc3"
path = 'modules/bindings'
merge_strategy = 'local-override'

[[installed_skills]]
name = 'alef'
source = 'https://github.com/xberg-io/alef.git'

ref = "3967231cb59852fac08f07aeb5f29dd73bdf00f3"
[[mcp_servers]]
name = 'playwright'
description = 'Playwright browser automation for E2E testing and docs verification'
command = 'npx'
args = ['-y', '@playwright/mcp@0.0.83']

[defaults]
effort = 'medium'

[mcp]
self_server_command = ["ai-rulez", "mcp"]
# ~keep Skill discovery only: the full server lists 67 tools (~38k tokens of schema) at every session start.
serve_skills = true
read_only = true
discover_skills = "repo"
tools = ["find_skill", "load_skill"]

[lock]
include_outputs = false

[lint]
# Crawlberg supplies its own MCP reference for this harness name. ~keep
allow_overrides = ["python-conventions", "claude:mcp"]

[[lint.ignore_rules]]
rules = ["AR701"]
paths = [
  ".claude/skills/api/SKILL.md",
  ".claude/skills/cli/SKILL.md",
