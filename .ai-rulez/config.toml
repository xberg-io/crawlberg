
version = "5.0"
default_layers = ["plugins"]
name = 'Crawlberg'
description = 'Web crawling and scraping library with active Python, TypeScript/Node, Ruby, PHP, Go, Java/JNI, C#, Elixir, WebAssembly, Dart, Kotlin Android, Swift, Zig, and C FFI bindings'
gitignore = true
presets = ["claude", "codex", "opencode", "pi", "hermes", "gemini", "copilot"]
# ~keep CLAUDE.md without the glob-scoped rules: they load from .claude/rules on a matching read.
agents_md = false
builtins = ["!agent-delegation", "!git-workflow", "default-commands"]

compact = true
[header]
style = 'minimal'

[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "33efa876153a61192fab38923f31ed2673702791"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "33efa876153a61192fab38923f31ed2673702791"
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "33efa876153a61192fab38923f31ed2673702791"
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-e2e-generator'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "33efa876153a61192fab38923f31ed2673702791"
path = 'modules/e2e-generator'
merge_strategy = 'local-override'

[[installed_skills]]
name = 'alef'
source = 'https://github.com/xberg-io/alef.git'

ref = "613e2b06975b1d3a0d776ca141dec7b540e9ed74"
[[mcp_servers]]
name = 'playwright'
description = 'Playwright browser automation for E2E testing and docs verification'
command = 'npx'
args = ['-y', '@playwright/mcp@0.0.83']

[defaults]
effort = 'medium'

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[lock]
include_outputs = false

[lint]
# Crawlberg supplies its own MCP reference and review prompt for these harness names. ~keep
allow_overrides = ["python-conventions", "claude:mcp", "claude:review"]

[lint.builtin_names]
# Keep the repository review command instead of OpenCode's built-in command. ~keep
allow = ["opencode:review"]

[[lint.ignore_rules]]
rules = ["AR701"]
paths = [
  ".claude/skills/api/SKILL.md",
  ".claude/skills/cli/SKILL.md",
