<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open Graph and Twitter card addresses</title>
  <base href="https://example.com/dir/">
  <meta property="og:url" content="javascript:alert(1)">
  <meta property="og:image" content="og.png">
  <meta property="og:video" content="file:///etc/passwd">
  <meta property="og:audio" content="blob:https://example.com/a">
  <meta name="twitter:image" content="/img/tw.png">
</head>
<body>
  <p>A page whose Open Graph and Twitter card addresses are relative or not fetchable.</p>
</body>
</html>
