version: "3"

tasks:
  declarations:
    desc: Test the released-call reader and check tagged Python and Swift declarations
    cmds:
      - >-
        uv run --no-project --with-requirements scripts/ci/requirements-released-constructors.txt
        python -m unittest discover -s scripts/ci -p 'test_released_constructors.py'
      - >-
        uv run --no-project --with-requirements scripts/ci/requirements-released-constructors.txt
        python scripts/ci/check_released_constructors.py

  python-build:
    desc: Build and install the current Python extension for released-call tests
    dir: packages/python
    cmds:
      - uv sync --locked --all-extras --no-install-project --no-install-workspace
      - |
        set -eu
        project_python="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
        [ -n "$project_python" ] && [ -x "$project_python" ]
        uv pip install --python "$project_python" 'maturin>=1,<2'
        project_venv="$("$project_python" -c 'import sys; print(sys.prefix)')"
        [ -n "$project_venv" ] && [ -d "$project_venv" ]
        VIRTUAL_ENV="$project_venv" "$project_python" -m maturin develop --locked --profile dev

  python:
    desc: Execute the canonical Python released-call gate on the freshly built extension
    env:
      UV_NO_SYNC: "1"
    cmds:
      - task python:test:released-constructors

  swift-build:
    desc: Build only the native archives required by the committed Swift binding
    cmds:
      - cargo build --locked --release -p crawlberg-swift -p crawlberg-ffi

  swift:
    desc: Execute the canonical Swift released-call gate without regenerating bindings
    cmds:
      - swift --version
      - task: :swift:test:released-constructors
