version: "3"

includes:
  _cfg:
    taskfile: ../config/vars.yml
    internal: true

tasks:
  ci:release-prerequisites:test:
    desc: Test release registry gates and PHP packaging prerequisites
    cmds:
      - uv run --no-project --with pyyaml==6.0.3 python scripts/ci/test_release_prerequisites.py
      - uv run --no-project --with pyyaml==6.0.3 python -m unittest discover -s scripts/ci -p test_release_dry_run.py
      - uv run --no-project --with pyyaml==6.0.3 python -m unittest discover -s scripts/ci -p test_fork_publication.py

  shell:lint:
    desc: Lint shell scripts with auto-fix (shfmt + shellcheck)
    cmds:
      - cmd: bash scripts/task/shell-lint.sh fix
        platforms: [linux, darwin]
      - cmd: echo "Shell linting not available on Windows - shell scripts are Unix-specific"
        platforms: [windows]

  shell:lint:check:
    desc: Lint shell scripts in check-only mode (shfmt + shellcheck)
    cmds:
      - cmd: bash scripts/task/shell-lint.sh check
        platforms: [linux, darwin]
      - cmd: echo "Shell linting not available on Windows - shell scripts are Unix-specific"
        platforms: [windows]

  github:lint:
    desc: Lint GitHub Actions workflows (actionlint)
    cmds:
      - cmd: actionlint
        ignore_error: true
