version: "3"

tasks:
  sync:
    desc: Sync version from Cargo.toml to all package manifests
    cmds:
      - alef sync-versions
      # ~keep `alef sync-versions` rewrites MANIFESTS ONLY. Everything generated from the
      # version -- README install snippets, test-app installers, e2e download scripts, stubs,
      # scaffolding -- is produced by separate subcommands, so a bump that stops at
      # sync-versions leaves generated files contradicting the manifests beside them.
      # liter-llm v1.19.0 and tree-sitter-language-pack v1.16.0 were both tagged in exactly
      # that state and reached no registry. Each command below writes a different part of that
      # surface; none is redundant with another.
      #
      # `alef docs` is deliberately NOT here. It aborts on doc-snippet typechecking, and when
      # it aborts it has already written the reference pages WITHOUT their `alef:hash:` lines,
      # which flips `alef verify` from pass to fail. Run it separately and deliberately.
      - "{{.ALEF}} generate"
      - "{{.ALEF}} stubs"
      - "{{.ALEF}} scaffold"
      - "{{.ALEF}} readme"
      - "{{.ALEF}} test-apps generate"
      - "{{.ALEF}} e2e generate"
      # Sync the coding-agent plugin: pin plugin/.ai-rulez/config.toml [plugin].version
      # to core, then regenerate the per-runtime bundles under plugin/ from it. ~keep
      - python3 scripts/sync_plugin_version.py
      - ai-rulez generate --plugin
      # ~keep The gate. A bump is not finished because the commands above exited 0 -- each
      # reports only on what it writes. `alef verify` is the only step that looks at the whole
      # managed surface at once. Read its output: it exits 0 while still reporting frozen paths
      # that drifted, so a zero exit code is necessary and not sufficient.
      - "{{.ALEF}} verify"

  bump:major:
    desc: Bump major version and sync all packages
    cmds:
      - alef sync-versions --bump major
      - task: sync

  bump:minor:
    desc: Bump minor version and sync all packages
    cmds:
      - alef sync-versions --bump minor
      - task: sync

  bump:patch:
    desc: Bump patch version and sync all packages
    cmds:
      - alef sync-versions --bump patch
      - task: sync

  set:
    desc: "Set version explicitly and sync all packages (usage: task version:set VERSION=0.3.0-rc.44)"
    requires:
      vars: [VERSION]
    cmds:
      - alef sync-versions --set {{.VERSION}}
      - task: sync

  check:
    desc: "Check if versions are synchronized (dry-run)"
    cmds:
      - cmd: grep -m 1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/'
        silent: false

  show:
    desc: "Show current version from Cargo.toml"
    cmds:
      - cmd: grep -m 1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/'
        silent: false
