version: "3"

tasks:
  alef:install:
    desc: Install the alef CLI from the sibling repo (../alef) at HEAD
    cmds:
      - cargo install --path ../alef --locked

  alef:generate:
    desc: Regenerate all Alef-managed outputs without building
    cmds:
      # ~keep `alef all` never builds the per-language artifacts that a `compile`/`typecheck`
      # `docs.snippets.validation_level` needs (only `alef build` does), so leaving validation on
      # spawns a doomed toolchain per snippet and cannot pass by construction. Discovery, the
      # reference-page audit and gap detection still run. Use `task alef:snippets` after
      # `alef build` when you actually want validation.
      - alef all --clean --skip-snippet-validation

  alef:verify:
    desc: Check Alef-generated files are up to date
    cmds:
      - alef verify --exit-code

  alef:build:
    desc: Build all language bindings
    cmds:
      - task: :build:bindings

  alef:bump:
    desc: "Bump alef version pin in alef.toml + reinstall + generate (usage: VERSION=0.15.30 task alef:bump)"
    requires:
      vars: [VERSION]
    cmds:
      - sed -i.bak 's/^alef_version = .*/alef_version = "{{.VERSION}}"/' alef.toml
      - rm -f alef.toml.bak
      - task: alef:install
      - task: alef:generate

  mock-server:rebuild:
    desc: Rebuild the alef-generated e2e mock-server binary
    dir: e2e/rust
    cmds:
      - cargo build --release --bin mock-server

  clean:e2e:
    desc: Remove per-language e2e test dependencies (venvs, lockfiles, build dirs)
    cmds:
      - rm -rf e2e/python/.venv e2e/python/.pytest_cache
      - rm -rf e2e/node/node_modules
      - rm -rf e2e/ruby/.bundle e2e/ruby/Gemfile.lock e2e/ruby/spec/coverage
      - rm -rf e2e/php/vendor e2e/php/composer.lock
      - rm -rf e2e/elixir/_build e2e/elixir/deps
      - rm -rf e2e/csharp/bin e2e/csharp/obj
      - rm -rf e2e/java/target
      - rm -rf e2e/go/.gocache
      - rm -rf e2e/rust/target
      - rm -rf e2e/wasm/node_modules e2e/wasm/dist
      - rm -f .mock-server.pid .mock-server.env .mock-server.out

  clean:workspace:
    desc: Clean Rust workspace target + alef IR cache + legacy mock-server binaries
    cmds:
      - cargo clean
      - rm -rf .alef-cache
      - rm -f target/release/mock-server target/debug/mock-server

  clean:full:
    desc: "Total cleanup: per-language clean + workspace + e2e deps"
    cmds:
      - task: :clean
      - task: clean:workspace
      - task: clean:e2e

  rebuild:bindings:
    desc: Rebuild all language bindings + the alef-generated mock-server
    cmds:
      - task: :rust:ffi:build:dev
      - task: :c:build:dev
      - task: :python:build:dev
      - task: :node:build:dev
      - task: :ruby:build
      - task: :php:build
      - task: :go:build
      - task: :java:build
      - task: :csharp:build
      - task: :wasm:build:dev
      - task: mock-server:rebuild

  rebuild:fast:
    desc: "Fast rebuild: Rust core + Python + Node + mock-server (skip JVM/CLR/etc.)"
    cmds:
      - task: :rust:ffi:build:dev
      - task: :python:build:dev
      - task: :node:build:dev
      - task: mock-server:rebuild

  python:cycle:
    desc: "Python: rebuild binding + force-refresh e2e venv + run e2e"
    cmds:
      - task: :python:build:dev
      - cmd: cd e2e/python && uv sync --reinstall --quiet
      - task: :python:e2e:test

  e2e:reset:
    desc: "Full reset: clean + alef generate + rebuild all bindings + run all e2e"
    cmds:
      - task: clean:full
      - task: alef:generate
      - task: rebuild:bindings
      - task: :e2e:test

  e2e:refresh:
    desc: "Quick refresh: alef generate + rebuild all bindings + run all e2e (no clean)"
    cmds:
      - task: alef:generate
      - task: rebuild:bindings
      - task: :e2e:test

  e2e:refresh:fast:
    desc: "Fast feedback: alef generate + rebuild Rust/Python/Node + run their e2e suites"
    cmds:
      - task: alef:generate
      - task: rebuild:fast
      - task: :rust:e2e:test
      - task: python:cycle
      - task: :node:e2e:test
