version: "3"
tasks:
  build:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - python3 scripts/ci/linux-child-attach.py --mode build
  probe:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - python3 scripts/ci/linux-child-attach.py --mode probe
  self-test:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - python3 scripts/ci/linux-child-attach.py --mode self-test
  structural-guard:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - python3 scripts/ci/linux-child-attach.py --mode structural-guard
  engine-receipt:test:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - python3 scripts/ci/test_linux_snap_receipt.py
