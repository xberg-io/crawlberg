version: "3"

includes:
  _cfg:
    taskfile: ../config/vars.yml
    internal: true
  _platforms:
    taskfile: ../config/platforms.yml
    internal: true

tasks:
  install:
    desc: Install Node/TypeScript dependencies
    dir: crates/crawlberg-node
    cmds:
      - corepack enable
      - pnpm install -r

  setup:
    desc: Alias for install task
    cmds:
      - task: node:install

  build:
    desc: Build Node/TypeScript native bindings (uses {{.BUILD_PROFILE}})
    dir: crates/crawlberg-node
    cmds:
      - task: build:{{.BUILD_PROFILE | default "release"}}

  build:dev:
    desc: Build Node/TypeScript native bindings in debug mode
    dir: crates/crawlberg-node
    cmds:
      - pnpm exec napi build --no-js --platform --dts index.native.d.ts

  build:release:
    desc: Build Node/TypeScript native bindings in release mode (optimized)
    dir: crates/crawlberg-node
    cmds:
      - pnpm exec napi build --no-js --platform --dts index.native.d.ts --release --strip

  build:ci:
    desc: Build Node/TypeScript native bindings in CI mode (with debug info)
    cmds:
      - cmd: |
          cd crates/crawlberg-node
          corepack enable
          pnpm install -r
          pnpm exec napi build --no-js --platform --dts index.native.d.ts --release

  build:bindings:
    desc: Build Node bindings for benchmarking
    cmds:
      - bash scripts/benchmarks/build-node-bindings.sh

  test:
    desc: Run Node/TypeScript tests
    dir: crates/crawlberg-node
    env:
      ORT_DYLIB_PATH: /opt/homebrew/lib/libonnxruntime.dylib
    cmds:
      - pnpm test

  test:ci:
    desc: Run Node/TypeScript tests in CI mode
    dir: crates/crawlberg-node
    env:
      ORT_DYLIB_PATH: /opt/homebrew/lib/libonnxruntime.dylib
    cmds:
      - pnpm test

  test:released-exports:
    desc: Check released Node runtime exports through CommonJS and ESM
    cmds:
      - node --test scripts/tests/node-binding-exports.test.mjs

  clippy:
    desc: Run clippy on crawlberg-node crate
    cmds:
      - cargo clippy -p crawlberg-node -- -D warnings

  lint:
    desc: Auto-fix Node/TypeScript code linting (oxlint)
    cmds:
      - poly lint crates/crawlberg-node

  lint:check:
    desc: Check Node/TypeScript code linting without modifications (oxlint)
    cmds:
      - poly lint crates/crawlberg-node

  format:
    desc: Format Node/TypeScript code with modifications (oxfmt)
    cmds:
      - poly fmt --fix crates/crawlberg-node

  format:check:
    desc: Check Node/TypeScript code formatting without modifications (oxfmt)
    cmds:
      - poly fmt --fix crates/crawlberg-node

  clean:
    desc: Clean Node/TypeScript build artifacts
    dir: crates/crawlberg-node
    cmds:
      - python -c "import shutil; [shutil.rmtree(d, ignore_errors=True) for d in ['dist', 'build', 'node_modules']]"
      - python -c "import shutil, os; [shutil.rmtree(os.path.join(r, d), ignore_errors=True) for r, dirs, _ in os.walk('.') for d in dirs if d == '.turbo']"

  update:
    desc: Update Node/TypeScript dependencies (all workspace packages)
    cmds:
      - echo "Updating Node/TypeScript dependencies across workspace..."
      - cmd: corepack up
        ignore_error: true
      - cmd: pnpm up --latest -r
        ignore_error: true
      - cmd: pnpm up --latest -w
        ignore_error: true

  e2e:generate:
    desc: Generate and format TypeScript E2E tests
    cmds:
      - cmd: bash scripts/task/e2e-typescript-generate.sh
        platforms: [linux, darwin]
      - cmd: echo "E2E generation not yet supported on Windows - use WSL or CI"
        platforms: [windows]
      - task: e2e:lint

  e2e:lint:
    desc: Lint TypeScript E2E code
    cmds:
      - poly fmt --fix e2e/node
      - poly lint e2e/node

  e2e:test:
    desc: Run TypeScript E2E tests
    dir: e2e/node
    cmds:
      - pnpm install --silent
      - pnpm test

  e2e:verify:
    desc: Regenerate and validate TypeScript E2E suite (generate + lint + test)
    cmds:
      - task: e2e:generate
      - task: e2e:lint
      - task: e2e:test
