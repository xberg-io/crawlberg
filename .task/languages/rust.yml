version: "3"

includes:
  _cfg:
    taskfile: ../config/vars.yml
    internal: true
  _platforms:
    taskfile: ../config/platforms.yml
    internal: true

vars:
  RUST_LOG: info
  CARGO_PATH_PREFIX: '{{if eq OS "windows"}}{{._cfg.MSVC_BIN_PATH}}{{if ._cfg.MSVC_BIN_PATH}}:{{end}}{{end}}'
  CMAKE_PATH:
    sh: |
      if [ "{{OS}}" != "windows" ]; then
        echo ""
        exit 0
      fi
      powershell -NoProfile -Command '
        $cmakePath = "C:\Program Files\CMake\bin\cmake.exe"
        if (Test-Path $cmakePath) { $cmakePath }
      ' 2>/dev/null || echo ""

tasks:
  install:
    desc: Install Rust toolchain and tools (rustup, cargo-deny)
    cmds:
      - echo "Rust toolchain is typically installed via rustup"
      - rustc --version
      - cmd: rustup component add llvm-tools
        platforms: [windows]
      - task: install:cargo-deny

  install:cargo-deny:
    desc: Install cargo-deny for license checking
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - echo "Installing cargo-deny for license checking..."
      - cmd: cargo-deny --version 2>/dev/null || cargo install cargo-deny
        ignore_error: true

  build:
    desc: Build all Rust crates (uses {{.BUILD_PROFILE}})
    cmds:
      - task: build:{{.BUILD_PROFILE | default "release"}}

  build:dev:
    desc: Build all Rust crates in debug mode
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
    cmds:
      - cmd: cargo build --workspace --all-features --exclude crawlberg-php --exclude crawlberg-node --exclude crawlberg-wasm
        platforms: [linux, darwin]
      - cmd: cargo build --workspace --all-features --exclude crawlberg-php --exclude crawlberg-node --exclude crawlberg-wasm
        platforms: [windows]

  build:release:
    desc: Build all Rust crates in release mode (optimized)
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
    cmds:
      - cmd: cargo build --release --workspace --all-features --exclude crawlberg-php --exclude crawlberg-node --exclude crawlberg-wasm
        platforms: [linux, darwin]
      - cmd: cargo build --release --workspace --all-features --exclude crawlberg-php --exclude crawlberg-node --exclude crawlberg-wasm
        platforms: [windows]

  build:ci:
    desc: Build all Rust crates in CI mode (with debug info)
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
      RUSTFLAGS: "-C debuginfo=2"
    cmds:
      - cmd: cargo build --release --workspace --all-features --exclude crawlberg-php --exclude crawlberg-node --exclude crawlberg-wasm
        platforms: [linux, darwin]
      - cmd: cargo build --release --workspace --all-features --exclude crawlberg-php --exclude crawlberg-node --exclude crawlberg-wasm
        platforms: [windows]

  build:profiling:
    desc: Build all Rust crates with profiling features (for flamegraph generation)
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
      ENABLE_PROFILING: "true"
      RUSTFLAGS: "-g"
    cmds:
      - cargo build --workspace --release --features full,profiling,api,mcp,otel --exclude crawlberg-php --exclude crawlberg-node --exclude crawlberg-wasm

  cli:build:
    desc: Build CLI binary
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
    cmds:
      - cargo build --release --package crawlberg-cli {{if .TARGET}}--target {{.TARGET}}{{end}}

  cli:build:dev:
    desc: Build CLI binary in debug mode
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
    cmds:
      - cargo build --package crawlberg-cli

  cli:install:
    desc: Install CLI binary
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
    cmds:
      - cargo install --path crates/crawlberg-cli

  ffi:build:
    desc: Build FFI library for language bindings
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
    cmds:
      - cargo build --release --package crawlberg-ffi {{.CARGO_ARGS | default ""}}

  ffi:build:dev:
    desc: Build FFI library in debug mode
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
    cmds:
      - cargo build --package crawlberg-ffi {{.CARGO_ARGS | default ""}}

  ffi:build:ci:
    desc: Build FFI library in CI mode (with debug info)
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      CMAKE: "{{.CMAKE_PATH}}"
      RUSTFLAGS: "-C debuginfo=2"
    cmds:
      - cargo build --release --package crawlberg-ffi {{.CARGO_ARGS | default ""}}

  test:
    desc: Run all Rust tests
    cmds:
      - cmd: bash scripts/ci/rust/run-unit-tests.sh
        platforms: [linux, darwin]

  test:ci:
    desc: Run Rust tests in CI mode with tessdata setup
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: "always"
    cmds:
      - cmd: bash scripts/ci/rust/run-unit-tests.sh
        platforms: [linux, darwin]

  test:quick:
    desc: Run fast Rust tests (unit tests only)
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - cargo test --lib --workspace --exclude crawlberg-php --exclude crawlberg-node --exclude crawlberg-wasm

  lint:
    desc: Auto-fix Rust code linting (cargo fmt + clippy)
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - cargo fmt --all
      # ~keep node/wasm need no extra toolchain (napi-build only reads cargo-set env vars;
      # crawlberg-wasm has no build.rs), so they lint cleanly everywhere and are no longer
      # excluded. php stays excluded here: ext-php-rs's build script shells out to a `php`
      # binary, which CI now installs for this job but a local machine may not have.
      - cargo clippy --workspace --fix --allow-dirty --allow-staged --exclude crawlberg-php

  lint:check:
    desc: Check Rust code linting without modifications
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      # ~keep deps:check runs FIRST deliberately. `task` stops at the first failing cmd, so
      # wiring it after clippy would mean a clippy failure silently skips it -- which is the
      # exact shape it exists to catch (a sibling repo's equivalent gate aborted before
      # analysing a single crate for weeks, and an unused dependency rode in underneath).
      # It costs seconds; nothing before it can mask it.
      - task: deps:check
      - cargo fmt --all -- --check
      # -A clippy::inherent_to_string: alef-generated swift-bridge crate emits inherent
      # ~keep php stays excluded: ext-php-rs's build script shells out to a `php` binary,
      # which is not guaranteed to be present on every local machine (CI installs it).
      - cargo clippy --workspace --exclude crawlberg-php -- -D warnings -A clippy::inherent_to_string
      - task: fuzz:check
      - task: config:check

  deps:check:
    desc: Fail on dependencies declared in a manifest but never used in its source
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      # ~keep 14 Cargo.toml files already carry curated
      # [package.metadata.cargo-machete] ignored lists, but nothing read them until this
      # task existed -- the suppressions were maintained for a gate that was never wired.
      # A sibling repo's equivalent gate had been aborting before analysing a single crate
      # for weeks, which let an unused dependency ride in under a familiar-looking error,
      # so treat a bare "no unused dependencies" as unproven: plant one and see it fail.
      - cmd: |
          if ! command -v cargo-machete >/dev/null 2>&1; then
            echo "cargo-machete not installed; install with: cargo install cargo-machete" >&2
            exit 1
          fi
          cargo-machete

  fuzz:check:
    desc: Type-check the fuzz targets (separate workspace, not covered by --workspace)
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      # ~keep fuzz/ has its own Cargo.toml and is NOT a workspace member, so
      # `cargo clippy --workspace --all-targets` never compiles it. A field added to
      # HttpResponse broke the fuzz targets and stayed invisible until ci-fuzz went red.
      - cargo check --manifest-path fuzz/Cargo.toml --bins

  config:check:
    desc: Compile the configurations CI's --all-features lint hides
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      # ~keep Without this the check is inert: both failures below were plain warnings
      # locally and only became errors in CI, where setup-rust injects -D warnings.
      RUSTFLAGS: "-D warnings"
    cmds:
      # ~keep --all-features always enables the browser features, so the default-feature
      # build is never linted. That is how dead code reached the v1.2.0 publish run and
      # broke kotlin-android, WASM and crates.io at once — `cargo publish` verifies the
      # package tarball by compiling it with default features too.
      - cargo check -p crawlberg-jni -p crawlberg
      # ~keep wasm32 is likewise never built by --all-features; an unused import that is
      # only unused on wasm32 blocked the WASM package build of v1.2.0.
      - rustup target add wasm32-unknown-unknown
      - cargo check -p crawlberg --target wasm32-unknown-unknown

  format:
    desc: Format Rust code with modifications (cargo fmt)
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - cargo fmt --all

  format:check:
    desc: Check Rust code formatting without modifications
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - cargo fmt --all -- --check

  licenses:
    desc: Check Rust dependency licenses with cargo-deny
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - cargo deny check licenses

  doc:
    desc: Generate Rust documentation and open in browser
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - cargo doc --no-deps --open

  doc:build:
    desc: Build Rust documentation (without opening)
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - cargo doc --no-deps

  clean:
    desc: Clean Rust build artifacts
    cmds:
      - cargo clean

  cache:cleanup:
    desc: Clean up large build artifacts to reduce cache size (for CI)
    cmds:
      - cmd: echo "Cleaning up large build artifacts to reduce cache size..."
        ignore_error: true
      - cmd: find target -type f -name "*.rlib" -size +10M -exec rm -f {} \; 2>/dev/null || true
        ignore_error: true
      - cmd: find target -type f -name "*.so" -size +10M -exec rm -f {} \; 2>/dev/null || true
        ignore_error: true
      - cmd: find target -type f -name "*.dylib" -size +10M -exec rm -f {} \; 2>/dev/null || true
        ignore_error: true
      - cmd: find target -type f -name "*.dll" -size +10M -exec rm -f {} \; 2>/dev/null || true
        ignore_error: true
      - cmd: rm -rf target/*/incremental 2>/dev/null || true
        ignore_error: true
      - echo "Cleanup completed successfully"
      - cmd: du -sh target 2>/dev/null || echo "No target directory found"
        ignore_error: true

  update:
    desc: Update Rust dependencies
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - echo "Updating Rust dependencies (main workspace)..."
      - cargo upgrade --incompatible
      - cargo update
      - cmd: echo "Updating Rust dependencies (Ruby native crate)..."
      - cmd: cargo upgrade --incompatible --manifest-path packages/ruby/ext/crawlberg_rb/native/Cargo.toml
        ignore_error: true
      - cmd: cargo update --manifest-path packages/ruby/ext/crawlberg_rb/native/Cargo.toml
        ignore_error: true

  e2e:generate:
    desc: Generate and format Rust E2E tests from fixtures
    cmds:
      - cmd: bash scripts/task/e2e-generate.sh rust
        platforms: [linux, darwin]
      - cmd: echo "E2E generation not yet supported on Windows - use WSL or CI"
        platforms: [windows]
      - task: e2e:format
      - task: e2e:lint

  e2e:format:
    desc: Format generated Rust E2E sources
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - cargo fmt --manifest-path e2e/rust/Cargo.toml

  e2e:lint:
    desc: Lint Rust E2E crate with clippy
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
    cmds:
      - cargo clippy --manifest-path e2e/rust/Cargo.toml -- -D warnings

  e2e:test:
    desc: Run Rust E2E tests
    env:
      PATH: "{{.CARGO_PATH_PREFIX}}{{.PATH}}"
      RUST_TEST_THREADS: "1"
    dir: e2e/rust
    cmds:
      - cargo test --release

  e2e:verify:
    desc: Regenerate and validate Rust E2E suite (generate + format + lint + test)
    cmds:
      - task: e2e:generate
      - task: e2e:format
      - task: e2e:lint
      - task: e2e:test
