packages:
  - "crates/crawlberg-node"
  - "crates/crawlberg-node/npm/*"
  - "crates/crawlberg-wasm"
  - "e2e/node"
  - "!e2e/wasm"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@xberg-io/*"
  - "@napi-rs/cli@3.10.9"

linkWorkspacePackages: true
sharedWorkspaceLockfile: true
autoInstallPeers: true
hoist: true
