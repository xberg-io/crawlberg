[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2025-0141", "RUSTSEC-2026-0176", "RUSTSEC-2026-0177"]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "bzip2-1.0.6",
  "BSL-1.0",
  "OpenSSL",
  "NCSA",
]
confidence-threshold = 0.8

exceptions = [
  { allow = [
    "MPL-2.0",
  ], crate = "cbindgen" },
  { allow = [
    "MPL-2.0",
  ], crate = "option-ext" },
  { allow = [
    "LGPL-2.1-or-later",
  ], crate = "r-efi" },
  { allow = [
    "MPL-2.0",
  ], crate = "cssparser" },
  { allow = [
    "MPL-2.0",
  ], crate = "cssparser-macros" },
  { allow = [
    "MPL-2.0",
  ], crate = "dtoa-short" },
  { allow = [
    "MPL-2.0",
  ], crate = "selectors" },
  { allow = [
    "MPL-2.0",
  ], crate = "cooked-waker" },
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
